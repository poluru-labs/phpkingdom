    <p class="meta">Replace cy.wait(5000) with an assertion-based wait.</p>
    <h3>Solution</h3>
    <pre><code>cy.get(&#x27;.loaded&#x27;, { timeout: 10000 }).should(&#x27;be.visible&#x27;);
// Prefer retries over fixed sleeps</code></pre>
