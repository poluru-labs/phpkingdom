    <p class="meta">Write a workflow step that runs Cypress in CI.</p>
    <h3>Solution</h3>
    <pre><code>- name: Cypress run
  uses: cypress-io/github-action@v6
  with:
    build: npm run build
    start: npm start
    wait-on: &#x27;http://localhost:3000&#x27;</code></pre>
