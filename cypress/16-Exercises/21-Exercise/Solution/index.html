    <h1>Solution 21 — contains vs get</h1>
    <p class="meta">Prefer get with data-cy over brittle text-only contains for a submit button.</p>
    <h3>Solution</h3>
    <pre><code>cy.get(&#x27;[data-cy=submit]&#x27;).should(&#x27;contain&#x27;, &#x27;Submit&#x27;).click();</code></pre>
