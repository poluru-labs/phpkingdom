    <p class="meta">Read Cypress.env(&#x27;apiUrl&#x27;) in a request.</p>
    <h3>Solution</h3>
    <pre><code>cy.request(`${Cypress.env(&#x27;apiUrl&#x27;)}/health`)
  .its(&#x27;status&#x27;)
  .should(&#x27;eq&#x27;, 200);</code></pre>
