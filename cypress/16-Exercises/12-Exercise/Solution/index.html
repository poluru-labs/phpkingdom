    <p class="meta">POST /api/items and assert status 201.</p>
    <h3>Solution</h3>
    <pre><code>cy.request(&#x27;POST&#x27;, &#x27;/api/items&#x27;, { name: &#x27;Book&#x27; })
  .then((resp) =&gt; {
    expect(resp.status).to.eq(201);
    expect(resp.body).to.have.property(&#x27;id&#x27;);
  });</code></pre>
