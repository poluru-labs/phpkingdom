    <h1>Solution 17 — JWT Header</h1>
    <p class="meta">Set Authorization bearer token before a request.</p>
    <h3>Solution</h3>
    <pre><code>cy.request({
  url: &#x27;/api/me&#x27;,
  headers: { Authorization: `Bearer ${Cypress.env(&#x27;token&#x27;)}` }
}).its(&#x27;status&#x27;).should(&#x27;eq&#x27;, 200);</code></pre>
