    <h1>Solution 02 — First Visit Spec</h1>
    <p class="meta">Write a spec that visits / and asserts the title contains phpkingdom.</p>
    <h3>Solution</h3>
    <pre><code>describe(&#x27;home&#x27;, () =&gt; {
  it(&#x27;loads the home page&#x27;, () =&gt; {
    cy.visit(&#x27;/&#x27;);
    cy.title().should(&#x27;include&#x27;, &#x27;phpkingdom&#x27;);
  });
});</code></pre>
