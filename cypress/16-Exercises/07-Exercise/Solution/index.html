    <h1>Solution 07 — Fixture Load</h1>
    <p class="meta">Load users.json and type the first user&#x27;s email.</p>
    <h3>Solution</h3>
    <pre><code>cy.fixture(&#x27;users&#x27;).then((users) =&gt; {
  cy.get(&#x27;[data-cy=email]&#x27;).type(users[0].email);
});</code></pre>
