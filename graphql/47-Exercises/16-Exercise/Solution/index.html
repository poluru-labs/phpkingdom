    <p class="meta">Return BAD_USER_INPUT for invalid email.</p>
    <h3>Solution</h3>
    <pre><code>throw new GraphQLError(&quot;Invalid email&quot;, {
  extensions: { code: &quot;BAD_USER_INPUT&quot;, field: &quot;email&quot; },
});</code></pre>
