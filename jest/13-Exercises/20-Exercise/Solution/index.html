    <p class="meta">Parameterize add cases with test.each.</p>
    <h3>Solution</h3>
    <pre><code>test.each([
  [1, 1, 2],
  [1, 2, 3],
  [2, 2, 4],
])(&#x27;add(%i, %i) =&gt; %i&#x27;, (a, b, expected) =&gt; {
  expect(a + b).toBe(expected);
});</code></pre>
