    <h1>Solution 12 — Async Await</h1>
    <p class="meta">Test an async function that resolves to &#x27;ok&#x27;.</p>
    <h3>Solution</h3>
    <pre><code>async function load() { return &#x27;ok&#x27;; }

test(&#x27;loads&#x27;, async () =&gt; {
  await expect(load()).resolves.toBe(&#x27;ok&#x27;);
});</code></pre>
