    <h1>Solution 13 — Fake Timers</h1>
    <p class="meta">Advance timers to resolve a setTimeout callback.</p>
    <h3>Solution</h3>
    <pre><code>jest.useFakeTimers();

test(&#x27;timer&#x27;, () =&gt; {
  const fn = jest.fn();
  setTimeout(fn, 1000);
  jest.advanceTimersByTime(1000);
  expect(fn).toHaveBeenCalled();
});</code></pre>
