    <p class="meta">Write a test that expects sum(1, 2) to be 3.</p>
    <h3>Solution</h3>
    <pre><code>function sum(a, b) { return a + b; }

test(&#x27;adds 1 + 2&#x27;, () =&gt; {
  expect(sum(1, 2)).toBe(3);
});</code></pre>
