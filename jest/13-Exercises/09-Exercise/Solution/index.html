    <p class="meta">Create a mock function that returns 42 and assert call count.</p>
    <h3>Solution</h3>
    <pre><code>const fn = jest.fn().mockReturnValue(42);
expect(fn()).toBe(42);
expect(fn).toHaveBeenCalledTimes(1);</code></pre>
