    <h1>Solution 10 — spyOn</h1>
    <p class="meta">Spy on console.log and assert it was called.</p>
    <h3>Solution</h3>
    <pre><code>const spy = jest.spyOn(console, &#x27;log&#x27;).mockImplementation(() =&gt; {});
console.log(&#x27;hi&#x27;);
expect(spy).toHaveBeenCalledWith(&#x27;hi&#x27;);
spy.mockRestore();</code></pre>
