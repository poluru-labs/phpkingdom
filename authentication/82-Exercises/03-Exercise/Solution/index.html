    <h1>Solution 03 — Sign JWT</h1>
    <p class="meta">Sign an access token with 15m expiry.</p>
    <h3>Solution</h3>
    <pre><code>jwt.sign({ sub: user.id, roles: user.roles }, process.env.JWT_SECRET, {
  expiresIn: &quot;15m&quot;,
  issuer: &quot;phpkingdom-auth&quot;,
  audience: &quot;phpkingdom-api&quot;,
});</code></pre>
