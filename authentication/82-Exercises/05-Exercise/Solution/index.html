    <h1>Solution 05 — HttpOnly Cookie</h1>
    <p class="meta">Set a session cookie with Secure and SameSite=Lax.</p>
    <h3>Solution</h3>
    <pre><code>res.cookie(&quot;sid&quot;, sessionId, {
  httpOnly: true,
  secure: true,
  sameSite: &quot;lax&quot;,
  path: &quot;/&quot;,
  maxAge: 1000 * 60 * 60 * 8,
});</code></pre>
