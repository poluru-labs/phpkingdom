<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <meta name="description" content="Toggle documentElement data-bs-theme with a button.">
  <title>Theme Toggle | phpkingdom.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="02-theme-toggle.css">
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Theme Toggle</h1>
    <p class="pk-meta">Toggle documentElement data-bs-theme with a button.</p>
    <div class="pk-demo">
<button type="button" class="btn btn-dark" id="themeToggle">Toggle theme</button><p class="small text-secondary mt-2 mb-0">Applies to the whole page document.</p>
    </div>
  <script>
    document.getElementById("themeToggle").addEventListener("click", () => {
      const root = document.documentElement;
      const next = root.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-bs-theme", next);
    });
  </script>

  </div>
</body>
</html>
