    <div class="pk-demo">
<form class="was-validated"><div class="mb-2"><input class="form-control" required value=""><div class="invalid-feedback">Required field.</div></div><div><input class="form-control" required value="valid input"><div class="valid-feedback">Looks good.</div></div></form>
