<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <meta name="description" content="data-bs-backdrop=static prevents outside click close.">
  <title>Static Backdrop | phpkingdom.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="04-static-backdrop.css">
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Static Backdrop</h1>
    <p class="pk-meta">data-bs-backdrop=static prevents outside click close.</p>
    <div class="pk-demo">
<button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#staticModal">Open static</button><div class="modal fade" id="staticModal" data-bs-backdrop="static" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Static</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">Click outside will not dismiss.</div></div></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
