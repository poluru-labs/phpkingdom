<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <meta name="description" content="Accordions reveal one content section at a time.">
  <title>Basic Accordion | phpkingdom.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="01-basic-accordion.css">
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Basic Accordion</h1>
    <p class="pk-meta">Accordions reveal one content section at a time.</p>
    <div class="pk-demo">
<div class="accordion" id="accExample"><div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#accOne">Section one</button></h2><div id="accOne" class="accordion-collapse collapse show" data-bs-parent="#accExample"><div class="accordion-body">Bootstrap accordion content.</div></div></div><div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#accTwo">Section two</button></h2><div id="accTwo" class="accordion-collapse collapse" data-bs-parent="#accExample"><div class="accordion-body">Another panel.</div></div></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
