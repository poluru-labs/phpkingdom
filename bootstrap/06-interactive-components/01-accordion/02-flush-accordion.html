<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="The flush variant removes background and outer borders.">
  <title>Flush Accordion | phpkingdom.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="02-flush-accordion.css">
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Flush Accordion</h1>
    <p class="pk-meta">The flush variant removes background and outer borders.</p>
    <div class="pk-demo">
<div class="accordion accordion-flush" id="flushAcc"><div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flushOne">Flush item</button></h2><div id="flushOne" class="accordion-collapse collapse" data-bs-parent="#flushAcc"><div class="accordion-body">A cleaner edge-to-edge style.</div></div></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
