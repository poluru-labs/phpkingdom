    <div class="pk-demo">
<div class="accordion accordion-flush" id="accFlush"><div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#af1">Item one</button></h2><div id="af1" class="accordion-collapse collapse show" data-bs-parent="#accFlush"><div class="accordion-body">Flush body.</div></div></div></div>
