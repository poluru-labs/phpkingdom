<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <meta name="description" content="data-bs-placement top/right/bottom/left.">
  <title>Tooltip Directions | phpkingdom.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="02-tooltip-directions.css">
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Tooltip Directions</h1>
    <p class="pk-meta">data-bs-placement top/right/bottom/left.</p>
    <div class="pk-demo">
<div class="d-flex flex-wrap gap-2"><button type="button" class="btn btn-outline-primary" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="top">top</button><button type="button" class="btn btn-outline-primary" data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="right">right</button><button type="button" class="btn btn-outline-primary" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="bottom">bottom</button><button type="button" class="btn btn-outline-primary" data-bs-toggle="tooltip" data-bs-placement="left" data-bs-title="left">left</button></div>
    </div><script>document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach((el)=>new bootstrap.Tooltip(el));</script>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
