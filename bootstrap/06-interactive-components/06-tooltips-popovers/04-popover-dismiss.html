<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="data-bs-trigger=focus for dismissible popovers.">
  <title>Dismiss on Next Click | phpkingdom.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="04-popover-dismiss.css">
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Dismiss on Next Click</h1>
    <p class="pk-meta">data-bs-trigger=focus for dismissible popovers.</p>
    <div class="pk-demo">
<a tabindex="0" class="btn btn-lg btn-danger" role="button" data-bs-toggle="popover" data-bs-trigger="focus" data-bs-title="Dismissible" data-bs-content="Click away to dismiss.">Focus popover</a>
    </div><script>document.querySelectorAll('[data-bs-toggle="popover"]').forEach((el)=>new bootstrap.Popover(el));</script>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
