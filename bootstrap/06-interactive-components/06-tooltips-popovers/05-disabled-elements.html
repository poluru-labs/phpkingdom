<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <meta name="description" content="Wrap disabled buttons so pointer events still fire.">
  <title>Tooltips on Disabled Controls | phpkingdom.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="05-disabled-elements.css">
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Tooltips on Disabled Controls</h1>
    <p class="pk-meta">Wrap disabled buttons so pointer events still fire.</p>
    <div class="pk-note">Disabled buttons do not fire events — wrap them in a span.</div>    <div class="pk-demo">
<span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" data-bs-title="Disabled tooltip"><button class="btn btn-primary pk-s-pointer-events-none" type="button" disabled>Disabled</button></span>
    </div><script>document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach((el)=>new bootstrap.Tooltip(el));</script>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
