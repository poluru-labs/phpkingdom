<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <meta name="description" content="Carousels rotate through slides with controls and indicators.">
  <title>Basic Carousel | phpkingdom.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  :root{
    --pk-bg:#f6f8fb;
    --pk-surface:#ffffff;
    --pk-border:#d9e0ea;
    --pk-text:#213547;
    --pk-muted:#6b7a90;
    --pk-accent:#0d6efd;
    --pk-accent-soft:#e7f1ff;
  }
  body{background:linear-gradient(180deg,#f7f9fc 0%,#eef3f8 100%);color:var(--pk-text)}
  .pk-wrap{max-width:1000px;margin:0 auto;padding:1.25rem 1rem 3rem}
  .pk-brand{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pk-accent)}
  .pk-meta{color:var(--pk-muted)}
  .pk-card{background:var(--pk-surface);border:1px solid var(--pk-border);border-radius:.85rem;padding:1.1rem;box-shadow:0 .5rem 1.25rem rgba(20,40,80,.05)}
  .pk-note{border-left:4px solid var(--pk-accent);background:var(--pk-accent-soft);padding:.85rem 1rem;border-radius:.5rem;margin:1rem 0}
  .pk-demo{background:var(--pk-surface);border:1px solid var(--pk-border);border-radius:.75rem;padding:1rem;margin:1rem 0}
  .pk-list a{text-decoration:none}
  .pk-list a:hover{text-decoration:underline}
  pre.code{background:#1f2937;color:#f9fafb;padding:.9rem 1rem;border-radius:.65rem;overflow:auto;font-size:.88rem}
</style>
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Basic Carousel</h1>
    <p class="pk-meta">Carousels rotate through slides with controls and indicators.</p>
    <div class="pk-demo">
<div id="carouselExample" class="carousel slide"><div class="carousel-inner rounded"><div class="carousel-item active"><img src="https://picsum.photos/seed/bs-carousel-1/900/280" class="d-block w-100" alt="Slide 1"></div><div class="carousel-item"><img src="https://picsum.photos/seed/bs-carousel-2/900/280" class="d-block w-100" alt="Slide 2"></div></div><button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button><button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
