    <h1 class="h3 mt-2">Viewport Meta Required</h1>
    <p class="pk-meta">Mobile layouts need the viewport meta tag.</p>
    <pre class="code"><code>&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;</code></pre>    <div class="pk-note">Without it, Bootstrap’s responsive grid will not behave on phones.</div>
  </div>
