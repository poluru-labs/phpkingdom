<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Multiple Targets</h1>
    <p class="pk-meta">One button can toggle several collapses via a selector.</p>
    <div class="pk-demo">
<button class="btn btn-outline-primary" data-bs-toggle="collapse" data-bs-target=".multi-collapse">Toggle both</button><div class="row g-2 mt-2"><div class="col"><div class="collapse multi-collapse" id="m1"><div class="p-2 bg-primary-subtle">One</div></div></div><div class="col"><div class="collapse multi-collapse" id="m2"><div class="p-2 bg-success-subtle">Two</div></div></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
