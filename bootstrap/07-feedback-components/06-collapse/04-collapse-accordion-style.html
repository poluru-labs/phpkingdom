<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <meta name="description" content="Use buttons that expand sibling panels without accordion chrome.">
  <title>Accordion-Style Toggle | phpkingdom.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Accordion-Style Toggle</h1>
    <p class="pk-meta">Use buttons that expand sibling panels without accordion chrome.</p>
    <div class="pk-demo">
<p class="d-inline-flex gap-1"><button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#panelA">A</button><button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#panelB">B</button></p><div class="collapse show" id="panelA"><div class="alert alert-info">Panel A</div></div><div class="collapse" id="panelB"><div class="alert alert-success">Panel B</div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
