<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <meta name="description" content="JavaScript enables alerts that users can close.">
  <title>Dismissible Alert | phpkingdom.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="03-dismissible-alert.css">
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Dismissible Alert</h1>
    <p class="pk-meta">JavaScript enables alerts that users can close.</p>
    <div class="pk-demo">
<div class="alert alert-info alert-dismissible fade show" role="alert">This alert can be dismissed.<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
