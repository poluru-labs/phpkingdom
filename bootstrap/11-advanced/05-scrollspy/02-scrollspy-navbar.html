<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <meta name="description" content="Spy against a horizontal navbar.">
  <title>Navbar Scrollspy | phpkingdom.com</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="02-scrollspy-navbar.css">
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="small mb-2"><a href="../../../index.html">Bootstrap Tutorials</a></p>
    <h1 class="h3 mt-2">Navbar Scrollspy</h1>
    <p class="pk-meta">Spy against a horizontal navbar.</p>
    <div class="pk-demo">
<nav id="nav-scroll" class="navbar bg-light px-2 rounded mb-2"><nav class="nav"><a class="nav-link" href="#s1">One</a><a class="nav-link" href="#s2">Two</a></nav></nav><div data-bs-spy="scroll" data-bs-target="#nav-scroll" tabindex="0" class="border rounded p-2 pk-scroll-7rem"><h5 id="s1">One</h5><p>Alpha content block.</p><h5 id="s2">Two</h5><p>Beta content block.</p><p>Extra lines.</p></div>
    </div><script>bootstrap.ScrollSpy.getOrCreateInstance(document.querySelector('[data-bs-spy=scroll]'));</script>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
