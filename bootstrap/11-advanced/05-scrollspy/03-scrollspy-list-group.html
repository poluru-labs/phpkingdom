<body>
  <div class="pk-wrap">

    <div class="pk-demo">
<div class="row g-2"><div class="col-4"><div id="list-ex" class="list-group"><a class="list-group-item list-group-item-action" href="#l1">First</a><a class="list-group-item list-group-item-action" href="#l2">Second</a></div></div><div class="col-8"><div data-bs-spy="scroll" data-bs-target="#list-ex" tabindex="0" class="border rounded p-2 pk-scroll-7rem"><h5 id="l1">First</h5><p>Content…</p><h5 id="l2">Second</h5><p>More…</p><p>Scroll room.</p></div></div></div>
    </div><script>bootstrap.ScrollSpy.getOrCreateInstance(document.querySelector('[data-bs-spy=scroll]'));</script>
