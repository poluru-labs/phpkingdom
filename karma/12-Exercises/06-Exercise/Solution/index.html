    <h1>Solution 06 — ChromeHeadless CI</h1>
    <p class="meta">Add a custom launcher with --no-sandbox for CI.</p>
    <h3>Solution</h3>
    <pre><code>customLaunchers: {
  ChromeHeadlessCI: {
    base: &#x27;ChromeHeadless&#x27;,
    flags: [&#x27;--no-sandbox&#x27;, &#x27;--disable-gpu&#x27;]
  }
},
browsers: [&#x27;ChromeHeadlessCI&#x27;]</code></pre>
