    <h1>Solution 09 — Coverage Thresholds</h1>
    <p class="meta">Fail the build when statements coverage drops below 80%.</p>
    <h3>Solution</h3>
    <pre><code>coverageReporter: {
  check: {
    global: {
      statements: 80,
      branches: 70,
      functions: 80,
      lines: 80
    }
  }
}</code></pre>
