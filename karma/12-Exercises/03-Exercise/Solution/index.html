    <p class="meta">Write a Jasmine describe/it that expects add(2, 3) to be 5.</p>
    <h3>Solution</h3>
    <pre><code>function add(a, b) { return a + b; }

describe(&#x27;add&#x27;, function () {
  it(&#x27;adds two numbers&#x27;, function () {
    expect(add(2, 3)).toBe(5);
  });
});</code></pre>
