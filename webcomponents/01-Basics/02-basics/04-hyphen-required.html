    #out { white-space: pre-wrap; background: #f4f4f4; padding: 0.75rem; min-height: 2rem; }

</style>
</head>
<body>
  <h1>Hyphenated Names Required</h1>
  <p class="meta">Custom element names must include a hyphen.</p>
<div class="note">Try defining without a hyphen — it throws.</div><pre id="out"></pre>
  <script>
try {
  customElements.define("nohyphen", class extends HTMLElement {});
} catch (e) {
  document.getElementById("out").textContent = e.name + ": " + e.message;
}
  </script>
</body>
