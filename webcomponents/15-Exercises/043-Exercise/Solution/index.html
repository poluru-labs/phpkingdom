  <h2>Solution</h2>
  <p>No leaked click handlers.</p>
  <div id="demo"></div>
  <pre id="out"></pre>
  <p><a href="../Problem/index.html">Back to Problem</a></p>

  connectedCallback() {
    this.textContent = 'Remove listener on disconnect';
  }
});

document.getElementById("out").textContent = 'No leaked click handlers.';
