<body>
  <h1>Exercise 015 — CustomEvent notify — Solution</h1>
  <p class="meta">Emit notify with detail {ok:true} on click.</p>
  <h2>Solution</h2>
  <p>Emit notify with detail {ok:true} on click.</p>
  <div id="demo"></div>
  <pre id="out"></pre>
  <p><a href="../Problem/index.html">Back to Problem</a></p>
  <script>
customElements.define("ex015-el", class extends HTMLElement {
  connectedCallback() {
    this.innerHTML = "<button>Go</button>";
    this.querySelector("button").onclick = () => {
      this.dispatchEvent(new CustomEvent("notify", { detail: { ok: true }, bubbles: true }));
    };
  }
});
const el = document.createElement("ex015-el");
el.addEventListener("notify", (e) => {
  document.getElementById("out").textContent = JSON.stringify(e.detail);
});
document.getElementById("demo").append(el);
  </script>
</body>
</html>
