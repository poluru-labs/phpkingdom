  <h1>Exercise 008 — Closed shadow root — Solution</h1>
  <p class="meta">Show element.shadowRoot is null when closed.</p>
  <h2>Solution</h2>
  <p>Show element.shadowRoot is null when closed.</p>
  <div id="demo"></div>
  <pre id="out"></pre>
  <p><a href="../Problem/index.html">Back to Problem</a></p>
  <script>
customElements.define("ex008-el", class extends HTMLElement {
  connectedCallback() {
    this.textContent = 'Closed shadow root';
  }
});
document.getElementById("demo").innerHTML = "<ex008-el></ex008-el>";
document.getElementById("out").textContent = 'Show element.shadowRoot is null when closed.';
  </script>
