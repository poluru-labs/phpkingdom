<body>
  <h1>Exercise 007 — Open shadow root — Solution</h1>
  <p class="meta">Create open shadow with a <p> inside.</p>
  <h2>Solution</h2>
  <p>Create open shadow with a <p> inside.</p>
  <div id="demo"></div>
  <pre id="out"></pre>
  <p><a href="../Problem/index.html">Back to Problem</a></p>
  <script>
customElements.define("ex007-el", class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: "open" }).innerHTML = "<p>Inside shadow</p>";
  }
});
document.getElementById("demo").innerHTML = "<ex007-el></ex007-el>";
document.getElementById("out").textContent = "open shadow created";
  </script>
</body>
