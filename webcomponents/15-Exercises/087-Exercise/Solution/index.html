  <h1>Exercise 087 — Tooltip host title — Solution</h1>
  <p class="meta">Show title attribute in shadow.</p>
  <h2>Solution</h2>
  <p>Show title attribute in shadow.</p>
  <div id="demo"></div>
  <pre id="out"></pre>
  <p><a href="../Problem/index.html">Back to Problem</a></p>
  <script>
customElements.define("ex087-el", class extends HTMLElement {
  connectedCallback() {
    this.textContent = 'Tooltip host title';
  }
});
document.getElementById("demo").innerHTML = "<ex087-el></ex087-el>";
document.getElementById("out").textContent = 'Show title attribute in shadow.';
  </script>
