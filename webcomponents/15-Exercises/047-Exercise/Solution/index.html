  <h1>Exercise 047 — Upgrade existing element — Solution</h1>
  <p class="meta">Define after element already in DOM.</p>
  <h2>Solution</h2>
  <p>Define after element already in DOM.</p>
  <div id="demo"></div>
  <pre id="out"></pre>
  <p><a href="../Problem/index.html">Back to Problem</a></p>
  <script>
customElements.define("ex047-el", class extends HTMLElement {
  connectedCallback() {
    this.textContent = 'Upgrade existing element';
  }
});
document.getElementById("demo").innerHTML = "<ex047-el></ex047-el>";
document.getElementById("out").textContent = 'Define after element already in DOM.';
  </script>
