  <h1>Exercise 001 — Define hello-world custom element — Solution</h1>
  <p class="meta">Register hello-world that sets textContent to Hello.</p>
  <h2>Solution</h2>
  <p>Register hello-world that sets textContent to Hello.</p>
  <div id="demo"></div>
  <pre id="out"></pre>
  <p><a href="../Problem/index.html">Back to Problem</a></p>
  <script>
customElements.define("hello-world", class extends HTMLElement {
  connectedCallback() { this.textContent = "Hello"; }
});
document.getElementById("demo").innerHTML = "<hello-world></hello-world>";
document.getElementById("out").textContent = "done";
  </script>
