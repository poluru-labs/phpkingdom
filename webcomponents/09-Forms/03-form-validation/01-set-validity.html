<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>setValidity | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .note { background: #ecfeff; padding: 0.75rem 1rem; border-left: 3px solid #0e7490; margin: 1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background: #111827; color: #e5e7eb; padding: 0.85rem 1rem; overflow: auto; }
    #out { white-space: pre-wrap; background: #f4f4f4; padding: 0.75rem; min-height: 2rem; }
    .demo { margin: 1rem 0; padding: 1rem; border: 1px dashed #94a3b8; }
</style>
</head>
<body>
  <h1>setValidity</h1>
  <p class="meta">Wire into native constraint validation.</p>
<form id="vf"><valid-el></valid-el>
<button>Check</button></form>
<pre id="out"></pre>
  <script>
customElements.define("valid-el", class extends HTMLElement {
  static formAssociated = true;
  constructor() {
    super();
    this.i = this.attachInternals();
    const r = this.attachShadow({ mode: "open" });
    r.innerHTML = '<input id="v" />';
    const input = r.getElementById("v");
    const sync = () => {
      if (!input.value) this.i.setValidity({ valueMissing: true }, "Required");
      else this.i.setValidity({});
      this.i.setFormValue(input.value);
    };
    input.addEventListener("input", sync);
    sync();
  }
});
document.getElementById("vf").onsubmit = (e) => {
  e.preventDefault();
  document.getElementById("out").textContent =
    e.target.checkValidity() ? "valid" : "invalid";
};
  </script>
</body>
</html>
