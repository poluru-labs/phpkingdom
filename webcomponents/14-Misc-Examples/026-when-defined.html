<!DOCTYPE html>

<head>

  <title>026 — when-defined | phpkingdom.com</title>
  
</head>
<body>
  <h1>026 — when-defined</h1>
  <p class="meta">customElements.whenDefined('x')</p>
  <p>customElements.whenDefined('x')</p>
<pre id="out"></pre>
  <script>
customElements.define("misc-ready", class extends HTMLElement {});
customElements.whenDefined("misc-ready").then(() => {
  document.getElementById("out").textContent = "ready";
});
  </script>
</body>
</html>
