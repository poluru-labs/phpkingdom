<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>007 — attach-shadow-open | phpkingdom.com</title>
  
</head>
<body>
  <h1>007 — attach-shadow-open</h1>
  <p class="meta">attachShadow({mode:'open'})</p>
  <p>attachShadow({mode:'open'})</p>
<pre id="out"></pre>
  <script>
const el = document.createElement("div");
el.attachShadow({mode:"open"}).textContent = "shadow";
document.getElementById("out").textContent = el.shadowRoot.textContent;
  </script>
</body>
</html>
