  <h1>001 — define-basic</h1>
  <p class="meta">customElements.define('x-el', class extends HTMLElement{})</p>
  <p>customElements.define('x-el', class extends HTMLElement{})</p>
<pre id="out"></pre>
  <script>
if (!customElements.get("misc-el")) {
  customElements.define("misc-el", class extends HTMLElement {
    connectedCallback(){ this.textContent = "ok"; }
  });
}
document.body.insertAdjacentHTML("beforeend", "<misc-el></misc-el>");
document.getElementById("out").textContent = "defined";
  </script>
</body>
