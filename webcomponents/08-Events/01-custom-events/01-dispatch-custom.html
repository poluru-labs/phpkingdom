<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>dispatchEvent(new CustomEvent) | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .note { background: #ecfeff; padding: 0.75rem 1rem; border-left: 3px solid #0e7490; margin: 1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background: #111827; color: #e5e7eb; padding: 0.85rem 1rem; overflow: auto; }
    #out { white-space: pre-wrap; background: #f4f4f4; padding: 0.75rem; min-height: 2rem; }
    .demo { margin: 1rem 0; padding: 1rem; border: 1px dashed #94a3b8; }
</style>
</head>
<body>
  <h1>dispatchEvent(new CustomEvent)</h1>
  <p class="meta">Notify parents of component actions.</p>
<div class="demo"><notify-el></notify-el></div>
<pre id="out"></pre>
  <script>
customElements.define("notify-el", class extends HTMLElement {
  connectedCallback() {
    this.innerHTML = "<button>Emit</button>";
    this.querySelector("button").onclick = () => {
      this.dispatchEvent(new CustomEvent("notify", { detail: { ok: true }, bubbles: true }));
    };
  }
});
document.querySelector("notify-el").addEventListener("notify", (e) => {
  document.getElementById("out").textContent = JSON.stringify(e.detail);
});
  </script>
</body>
</html>
