<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Observe Visibility | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .note { background: #f0f7fb; padding: 0.75rem 1rem; border-left: 3px solid #0f766e; margin: 1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background: #111827; color: #e5e7eb; padding: 0.85rem 1rem; overflow: auto; }
    button, input, select { font: inherit; padding: 0.4rem 0.55rem; }
    #out { white-space: pre-wrap; background: #f4f4f4; padding: 0.75rem; min-height: 2rem; }
    canvas, video, audio { max-width: 100%; }

  </style>
</head>
<body>
  <h1>Observe Visibility</h1>
  <p class="meta">Callback when target enters viewport.</p>
<p>Scroll down…</p>
<div style="height:420px"></div>
<div id="target" style="padding:16px;border:2px solid #0f766e">Watch me</div>
<div style="height:300px"></div>
<pre id="out" style="position:fixed;top:8px;right:8px;background:#fff;border:1px solid #333;padding:8px">waiting…</pre>
  <script>
const out = document.getElementById("out");
const io = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    out.textContent = entry.isIntersecting ? "visible" : "hidden";
  });
}, { threshold: 0.25 });
io.observe(document.getElementById("target"));
  </script>
</body>
</html>
