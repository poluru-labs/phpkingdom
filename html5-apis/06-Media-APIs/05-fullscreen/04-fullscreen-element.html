<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>requestFullscreen | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .note { background: #f0f7fb; padding: 0.75rem 1rem; border-left: 3px solid #0f766e; margin: 1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background: #111827; color: #e5e7eb; padding: 0.85rem 1rem; overflow: auto; }
    button, input, select, textarea { font: inherit; padding: 0.4rem 0.55rem; }
    button { cursor: pointer; background: #0f766e; color: #fff; border: 0; padding: 0.55rem 1rem; }
    #out { white-space: pre-wrap; background: #f4f4f4; padding: 0.75rem; min-height: 2rem; }
    .demo { margin: 1rem 0; padding: 1rem; border: 1px dashed #94a3b8; }
    canvas, video, audio { max-width: 100%; }
</style>
</head>
<body>
  <h1>requestFullscreen</h1>
  <p class="meta">Fullscreen the demo box.</p>
<div id="box" class="demo">Fullscreen target</div><button type="button" id="go">Enter</button> <button type="button" id="x">Exit</button><pre id="out"></pre>
  <script>
document.getElementById("go").onclick = async () => {
  try {
    await document.getElementById("box").requestFullscreen();
    document.getElementById("out").textContent = "entered";
  } catch (e) {
    document.getElementById("out").textContent = e.message;
  }
};
document.getElementById("x").onclick = async () => {
  if (document.fullscreenElement) await document.exitFullscreen();
  document.getElementById("out").textContent = "exited";
};
  </script>
</body>
</html>
