<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>HTMLMediaElement Basics | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .note { background: #f0f7fb; padding: 0.75rem 1rem; border-left: 3px solid #0f766e; margin: 1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background: #111827; color: #e5e7eb; padding: 0.85rem 1rem; overflow: auto; }
    button, input, select { font: inherit; padding: 0.4rem 0.55rem; }
    #out { white-space: pre-wrap; background: #f4f4f4; padding: 0.75rem; min-height: 2rem; }
    canvas, video, audio { max-width: 100%; }

  </style>
</head>
<body>
  <h1>HTMLMediaElement Basics</h1>
  <p class="meta">play, pause, currentTime on video/audio.</p>
<video id="v" width="320" height="180" controls poster="https://placehold.co/320x180/333/fff?text=Video">
  <source src="" type="video/mp4">
</video>
<button id="play" type="button">play()</button>
<button id="pause" type="button">pause()</button>
<pre id="out"></pre>
  <script>
const v = document.getElementById("v");
document.getElementById("play").onclick = () => v.play().catch((e) => {
  document.getElementById("out").textContent = e.message;
});
document.getElementById("pause").onclick = () => v.pause();
v.addEventListener("timeupdate", () => {
  document.getElementById("out").textContent = "t=" + v.currentTime.toFixed(2);
});
  </script>
</body>
</html>
