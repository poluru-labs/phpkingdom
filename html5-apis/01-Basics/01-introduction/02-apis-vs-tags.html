<body>
  <h1>APIs vs HTML Elements</h1>
  <p class="meta">Elements provide structure; APIs provide programmable capabilities.</p>
<ul>
  <li><code>&lt;canvas&gt;</code> — element; <strong>Canvas API</strong> — draw with JS</li>
  <li><code>&lt;video&gt;</code> — element; <strong>HTMLMediaElement</strong> — play/pause API</li>
  <li><code>localStorage</code> — pure API, no dedicated element</li>
</ul>
