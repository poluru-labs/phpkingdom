<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>024 — FileReader readAsText | phpkingdom.com</title>
</head>
<body>
  <h1>024 — FileReader readAsText</h1>
  <p>Read text files.</p>
<input id="f" type="file"><pre id="out"></pre>
  <script>
document.getElementById("f").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>document.getElementById("out").textContent=String(r.result).slice(0,200);r.readAsText(f);};
  </script>
</body>
</html>
