<!DOCTYPE html>
<html lang="en">
<head>

  <title>042 — IntersectionObserver | phpkingdom.com</title>
</head>
<body>
  <h1>042 — IntersectionObserver</h1>
  <p>Viewport intersection.</p>
<div style="height:300px"></div><div id="t">Target</div><pre id="out"></pre>
  <script>
new IntersectionObserver(es=>document.getElementById("out").textContent=es[0].isIntersecting).observe(document.getElementById("t"));
  </script>
</body>
</html>
