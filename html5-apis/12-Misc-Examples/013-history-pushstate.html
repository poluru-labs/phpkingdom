<body>
  <h1>013 — history.pushState</h1>
  <p>SPA-style URL update.</p>
<button id="b" type="button">push</button><pre id="out"></pre>
  <script>
document.getElementById("b").onclick=()=>{history.pushState({n:1},"", "#api");document.getElementById("out").textContent=location.hash;};
  </script>
</body>
