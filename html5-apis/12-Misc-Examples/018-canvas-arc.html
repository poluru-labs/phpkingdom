<body>
  <h1>018 — canvas arc</h1>
  <p>Draw a circle.</p>
<canvas id="c" width="200" height="80"></canvas>
  <script>
const x=document.getElementById("c").getContext("2d");x.beginPath();x.arc(60,40,25,0,Math.PI*2);x.fill();
  </script>
</body>
