<body>
  <h1>037 — navigator.vibrate</h1>
  <p>Haptic feedback.</p>
<button id="b" type="button">Vibrate</button><pre id="out"></pre>
  <script>
document.getElementById("b").onclick=()=>{document.getElementById("out").textContent=navigator.vibrate?navigator.vibrate(100):"n/a";};
  </script>
</body>
</html>
