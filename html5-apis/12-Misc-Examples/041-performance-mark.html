<body>
  <h1>041 — performance.mark</h1>
  <p>Named marks.</p>
<pre id="out"></pre>
  <script>
performance.mark("a");performance.mark("b");performance.measure("m","a","b");document.getElementById("out").textContent=performance.getEntriesByName("m")[0].duration.toFixed(3);
  </script>
</body>
</html>
