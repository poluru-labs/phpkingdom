<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Canvas Draw | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .note { background: #f0f7fb; padding: 0.75rem 1rem; border-left: 3px solid #0f766e; margin: 1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background: #111827; color: #e5e7eb; padding: 0.85rem 1rem; overflow: auto; }
    button, input, select, textarea { font: inherit; padding: 0.4rem 0.55rem; }
    button { cursor: pointer; background: #0f766e; color: #fff; border: 0; padding: 0.55rem 1rem; }
    #out { white-space: pre-wrap; background: #f4f4f4; padding: 0.75rem; min-height: 2rem; }
    .demo { margin: 1rem 0; padding: 1rem; border: 1px dashed #94a3b8; }
    canvas, video, audio { max-width: 100%; }
</style>
</head>
<body>
  <h1>Canvas Draw</h1>
  <p class="meta">Draw freehand on canvas.</p>
  <div class="note">Draw freehand on canvas.</div>
<canvas id="c" width="360" height="200" style="border:1px solid #ccc;touch-action:none"></canvas><br><button type="button" id="clear">Clear</button>
  <p><a href="../index.html">All templates</a> · <a href="../../index.html">Course home</a></p>
  <script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.strokeStyle = "#0f766e"; ctx.lineWidth = 2;
let drawing = false;
canvas.onmousedown = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
canvas.onmousemove = (e) => { if (!drawing) return; ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); };
canvas.onmouseup = () => { drawing = false; };
document.getElementById("clear").onclick = () => { ctx.clearRect(0,0,canvas.width,canvas.height); };
  </script>
</body>
</html>
