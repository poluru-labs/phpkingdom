    <p class="meta">Compare @size with &gt; and apply larger padding when big.</p>
    <h3>Solution LESS</h3>
    <pre><code>.pad(@size) when (@size &gt; 16px) {
  padding: @size;
}
.pad(@size) when (@size &lt;= 16px) {
  padding: 8px;
}

.hero {
  .pad(24px);
}</code></pre>
