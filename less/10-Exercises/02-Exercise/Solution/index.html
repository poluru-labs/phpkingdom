    <p class="meta">Nest a and &amp;:hover under .nav using LESS nesting.</p>
    <h3>Solution LESS</h3>
    <pre><code>.nav {
  display: flex;
  gap: 1rem;

  a {
    color: #0d6efd;
    text-decoration: none;

    &amp;:hover {
      text-decoration: underline;
    }
  }
}</code></pre>
