    <h1>Solution 23 — CSS Custom Properties</h1>
    <p class="meta">Expose LESS tokens as CSS variables on :root.</p>
    <h3>Solution LESS</h3>
    <pre><code>@brand: #0d6efd;
@ink: #212529;

:root {
  --brand: @brand;
  --ink: @ink;
}

.btn {
  background: var(--brand);
  color: #fff;
}</code></pre>
