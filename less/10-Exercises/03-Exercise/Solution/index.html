    <p class="meta">Write a .center-flex() mixin and call it inside .hero.</p>
    <h3>Solution LESS</h3>
    <pre><code>.center-flex() {
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero {
  .center-flex();
  min-height: 40vh;
}</code></pre>
