    <h1>Solution 20 — Breakpoints Map Pattern</h1>
    <p class="meta">Define @bp-md and use it in a media query for .container.</p>
    <h3>Solution LESS</h3>
    <pre><code>@bp-sm: 576px;
@bp-md: 768px;
@bp-lg: 992px;

@media (min-width: @bp-md) {
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
}</code></pre>
