    <h1>Solution 10 — Interpolation</h1>
    <p class="meta">Build selectors with @{name} for spacing utilities.</p>
    <h3>Solution LESS</h3>
    <pre><code>.loop(@i) when (@i &lt;= 4) {
  .m-@{i} {
    margin: (@i * 0.25rem);
  }
  .loop(@i + 1);
}
.loop(1);</code></pre>
