    <h1>Solution 14 — Recursive Loop</h1>
    <p class="meta">Generate .col-1 … .col-3 with a recursive mixin loop.</p>
    <h3>Solution LESS</h3>
    <pre><code>.cols(@i) when (@i &lt;= 3) {
  .col-@{i} {
    width: percentage(@i / 12);
  }
  .cols(@i + 1);
}
.cols(1);</code></pre>
