    <h1>Solution 08 — POST Body</h1>
    <p class="meta">Enable JSON body parsing and echo req.body on POST /echo.</p>
    <h3>Solution</h3>
    <pre><code>app.use(express.json());
app.post(&#x27;/echo&#x27;, (req, res) =&gt; {
  res.status(201).json(req.body);
});</code></pre>
