    <h1>Solution 05 — Query Parameters</h1>
    <p class="meta">Read ?page= from GET /posts and default to 1.</p>
    <h3>Solution</h3>
    <pre><code>app.get(&#x27;/posts&#x27;, (req, res) =&gt; {
  const page = Number(req.query.page) || 1;
  res.json({ page });
});</code></pre>
