    <h1>Solution 21 — Cookie Set</h1>
    <p class="meta">Set a cookie named sid.</p>
    <h3>Solution</h3>
    <pre><code>const cookieParser = require(&#x27;cookie-parser&#x27;);
app.use(cookieParser());
app.get(&#x27;/login&#x27;, (req, res) =&gt; {
  res.cookie(&#x27;sid&#x27;, &#x27;abc123&#x27;, { httpOnly: true });
  res.json({ ok: true });
});</code></pre>
