    <h1>Solution 11 — GSI Query</h1>
    <p class="meta">Query EmailIndex by email.</p>
    <h3>Solution</h3>
    <pre><code>await doc.send(new QueryCommand({
  TableName: &quot;AppTable&quot;,
  IndexName: &quot;EmailIndex&quot;,
  KeyConditionExpression: &quot;email = :e&quot;,
  ExpressionAttributeValues: { &quot;:e&quot;: &quot;a@b.com&quot; },
}));</code></pre>
