    <p class="meta">Restrict IAM to pk beginning with USER#sub.</p>
    <h3>Solution</h3>
    <pre><code>&quot;Condition&quot;: {
  &quot;ForAllValues:StringLike&quot;: {
    &quot;dynamodb:LeadingKeys&quot;: [&quot;USER#${cognito-identity.amazonaws.com:sub}&quot;]
  }
}</code></pre>
