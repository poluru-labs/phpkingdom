    <h1>Solution 12 — canActivate Guard</h1>
    <p class="meta">Redirect unauthenticated users.</p>
    <h3>Solution</h3>
    <pre><code>export const authGuard: CanActivateFn = () =&gt; {
  const authed = Boolean(localStorage.getItem(&#x27;token&#x27;));
  return authed || inject(Router).createUrlTree([&#x27;/login&#x27;]);
};</code></pre>
