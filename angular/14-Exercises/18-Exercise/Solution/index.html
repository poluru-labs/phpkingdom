    <p class="meta">Transform an observable stream.</p>
    <h3>Solution</h3>
    <pre><code>ids$ = this.http.get&lt;User[]&gt;(&#x27;/api/users&#x27;).pipe(
  map((users) =&gt; users.map((u) =&gt; u.id)),
  filter((ids) =&gt; ids.length &gt; 0),
);</code></pre>
