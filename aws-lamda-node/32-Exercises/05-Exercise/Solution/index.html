    <p class="meta">Return 200 with CORS headers for a GET.</p>
    <h3>Solution</h3>
    <pre><code>return {
  statusCode: 200,
  headers: {
    &quot;content-type&quot;: &quot;application/json&quot;,
    &quot;access-control-allow-origin&quot;: &quot;*&quot;,
  },
  body: JSON.stringify({ items: [] }),
};</code></pre>
