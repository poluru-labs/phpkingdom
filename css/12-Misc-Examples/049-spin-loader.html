@keyframes spin{to{transform:rotate(360deg)}}.loader{width:36px;height:36px;border:3px solid #ccfbf1;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite}

  <div class="demo">
<div class='loader'></div>
