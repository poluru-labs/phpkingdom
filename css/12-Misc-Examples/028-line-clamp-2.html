<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>028 — Line clamp 2 | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, 'Times New Roman', serif; margin: 1.5rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    .demo { margin-top: 1rem; }
.t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:260px}
  </style>
</head>
<body>
  <h1>028 — Line clamp 2</h1>
  <div class="demo">
<p class='t'>This paragraph is clamped to two lines even if there is a lot more text that would otherwise continue wrapping down the page.</p>
  </div>
</body>
</html>
