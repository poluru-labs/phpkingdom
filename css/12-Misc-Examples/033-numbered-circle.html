<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>033 — Circle numbers ol | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, 'Times New Roman', serif; margin: 1.5rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    .demo { margin-top: 1rem; }
ol{list-style:none;counter-reset:n;padding:0}li{counter-increment:n;margin:.5rem 0}li::before{content:counter(n);display:inline-flex;width:1.5rem;height:1.5rem;margin-right:.5rem;border-radius:50%;background:#0f766e;color:#fff;align-items:center;justify-content:center;font-size:.8rem}
  </style>
</head>
<body>
  <h1>033 — Circle numbers ol</h1>
  <div class="demo">
<ol><li>Plan</li><li>Build</li><li>Ship</li></ol>
  </div>
</body>
</html>
