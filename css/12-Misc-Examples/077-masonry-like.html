<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>077 — Dense auto rows | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, 'Times New Roman', serif; margin: 1.5rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    .demo { margin-top: 1rem; }
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:80px;gap:.5rem}.tall{grid-row:span 2;background:#0f766e;color:#fff}.grid div{background:#99f6e4;padding:.5rem}
  </style>
</head>
<body>
  <h1>077 — Dense auto rows</h1>
  <div class="demo">
<div class='grid'><div class='tall'>Tall</div><div>A</div><div>B</div></div>
  </div>
</body>
</html>
