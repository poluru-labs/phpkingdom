<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>023 — 12-col span | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, 'Times New Roman', serif; margin: 1.5rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    .demo { margin-top: 1rem; }
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:.5rem}.a{grid-column:span 8;background:#0f766e;color:#fff;padding:1rem}.b{grid-column:span 4;background:#ccfbf1;padding:1rem}
  </style>
</head>
<body>
  <h1>023 — 12-col span</h1>
  <div class="demo">
<div class='grid'><div class='a'>8</div><div class='b'>4</div></div>
  </div>
</body>
</html>
