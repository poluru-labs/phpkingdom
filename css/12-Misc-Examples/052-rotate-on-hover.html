<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>052 — Rotate hover | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, 'Times New Roman', serif; margin: 1.5rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    .demo { margin-top: 1rem; }
.box{width:70px;height:70px;background:#0f766e;transition:transform .3s}.box:hover{transform:rotate(15deg)}
  </style>
</head>
<body>
  <h1>052 — Rotate hover</h1>
  <div class="demo">
<div class='box'></div>
  </div>
</body>
