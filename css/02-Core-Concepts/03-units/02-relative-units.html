<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Relative Units | phpkingdom.com</title>
  <link rel="stylesheet" href="02-relative-units.css">
</head>
<body>
  <div class="wrap">
    <h1>em, rem, %, vw</h1>
    <p class="meta">Relative units scale with context.</p>

    <div class="demo">
      <p class="rem">1.25rem text</p>
      <p class="em-parent">Parent 20px / <span>child 1.2em</span></p>
      <div class="pct">width: 50%</div>
      <div class="vw">width: 40vw</div>
    </div>

  </div>
</body>
