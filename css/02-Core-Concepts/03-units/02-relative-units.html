<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Relative Units | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

html{font-size:16px}
    .rem{font-size:1.25rem}
    .em-parent{font-size:20px}.em-parent span{font-size:1.2em}
    .pct{width:50%;background:#ccfbf1;padding:.5rem}
    .vw{width:40vw;max-width:100%;background:#99f6e4;padding:.5rem}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>em, rem, %, vw</h1>
    <p class="meta">Relative units scale with context.</p>

    <div class="demo">
      <p class="rem">1.25rem text</p>
      <p class="em-parent">Parent 20px / <span>child 1.2em</span></p>
      <div class="pct">width: 50%</div>
      <div class="vw">width: 40vw</div>
    </div>

  </div>
</body>
</html>
