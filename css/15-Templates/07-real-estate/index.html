<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <meta name="description" content="Find your next place">
  <title>Real Estate Website | Folio Homes | phpkingdom.com</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap nav">
      <strong class="logo">Folio Homes</strong>
      <nav>
        <a href="#listings">Listings</a>
        <a href="#agents">Agents</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>Homes with room to grow</h1>
      <form class="search">
        <input type="text" placeholder="City or ZIP">
        <select><option>Buy</option><option>Rent</option></select>
        <button type="submit">Search</button>
      </form>
    </div>
  </section>

  <section id="listings" class="section wrap">
    <h2>Featured listings</h2>
    <div class="grid">
      <article class="card"><div class="photo p1"></div><h3>Maple Street Cottage</h3><p>$425,000 · 3 bed</p></article>
      <article class="card"><div class="photo p2"></div><h3>Harbor View Condo</h3><p>$610,000 · 2 bed</p></article>
      <article class="card"><div class="photo p3"></div><h3>Cedar Park Home</h3><p>$389,000 · 4 bed</p></article>
    </div>
  </section>

  <section id="agents" class="section tint">
    <div class="wrap"><h2>Local agents</h2><p>Guided buying and selling with neighborhood expertise.</p></div>
  </section>

  <footer class="site-footer"><div class="wrap">&copy; Folio Homes</div></footer>

</body>
</html>
