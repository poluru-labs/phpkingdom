<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Grid Template Areas | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; font-size:.9rem; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; margin:.75rem 0 0; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; margin:1rem 0; font-size:.95rem; }
    a { color: var(--accent); }
    .cell { background:#0f766e; color:#fff; padding:.75rem; text-align:center; border-radius:4px; }
    .cell.alt { background:#115e59; }
    .cell.light { background:#ecfdf5; color:#0f766e; border:1px dashed #0f766e; }

.areas{display:grid;gap:.35rem;grid-template-columns:120px 1fr 100px;grid-template-rows:auto 1fr auto;grid-template-areas:'head head head''nav main aside''foot foot foot';height:200px}.areas header{grid-area:head}.areas nav{grid-area:nav}.areas main{grid-area:main}.areas aside{grid-area:aside}.areas footer{grid-area:foot}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Grid Template Areas</h1>
    <p class="meta">Named areas map layout regions without line numbers.</p>
    <div class="demo">
      <div class="areas">
        <header class="cell">Header</header>
        <nav class="cell">Nav</nav>
        <main class="cell">Main</main>
        <aside class="cell">Aside</aside>
        <footer class="cell">Footer</footer>
      </div>
    </div>
    <pre>grid-template-areas:
  'head head head'
  'nav main aside';</pre>
  </div>
</body>
</html>
