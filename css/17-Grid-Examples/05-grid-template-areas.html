<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Grid Template Areas | phpkingdom.com</title>
  <link rel="stylesheet" href="05-grid-template-areas.css">
</head>
<body>
  <div class="wrap">
    <h1>Grid Template Areas</h1>
    <p class="meta">Named areas map layout regions without line numbers.</p>
    <div class="demo">
      <div class="areas">
        <header class="cell">Header</header>
        <nav class="cell">Nav</nav>
        <main class="cell">Main</main>
        <aside class="cell">Aside</aside>
        <footer class="cell">Footer</footer>
      </div>
    </div>
    <pre>grid-template-areas:
  'head head head'
  'nav main aside';</pre>
  </div>
</body>
</html>
