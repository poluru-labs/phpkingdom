<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Grid Span | phpkingdom.com</title>
  <link rel="stylesheet" href="07-grid-span.css">
</head>
<body>
  <div class="wrap">
    <h1>Grid Span</h1>
    <p class="meta">grid-column and grid-row span let items cover multiple tracks.</p>
    <div class="demo">
      <div class="span-grid"><div class="cell wide">span 2 cols</div><div class="cell">1</div><div class="cell">2</div><div class="cell tall">span 2 rows</div><div class="cell">3</div><div class="cell">4</div></div>
    </div>
    <pre>grid-column: span 2;
grid-row: span 2;</pre>
  </div>
</body>
