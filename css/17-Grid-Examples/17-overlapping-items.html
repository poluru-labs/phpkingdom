<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Overlapping Items | phpkingdom.com</title>
  <link rel="stylesheet" href="17-overlapping-items.css">
</head>
<body>
  <div class="wrap">
    <h1>Overlapping Items</h1>
    <p class="meta">Items can share the same grid cell for layered layouts.</p>
    <div class="demo">
      <div class="overlap">
        <div class="layer base">Background layer</div>
        <div class="layer top">Foreground overlay</div>
      </div>
    </div>
    <pre>grid-column: 1; grid-row: 1; /* stack */</pre>
  </div>
</body>
</html>
