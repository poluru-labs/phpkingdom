<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Alignment Per Cell | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; font-size:.9rem; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; margin:.75rem 0 0; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; margin:1rem 0; font-size:.95rem; }
    a { color: var(--accent); }
    .cell { background:#0f766e; color:#fff; padding:.75rem; text-align:center; border-radius:4px; }
    .cell.alt { background:#115e59; }
    .cell.light { background:#ecfdf5; color:#0f766e; border:1px dashed #0f766e; }

.align-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:90px 90px;gap:.5rem;background:#ecfdf5;padding:.5rem;border-radius:4px}.align-grid .cell{width:60%;height:50%;font-size:.8rem;padding:.35rem}.start{justify-self:start;align-self:start}.center{justify-self:center;align-self:center}.end{justify-self:end;align-self:end}.stretch{justify-self:stretch;align-self:stretch;width:auto;height:auto}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Alignment Per Cell</h1>
    <p class="meta">justify-self and align-self position individual items inside their cells.</p>
    <div class="demo">
      <div class="align-grid"><div class="cell start">start</div><div class="cell center">center</div><div class="cell end">end</div><div class="cell stretch">stretch</div></div>
    </div>
    <pre>justify-self / align-self</pre>
  </div>
</body>
</html>
