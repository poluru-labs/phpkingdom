<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Responsive Grid | phpkingdom.com</title>
  <link rel="stylesheet" href="20-responsive-grid.css">
</head>
<body>
  <div class="wrap">
    <h1>Responsive Grid</h1>
    <p class="meta">Media queries switch column count at breakpoints.</p>
    <div class="demo">
      <div class="responsive">
        <div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div>
      </div>
      <p class="hint">Resize the window: 1 col → 2 cols (480px) → 4 cols (640px).</p>
    </div>
    <pre>@media (min-width:640px) {
  grid-template-columns: repeat(4, 1fr);
}</pre>
  </div>
</body>
</html>
