<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Masonry Note (Grid) | phpkingdom.com</title>
  <link rel="stylesheet" href="21-masonry-grid-note.css">
</head>
<body>
  <div class="wrap">
    <h1>Masonry Note (Grid)</h1>
    <p class="meta">CSS grid masonry is emerging; this demo uses row spans as a simple stand-in.</p>
    <div class="demo">
      <div class="gmasonry">
        <div class="cell">A</div>
        <div class="cell span2">B — taller</div>
        <div class="cell">C</div>
        <div class="cell span2">D — taller</div>
        <div class="cell">E</div>
      </div>
    </div>
    <div class="note">True masonry packing is not fully cross-browser yet; grid-auto-rows with manual spans is a teaching stand-in.</div>
    <pre>grid-template-rows: masonry; /* future */</pre>
  </div>
</body>
</html>
