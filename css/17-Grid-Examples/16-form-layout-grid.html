<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Form Layout Grid | phpkingdom.com</title>
  <link rel="stylesheet" href="16-form-layout-grid.css">
</head>
<body>
  <div class="wrap">
    <h1>Form Layout Grid</h1>
    <p class="meta">Label/field pairs aligned in a two-column form grid.</p>
    <div class="demo">
      <form class="form-grid">
        <label for="name">Name</label><input id="name" type="text" placeholder="Your name">
        <label for="email">Email</label><input id="email" type="email" placeholder="you@example.com">
        <label for="msg">Message</label><textarea id="msg" rows="2" placeholder="Say hello"></textarea>
      </form>
    </div>
    <pre>grid-template-columns: 100px 1fr;</pre>
  </div>
</body>
</html>
