<html lang="en">
<head>

<body>
  <div class="wrap">
    <h1>Display Grid</h1>
    <p class="meta">display:grid creates a two-dimensional layout with rows and columns.</p>
    <div class="demo">
      <div class="grid"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
    </div>
    <pre>display: grid;</pre>
