<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Card Gallery | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; font-size:.9rem; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; margin:.75rem 0 0; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; margin:1rem 0; font-size:.95rem; }
    a { color: var(--accent); }
    .cell { background:#0f766e; color:#fff; padding:.75rem; text-align:center; border-radius:4px; }
    .cell.alt { background:#115e59; }
    .cell.light { background:#ecfdf5; color:#0f766e; border:1px dashed #0f766e; }

.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.75rem}.card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent);padding:.75rem;border-radius:4px}.card h3{margin:0 0 .35rem;font-size:1rem;color:var(--accent)}.card p{margin:0;font-size:.85rem}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Card Gallery</h1>
    <p class="meta">Responsive card grid with auto-fit minmax tracks.</p>
    <div class="demo">
      <div class="gallery">
        <article class="card"><h3>Teal Card</h3><p>Grid gap keeps even spacing.</p></article>
        <article class="card"><h3>Second</h3><p>Cards reflow when the viewport shrinks.</p></article>
        <article class="card"><h3>Third</h3><p>minmax sets a sensible minimum width.</p></article>
      </div>
    </div>
    <pre>repeat(auto-fit, minmax(160px, 1fr))</pre>
  </div>
</body>
</html>
