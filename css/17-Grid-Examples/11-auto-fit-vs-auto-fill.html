<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>auto-fit vs auto-fill | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; font-size:.9rem; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; margin:.75rem 0 0; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; margin:1rem 0; font-size:.95rem; }
    a { color: var(--accent); }
    .cell { background:#0f766e; color:#fff; padding:.75rem; text-align:center; border-radius:4px; }
    .cell.alt { background:#115e59; }
    .cell.light { background:#ecfdf5; color:#0f766e; border:1px dashed #0f766e; }

.label{margin:.75rem 0 .25rem;font-size:.85rem;color:var(--muted)}.fit,.fill{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:.35rem;margin-bottom:.5rem}.fill{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>auto-fit vs auto-fill</h1>
    <p class="meta">auto-fit collapses empty tracks; auto-fill keeps them — compare side by side.</p>
    <div class="demo">
      <p class="label">auto-fit — empty tracks collapse</p>
      <div class="fit"><div class="cell">1</div><div class="cell">2</div></div>
      <p class="label">auto-fill — empty tracks remain</p>
      <div class="fill"><div class="cell">1</div><div class="cell">2</div></div>
    </div>
    <pre>repeat(auto-fit, ...) vs repeat(auto-fill, ...)</pre>
  </div>
</body>
</html>
