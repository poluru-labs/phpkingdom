<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>auto-fit vs auto-fill | phpkingdom.com</title>
  <link rel="stylesheet" href="11-auto-fit-vs-auto-fill.css">
</head>
<body>
  <div class="wrap">
    <h1>auto-fit vs auto-fill</h1>
    <p class="meta">auto-fit collapses empty tracks; auto-fill keeps them — compare side by side.</p>
    <div class="demo">
      <p class="label">auto-fit — empty tracks collapse</p>
      <div class="fit"><div class="cell">1</div><div class="cell">2</div></div>
      <p class="label">auto-fill — empty tracks remain</p>
      <div class="fill"><div class="cell">1</div><div class="cell">2</div></div>
    </div>
    <pre>repeat(auto-fit, ...) vs repeat(auto-fill, ...)</pre>
  </div>
</body>
</html>
