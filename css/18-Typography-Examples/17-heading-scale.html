<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Heading Scale | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; font-size:.85rem; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

    .type-scale h2, .type-scale h3, .type-scale h4, .type-scale h5, .type-scale h6 {
      margin:0 0 .35rem;
      line-height:1.2;
      font-family: system-ui, sans-serif;
    }
    .type-scale .row { padding:.65rem 0; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:1rem; }
    .type-scale .row:last-child { border-bottom:none; }
    .type-scale .tag { min-width:2rem; font-size:.7rem; color:var(--muted); font-family: ui-monospace, Menlo, monospace; }
    .type-scale h2 { font-size:2rem; font-weight:700; color:var(--accent); }
    .type-scale h3 { font-size:1.5rem; font-weight:600; }
    .type-scale h4 { font-size:1.25rem; font-weight:600; }
    .type-scale h5 { font-size:1.1rem; font-weight:600; }
    .type-scale h6 { font-size:.95rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Heading Scale</h1>
    <p class="meta">A clear h2–h6 hierarchy with distinct size and weight.</p>

    <div class="demo">
      <div class="type-scale">
        <div class="row"><span class="tag">h2</span><h2>Page Title</h2></div>
        <div class="row"><span class="tag">h3</span><h3>Section Heading</h3></div>
        <div class="row"><span class="tag">h4</span><h4>Subsection</h4></div>
        <div class="row"><span class="tag">h5</span><h5>Group Label</h5></div>
        <div class="row"><span class="tag">h6</span><h6>Eyebrow / Overline</h6></div>
      </div>
    </div>

    <p class="note">Skip heading levels only when it makes semantic sense. One <code>h1</code> per page is a common convention.</p>
  </div>
</body>
</html>
