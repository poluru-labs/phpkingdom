<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Optical Alignment | phpkingdom.com</title>
  <link rel="stylesheet" href="19-optical-alignment.css">
</head>
<body>
  <div class="wrap">
    <h1>Optical Alignment</h1>
    <p class="meta">Metric alignment vs. visual balance — small nudges matter.</p>

    <div class="demo">
      <div class="compare">
        <div class="panel">
          <h3>Metric (mathematical center)</h3>
          <div class="icon-row metric"><span class="icon">→</span><span>Dashboard</span></div>
          <div class="quote-row metric">&ldquo;</div>
          <div class="cap-label">ALL CAPS LABEL</div>
        </div>
        <div class="panel">
          <h3>Optical (visually centered)</h3>
          <div class="icon-row optical"><span class="icon">→</span><span>Dashboard</span></div>
          <div class="quote-row optical">&ldquo;</div>
          <div class="cap-label optical">ALL CAPS LABEL</div>
        </div>
      </div>
    </div>

    <p class="note">Icons, quotes, and uppercase text often need <code>transform: translateY()</code> to look centered to the human eye.</p>
  </div>
</body>
</html>
