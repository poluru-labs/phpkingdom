<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Optical Alignment | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; font-size:.85rem; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

    .compare { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media (max-width:560px) { .compare { grid-template-columns:1fr; } }
    .panel { padding:.75rem; background:#f8fafc; border:1px dashed var(--line); border-radius:6px; }
    .panel h3 { margin:0 0 .65rem; font-size:.75rem; color:var(--muted); font-family: ui-monospace, Menlo, monospace; font-weight:400; }
    .icon-row { display:flex; align-items:center; gap:.5rem; font-family: system-ui, sans-serif; font-weight:600; margin-bottom:.75rem; }
    .icon { width:2rem; height:2rem; background:var(--accent); color:#fff; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
    .metric .icon-row { align-items:center; }
    .optical .icon { transform:translateY(-1px); }
    .quote-row { font-size:2.5rem; line-height:1; color:var(--accent); font-family: Georgia, serif; }
    .metric .quote-row { line-height:1; }
    .optical .quote-row { margin-top:-.15em; }
    .cap-label { font-size:1.25rem; font-weight:700; font-family: system-ui, sans-serif; }
    .optical .cap-label { display:inline-block; transform:translateY(1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Optical Alignment</h1>
    <p class="meta">Metric alignment vs. visual balance — small nudges matter.</p>

    <div class="demo">
      <div class="compare">
        <div class="panel">
          <h3>Metric (mathematical center)</h3>
          <div class="icon-row metric"><span class="icon">→</span><span>Dashboard</span></div>
          <div class="quote-row metric">&ldquo;</div>
          <div class="cap-label">ALL CAPS LABEL</div>
        </div>
        <div class="panel">
          <h3>Optical (visually centered)</h3>
          <div class="icon-row optical"><span class="icon">→</span><span>Dashboard</span></div>
          <div class="quote-row optical">&ldquo;</div>
          <div class="cap-label optical">ALL CAPS LABEL</div>
        </div>
      </div>
    </div>

    <p class="note">Icons, quotes, and uppercase text often need <code>transform: translateY()</code> to look centered to the human eye.</p>
  </div>
</body>
</html>
