<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Text Transform | phpkingdom.com</title>
  <link rel="stylesheet" href="07-text-transform.css">
</head>
<body>
  <div class="wrap">
    <h1>Text Transform</h1>
    <p class="meta">Change casing in CSS without editing source HTML.</p>

    <div class="demo">
      <div class="transform-grid">
        <div class="transform-row"><code>uppercase</code><span class="upper">navigation menu</span></div>
        <div class="transform-row"><code>lowercase</code><span class="lower">SHOUTING HEADLINE</span></div>
        <div class="transform-row"><code>capitalize</code><span class="capitalize">css typography basics</span></div>
        <div class="transform-row"><code>none</code><span class="none">Preserve Original Casing</span></div>
      </div>
    </div>

    <p class="note">Screen readers may announce transformed text differently. Keep semantic meaning in the HTML.</p>
  </div>
</body>
</html>
