<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Text Transform | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; font-size:.85rem; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

    .transform-grid { display:grid; gap:.65rem; font-family: system-ui, sans-serif; }
    .transform-row { display:flex; gap:1rem; align-items:center; padding:.4rem 0; border-bottom:1px solid var(--line); }
    .transform-row:last-child { border-bottom:none; }
    .transform-row code { min-width:6.5rem; font-size:.75rem; color:var(--muted); }
    .upper { text-transform:uppercase; letter-spacing:.08em; font-size:.85rem; font-weight:600; }
    .lower { text-transform:lowercase; }
    .capitalize { text-transform:capitalize; }
    .none { text-transform:none; font-style:italic; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Text Transform</h1>
    <p class="meta">Change casing in CSS without editing source HTML.</p>

    <div class="demo">
      <div class="transform-grid">
        <div class="transform-row"><code>uppercase</code><span class="upper">navigation menu</span></div>
        <div class="transform-row"><code>lowercase</code><span class="lower">SHOUTING HEADLINE</span></div>
        <div class="transform-row"><code>capitalize</code><span class="capitalize">css typography basics</span></div>
        <div class="transform-row"><code>none</code><span class="none">Preserve Original Casing</span></div>
      </div>
    </div>

    <p class="note">Screen readers may announce transformed text differently. Keep semantic meaning in the HTML.</p>
  </div>
</body>
</html>
