<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Blockquote Style | phpkingdom.com</title>
  <link rel="stylesheet" href="14-blockquote.css">
</head>
<body>
  <div class="wrap">
    <h1>Blockquote Style</h1>
    <p class="meta">Pull quotes with accent border and attribution.</p>

    <div class="demo">
      <blockquote cite="https://polurus.com">
        <p>Good typography is invisible until it fails — then every pixel of spacing becomes obvious.</p>
        <cite>Subrahmanyam Poluru</cite>
      </blockquote>
    </div>

    <p class="note">Use semantic <code>&lt;blockquote&gt;</code> with <code>&lt;cite&gt;</code> for quoted sources.</p>
  </div>
</body>
</html>
