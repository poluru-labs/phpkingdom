<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Blockquote Style | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; font-size:.85rem; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

    blockquote {
      margin:0;
      padding:1rem 1.25rem;
      border-left:4px solid var(--accent);
      background:#ecfdf5;
      font-size:1.1rem;
      font-style:italic;
      color:#134e4a;
    }
    blockquote cite {
      display:block;
      margin-top:.75rem;
      font-size:.9rem;
      font-style:normal;
      color:var(--muted);
    }
    blockquote cite::before { content:"— "; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Blockquote Style</h1>
    <p class="meta">Pull quotes with accent border and attribution.</p>

    <div class="demo">
      <blockquote cite="https://polurus.com">
        <p>Good typography is invisible until it fails — then every pixel of spacing becomes obvious.</p>
        <cite>Subrahmanyam Poluru</cite>
      </blockquote>
    </div>

    <p class="note">Use semantic <code>&lt;blockquote&gt;</code> with <code>&lt;cite&gt;</code> for quoted sources.</p>
  </div>
</body>
</html>
