<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Subgrid Rows | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; margin:1rem 0; }
    a { color: var(--accent); }

.parent{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.card{display:grid;grid-template-rows:subgrid;grid-row:span 2;gap:.5rem;border:1px solid #d9e2ec;padding:.75rem;background:#fff}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Subgrid Rows</h1>
    <p class="meta">Children share parent tracks.</p>
    <div class="note">Cards align rows via subgrid (supporting browsers).</div>
    <pre><code>grid-template-rows: subgrid</code></pre>
    <div class="demo">
<div class="parent"><div class="card"><h3>A</h3><p>Body</p></div><div class="card"><h3>B longer title here</h3><p>Body</p></div></div>
    </div>
  </div>
</body>
</html>
