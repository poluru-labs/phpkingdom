<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Grid Areas | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; margin:1rem 0; }
    a { color: var(--accent); }

.g{display:grid;grid-template-columns:1fr 2fr;grid-template-areas:"side main";gap:.75rem}.side{grid-area:side;background:#ecfdf5;padding:1rem}.main{grid-area:main;background:#fff;border:1px solid #d9e2ec;padding:1rem}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Grid Areas</h1>
    <p class="meta">Name regions with grid-template-areas.</p>
    <div class="note">Sidebar + main.</div>
    <pre><code>grid-template-areas: &quot;side main&quot;;</code></pre>
    <div class="demo">
<div class="g"><div class="side">side</div><div class="main">main</div></div>
    </div>
  </div>
</body>
</html>
