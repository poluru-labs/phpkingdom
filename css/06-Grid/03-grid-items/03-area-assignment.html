<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Area Assignment | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

.layout{display:grid;grid-template-areas:'head head' 'nav main';grid-template-columns:1fr 3fr;gap:.5rem}
    .layout>*{padding:1rem}.head{grid-area:head;background:#134e4a;color:#fff}.nav{grid-area:nav;background:#ccfbf1}.main{grid-area:main;background:#99f6e4}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>grid-area on Items</h1>
    <p class="meta">Assign items to named areas.</p>

    <div class="demo"><div class="layout"><div class="head">head</div><div class="nav">nav</div><div class="main">main</div></div></div>

  </div>
</body>
</html>
