<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Grid Areas Intro | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

.layout{display:grid;grid-template-areas:'header header' 'side main' 'footer footer';grid-template-columns:1fr 2fr;gap:.5rem}
    .layout>*{padding:1rem;background:#ccfbf1}
    .h{grid-area:header}.s{grid-area:side}.m{grid-area:main;background:#99f6e4}.f{grid-area:footer}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Named Grid Areas Intro</h1>
    <p class="meta">Sketch layouts with areas.</p>

    <div class="demo"><div class="layout"><div class="h">Header</div><div class="s">Side</div><div class="m">Main</div><div class="f">Footer</div></div></div>

  </div>
</body>
</html>
