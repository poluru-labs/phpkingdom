<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>container-type | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; margin:1rem 0; }
    a { color: var(--accent); }

.card{container-type:inline-size;border:1px solid #d9e2ec;padding:1rem;background:#fff}.meta2{color:#555}@container (min-width: 20rem){.meta2{color:#0f766e;font-weight:700}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>container-type</h1>
    <p class="meta">Establish a containment context.</p>
    <div class="note">Widen the card container conceptually.</div>
    <pre><code>container-type: inline-size</code></pre>
    <div class="demo">
<div class="card"><p class="meta2">@container styles kick in</p></div>
    </div>
  </div>
</body>
</html>
