<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fluid Type | phpkingdom.com</title>
  <link rel="stylesheet" href="04-04-clamp.css">

<body>
  <div class="wrap">
    <h1>Fluid Type</h1>
    <p class="meta">font-size: clamp().</p>
    <div class="note">Resize viewport to see fluid type.</div>
    <pre><code>clamp(1.2rem, 2vw + 1rem, 2rem)</code></pre>

<h2 class="fluid">Fluid heading</h2>
    </div>
  </div>
