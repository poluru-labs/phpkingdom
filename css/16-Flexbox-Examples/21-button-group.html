<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Button Group | phpkingdom.com</title>
  <link rel="stylesheet" href="21-button-group.css">
</head>
<body>
  <div class="wrap">
    <h1>Button Group</h1>
    <p class="meta">Adjacent buttons share borders — flex removes awkward inline gaps.</p>
    <div class="demo">
      <div class="btn-group">
        <button type="button">Left</button>
        <button type="button">Middle</button>
        <button type="button">Right</button>
      </div>
    </div>
    <pre>display: inline-flex;</pre>
  </div>
</body>
</html>
