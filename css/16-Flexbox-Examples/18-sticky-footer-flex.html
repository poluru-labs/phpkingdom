<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Sticky Footer (Flex) | phpkingdom.com</title>
  <link rel="stylesheet" href="18-sticky-footer-flex.css">
</head>
<body>
  <div class="wrap">
    <h1>Sticky Footer (Flex)</h1>
    <p class="meta">min-height column flex pushes the footer to the bottom of the viewport area.</p>
    <div class="demo">
      <div class="page">
        <header class="pg-head">Header</header>
        <main class="pg-main">Short content — footer still sits at the bottom of this demo panel.</main>
        <footer class="pg-foot">Footer</footer>
      </div>
    </div>
    <pre>min-height:100vh;
display:flex;
flex-direction:column;
main { flex:1; }</pre>
  </div>
</body>
</html>
