<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Equal-Height Cards | phpkingdom.com</title>
  <link rel="stylesheet" href="16-equal-height-cards.css">
</head>
<body>
  <div class="wrap">
    <h1>Equal-Height Cards</h1>
    <p class="meta">Flex items in a row stretch to the tallest card by default.</p>
    <div class="demo">
      <div class="cards">
        <article class="card"><h3>Short</h3><p>Brief text.</p></article>
        <article class="card"><h3>Taller</h3><p>More copy here makes this card taller while siblings match height.</p></article>
        <article class="card"><h3>Medium</h3><p>A bit more content than the first.</p></article>
      </div>
    </div>
    <pre>align-items: stretch; /* default */</pre>
  </div>
</body>
</html>
