<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Flex Wrap | phpkingdom.com</title>
  <link rel="stylesheet" href="03-flex-wrap.css">
</head>
<body>
  <div class="wrap">
    <h1>Flex Wrap</h1>
    <p class="meta">flex-wrap:wrap lets items flow to new lines; flex-basis changes how many fit per row.</p>
    <div class="demo">
      <div class="wrap-row"><div class="cell">One</div><div class="cell">Two</div><div class="cell">Three</div><div class="cell">Four</div><div class="cell">Five</div></div>
      <p class="hint">Resize the window — basis drops from 3-up to 2-up to 1-up.</p>
    </div>
    <pre>.row {
  display: flex;
  flex-wrap: wrap;
}
.item { flex: 1 1 120px; }</pre>
  </div>
</body>
</html>
