<head>

<body>
  <div class="wrap">
    <h1>Flex Shrink</h1>
    <p class="meta">flex-shrink:0 prevents an item from shrinking below its content size.</p>
    <div class="demo">
      <div class="shrink-row"><div class="cell no-shrink">Do not shrink label</div><div class="cell">This area shrinks instead when the row is narrow.</div></div>
    </div>
    <pre>.label { flex-shrink: 0; }</pre>
  </div>
