<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Justify Content | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; font-size:.9rem; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; margin:.75rem 0 0; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; margin:1rem 0; font-size:.95rem; }
    a { color: var(--accent); }
    .cell { background:#0f766e; color:#fff; padding:.75rem; text-align:center; border-radius:4px; }
    .cell.alt { background:#115e59; }
    .cell.light { background:#ecfdf5; color:#0f766e; border:1px dashed #0f766e; }

.jc-demo .label{margin:.5rem 0 .25rem;font-size:.85rem;color:var(--muted)}.bar{display:flex;gap:.35rem;background:#ecfdf5;padding:.5rem;border-radius:4px;margin-bottom:.5rem}.bar.sb{justify-content:space-between}.bar.ce{justify-content:center}.bar.sa{justify-content:space-around}.bar .cell{padding:.45rem .75rem}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Justify Content</h1>
    <p class="meta">justify-content distributes items along the main axis.</p>
    <div class="demo">
      <div class="jc-demo"><p class="label">space-between</p><div class="bar sb"><span class="cell">A</span><span class="cell">B</span><span class="cell">C</span></div>
      <p class="label">center</p><div class="bar ce"><span class="cell">A</span><span class="cell">B</span><span class="cell">C</span></div>
      <p class="label">space-around</p><div class="bar sa"><span class="cell">A</span><span class="cell">B</span><span class="cell">C</span></div></div>
    </div>
    <pre>justify-content: space-between | center | space-around;</pre>
  </div>
</body>
</html>
