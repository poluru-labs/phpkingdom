<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Space-Between Toolbar | phpkingdom.com</title>
  <link rel="stylesheet" href="19-space-between-toolbar.css">
</head>
<body>
  <div class="wrap">
    <h1>Space-Between Toolbar</h1>
    <p class="meta">Toolbar groups spaced apart with flex and gap.</p>
    <div class="demo">
      <div class="toolbar">
        <div class="group"><button type="button">Bold</button><button type="button">Italic</button></div>
        <div class="group"><button type="button">Save</button><button type="button" class="primary">Publish</button></div>
      </div>
    </div>
    <pre>justify-content: space-between;</pre>
  </div>
</body>
</html>
