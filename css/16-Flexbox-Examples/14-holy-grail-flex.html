<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Holy Grail (Flex) | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; font-size:.9rem; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; margin:.75rem 0 0; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; margin:1rem 0; font-size:.95rem; }
    a { color: var(--accent); }
    .cell { background:#0f766e; color:#fff; padding:.75rem; text-align:center; border-radius:4px; }
    .cell.alt { background:#115e59; }
    .cell.light { background:#ecfdf5; color:#0f766e; border:1px dashed #0f766e; }

.holy{display:flex;flex-direction:column;min-height:220px;border:1px solid var(--line);border-radius:4px;overflow:hidden}.holy-head,.holy-foot{background:#0f766e;color:#fff;padding:.6rem;text-align:center}.holy-body{display:flex;flex:1;gap:.5rem;padding:.5rem;background:#ecfdf5}.holy-side{flex:0 0 70px;background:#115e59;color:#fff;padding:.5rem;text-align:center;border-radius:4px}.holy-main{flex:1;background:#fff;border:1px dashed var(--accent);padding:.75rem;border-radius:4px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Holy Grail (Flex)</h1>
    <p class="meta">Classic header, three columns, and footer using nested flex containers.</p>
    <div class="demo">
      <div class="holy">
        <header class="holy-head">Header</header>
        <div class="holy-body">
          <aside class="holy-side">Nav</aside>
          <main class="holy-main">Main content grows to fill space.</main>
          <aside class="holy-side">Ads</aside>
        </div>
        <footer class="holy-foot">Footer</footer>
      </div>
    </div>
    <pre>/* column page + row middle */</pre>
  </div>
</body>
</html>
