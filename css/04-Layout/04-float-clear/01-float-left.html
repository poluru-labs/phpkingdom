<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Float Left | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

img{float:left;margin:0 1rem 0.5rem 0}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Float an Image Left</h1>
    <p class="meta">Text wraps around floated elements.</p>

    <div class="demo">
      <img src="https://placehold.co/120x90/0f766e/fff?text=Float" alt="floated placeholder" width="120" height="90">
      <p>This text wraps around the floated image. Float was a classic layout tool before Flexbox and Grid.</p>
      <p>More wrapping text to demonstrate the flow around the float.</p>
    </div>

  </div>
</body>
</html>
