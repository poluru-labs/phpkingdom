<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Stacking Order | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

.stage{position:relative;height:140px}
    .a,.b,.c{position:absolute;width:120px;height:80px;color:#fff;display:flex;align-items:center;justify-content:center}
    .a{left:20px;top:20px;background:#b45309;z-index:1}
    .b{left:60px;top:40px;background:#0f766e;z-index:3}
    .c{left:100px;top:60px;background:#0369a1;z-index:2}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>z-index Stacking</h1>
    <p class="meta">Higher z-index paints above lower ones.</p>

    <div class="demo"><div class="stage"><div class="a">z=1</div><div class="b">z=3</div><div class="c">z=2</div></div></div>

  </div>
</body>
</html>
