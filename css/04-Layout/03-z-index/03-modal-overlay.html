<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Modal Overlay Pattern | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

.stage{position:relative;height:160px;background:#e2e8f0}
    .overlay{position:absolute;inset:0;background:rgba(0,0,0,.45)}
    .modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:1rem;z-index:2;min-width:180px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Overlay with z-index</h1>
    <p class="meta">Common modal layering pattern.</p>

    <div class="demo"><div class="stage"><div class="overlay"></div><div class="modal">Modal above overlay</div></div></div>

  </div>
</body>
</html>
