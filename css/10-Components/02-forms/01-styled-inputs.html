<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Styled Inputs | phpkingdom.com</title>
  <style>

    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

label{display:block;margin:.75rem 0 .25rem}input,textarea{width:100%;max-width:320px;padding:.55rem .65rem;border:1px solid #94a3b8;border-radius:8px}input:focus,textarea:focus{outline:3px solid #99f6e4;border-color:#0f766e}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Styled Form Controls</h1>
    <p class="meta">Consistent input appearance.</p>

    <div class="demo"><form><label for="n">Name</label><input id="n" type="text"><label for="m">Message</label><textarea id="m" rows="3"></textarea></form></div>

  </div>
</body>
</html>
