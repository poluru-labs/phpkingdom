<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>CSS Tooltip | phpkingdom.com</title>
  <link rel="stylesheet" href="03-tooltip-css.css">
</head>
<body>
  <div class="wrap">
    <h1>CSS Tooltip</h1>
    <p class="meta">Native <code>title</code> tooltip and a pure CSS hover tooltip.</p>

    <div class="demo">
      <div class="demo-row">
        <span class="tip-native" title="Browser-native tooltip via title attribute">Native title</span>
        <span class="tip-css" tabindex="0" data-tip="Styled with ::after on hover">CSS hover tip</span>
      </div>
    </div>

    <p class="note">Native tooltips need no extra CSS. Custom tooltips use <code>data-tip</code> and <code>::after</code>; add <code>tabindex="0"</code> so keyboard users can focus them.</p>
  </div>
</body>
</html>
