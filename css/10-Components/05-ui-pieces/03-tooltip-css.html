<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>CSS Tooltip | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1.5rem 1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

    .tip-native { border-bottom:1px dotted var(--accent); cursor:help; }
    .tip-css { position:relative; display:inline-block; border-bottom:1px dotted var(--accent); cursor:help; }
    .tip-css::after { content:attr(data-tip); position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); background:#111827; color:#fff; font-size:.8rem; padding:.35rem .55rem; border-radius:6px; white-space:nowrap; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .15s ease; }
    .tip-css::before { content:""; position:absolute; left:50%; bottom:calc(100% + 2px); transform:translateX(-50%); border:6px solid transparent; border-top-color:#111827; opacity:0; visibility:hidden; transition:opacity .15s ease; }
    .tip-css:hover::after, .tip-css:hover::before, .tip-css:focus::after, .tip-css:focus::before { opacity:1; visibility:visible; }
    .demo-row { display:flex; flex-wrap:wrap; gap:2rem; align-items:center; justify-content:center; min-height:4rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CSS Tooltip</h1>
    <p class="meta">Native <code>title</code> tooltip and a pure CSS hover tooltip.</p>

    <div class="demo">
      <div class="demo-row">
        <span class="tip-native" title="Browser-native tooltip via title attribute">Native title</span>
        <span class="tip-css" tabindex="0" data-tip="Styled with ::after on hover">CSS hover tip</span>
      </div>
    </div>

    <p class="note">Native tooltips need no extra CSS. Custom tooltips use <code>data-tip</code> and <code>::after</code>; add <code>tabindex="0"</code> so keyboard users can focus them.</p>
  </div>
</body>
</html>
