<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Progress Bar | phpkingdom.com</title>
  <link rel="stylesheet" href="02-progress-bar.css">
</head>
<body>
  <div class="wrap">
    <h1>Progress Bar</h1>
    <p class="meta">Visual indicator for completion or loading state.</p>

    <div class="demo">
      <div class="progress-label"><span>Uploading lesson</span><span>65%</span></div>
      <div class="track" role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100" aria-label="Upload progress">
        <div class="fill"></div>
      </div>
    </div>

    <div class="demo progress-lg">
      <div class="progress-label"><span>Course complete</span><span>82%</span></div>
      <div class="track" role="progressbar" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100">
        <div class="fill fill--82"></div>
      </div>
    </div>

    <p class="note">Set fill width with a modifier class or a CSS custom property. Use <code>role="progressbar"</code> and ARIA values for accessibility.</p>
  </div>
</body>
</html>
