<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Divider Separator | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

    hr.divider { border:none; border-top:1px solid var(--line); margin:1.25rem 0; }
    .divider-text { display:flex; align-items:center; gap:1rem; color:var(--muted); font-size:.9rem; margin:1.25rem 0; }
    .divider-text::before, .divider-text::after { content:""; flex:1; height:1px; background:var(--line); }
    .divider-vertical { display:flex; align-items:center; gap:1rem; }
    .divider-vertical .vline { width:1px; align-self:stretch; background:var(--line); min-height:2rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Divider Separator</h1>
    <p class="meta">Horizontal rules and labeled separators between sections.</p>

    <div class="demo">
      <p>Section one content.</p>
      <hr class="divider">
      <p>Section two after a plain line.</p>
      <div class="divider-text">or continue with</div>
      <p>Section three after a centered label.</p>
      <div class="divider-vertical">
        <span>Left</span>
        <span class="vline" aria-hidden="true"></span>
        <span>Right</span>
      </div>
    </div>

    <p class="note">Use <code>&lt;hr&gt;</code> for semantic breaks. Text dividers use flex and pseudo-elements.</p>
  </div>
</body>
</html>
