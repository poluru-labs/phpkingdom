<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Divider Separator | phpkingdom.com</title>
  <link rel="stylesheet" href="05-divider-separator.css">
</head>
<body>
  <div class="wrap">
    <h1>Divider Separator</h1>
    <p class="meta">Horizontal rules and labeled separators between sections.</p>

    <div class="demo">
      <p>Section one content.</p>
      <hr class="divider">
      <p>Section two after a plain line.</p>
      <div class="divider-text">or continue with</div>
      <p>Section three after a centered label.</p>
      <div class="divider-vertical">
        <span>Left</span>
        <span class="vline" aria-hidden="true"></span>
        <span>Right</span>
      </div>
    </div>

    <p class="note">Use <code>&lt;hr&gt;</code> for semantic breaks. Text dividers use flex and pseudo-elements.</p>
  </div>
</body>
</html>
