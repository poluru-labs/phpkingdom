<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Avatar Group | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

    .avatar-group { display:flex; align-items:center; }
    .avatar-group .avatar { width:40px; height:40px; border-radius:50%; border:2px solid #fff; margin-left:-10px; object-fit:cover; background:var(--accent); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:700; }
    .avatar-group .avatar:first-child { margin-left:0; }
    .avatar-group .avatar:hover { z-index:1; transform:scale(1.08); transition:transform .15s ease; }
    .avatar-group .more { background:#64748b; font-size:.75rem; }
    .avatar-label { margin-left:.75rem; font-size:.9rem; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Avatar Group</h1>
    <p class="meta">Overlapping avatars showing collaborators or participants.</p>

    <div class="demo">
      <div class="avatar-group" aria-label="Team members">
        <span class="avatar" title="Subrahmanyam">SP</span>
        <img class="avatar" src="https://placehold.co/40x40/134e4a/fff?text=A" alt="Alex">
        <img class="avatar" src="https://placehold.co/40x40/b45309/fff?text=J" alt="Jordan">
        <span class="avatar more" title="3 more">+3</span>
        <span class="avatar-label">5 contributors</span>
      </div>
    </div>

    <p class="note">Negative <code>margin-left</code> overlaps circles. White borders separate stacked images.</p>
  </div>
</body>
</html>
