<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Avatar Group | phpkingdom.com</title>
  <link rel="stylesheet" href="04-avatar-group.css">
</head>
<body>
  <div class="wrap">
    <h1>Avatar Group</h1>
    <p class="meta">Overlapping avatars showing collaborators or participants.</p>

    <div class="demo">
      <div class="avatar-group" aria-label="Team members">
        <span class="avatar" title="Subrahmanyam">SP</span>
        <img class="avatar" src="https://placehold.co/40x40/134e4a/fff?text=A" alt="Alex">
        <img class="avatar" src="https://placehold.co/40x40/b45309/fff?text=J" alt="Jordan">
        <span class="avatar more" title="3 more">+3</span>
        <span class="avatar-label">5 contributors</span>
      </div>
    </div>

    <p class="note">Negative <code>margin-left</code> overlaps circles. White borders separate stacked images.</p>
  </div>
</body>
</html>
