<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Tags and Chips | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

    .tags { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .tag, .chip { display:inline-flex; align-items:center; gap:.35rem; padding:.25rem .65rem; border-radius:999px; font-size:.85rem; }
    .tag { background:#ecfdf5; color:#0f766e; border:1px solid #99f6e4; }
    .chip { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .chip:hover { border-color:var(--accent); color:var(--accent); }
    .chip .dot { width:.5rem; height:.5rem; border-radius:50%; background:var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tags and Chips</h1>
    <p class="meta">Pill labels for categories, filters, and metadata.</p>

    <div class="demo">
      <div class="tags">
        <span class="tag">CSS</span>
        <span class="tag">HTML</span>
        <span class="tag">Layout</span>
        <span class="chip"><span class="dot" aria-hidden="true"></span> Active filter</span>
        <span class="chip">Draft</span>
      </div>
    </div>

    <p class="note">Tags are read-only labels; chips can represent toggles or removable filters with hover states.</p>
  </div>
</body>
</html>
