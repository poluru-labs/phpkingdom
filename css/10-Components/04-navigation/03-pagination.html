<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Pagination | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

    .pagination { display:flex; flex-wrap:wrap; gap:.35rem; list-style:none; margin:0; padding:0; align-items:center; }
    .pagination a, .pagination span { display:inline-flex; align-items:center; justify-content:center; min-width:2.25rem; height:2.25rem; padding:0 .5rem; border:1px solid var(--line); border-radius:6px; text-decoration:none; color:var(--ink); font-size:.95rem; background:#fff; }
    .pagination a:hover, .pagination a:focus { border-color:var(--accent); color:var(--accent); background:#ecfdf5; outline:none; }
    .pagination .current { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
    .pagination .disabled { color:#94a3b8; pointer-events:none; background:#f1f5f9; }
    .pagination .ellipsis { border:none; background:transparent; min-width:auto; padding:0 .25rem; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Pagination</h1>
    <p class="meta">Page numbers with previous, next, and current state.</p>

    <div class="demo">
      <nav aria-label="Pagination">
        <ul class="pagination">
          <li><a href="#" aria-label="Previous page">&larr; Prev</a></li>
          <li><a href="#">1</a></li>
          <li><span class="current" aria-current="page">2</span></li>
          <li><a href="#">3</a></li>
          <li><span class="ellipsis" aria-hidden="true">&hellip;</span></li>
          <li><a href="#">12</a></li>
          <li><a href="#" aria-label="Next page">Next &rarr;</a></li>
        </ul>
      </nav>
    </div>

    <p class="note">Style the current page with <code>aria-current="page"</code>. Disable unavailable prev/next links with a <code>.disabled</code> class.</p>
  </div>
</body>
</html>
