<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Breadcrumb | phpkingdom.com</title>
  <link rel="stylesheet" href="02-breadcrumb.css">
</head>
<body>
  <div class="wrap">
    <h1>Breadcrumb</h1>
    <p class="meta">Trail showing hierarchy from root to current page.</p>

    <div class="demo">
      <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
          <li><a href="#">Home</a></li>
          <li><a href="#">CSS</a></li>
          <li><a href="#">Components</a></li>
          <li><span aria-current="page">Breadcrumb</span></li>
        </ol>
      </nav>
    </div>

    <p class="note">Use an ordered list with <code>aria-current="page"</code> on the last item for accessibility.</p>
  </div>
</body>
</html>
