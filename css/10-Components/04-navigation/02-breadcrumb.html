<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Breadcrumb | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

    .breadcrumb { display:flex; flex-wrap:wrap; align-items:center; gap:.35rem; list-style:none; margin:0; padding:0; font-size:.95rem; }
    .breadcrumb li { display:flex; align-items:center; gap:.35rem; }
    .breadcrumb li + li::before { content:"/"; color:#94a3b8; }
    .breadcrumb a { text-decoration:none; color:var(--accent); }
    .breadcrumb a:hover, .breadcrumb a:focus { text-decoration:underline; outline:none; }
    .breadcrumb [aria-current="page"] { color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Breadcrumb</h1>
    <p class="meta">Trail showing hierarchy from root to current page.</p>

    <div class="demo">
      <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
          <li><a href="#">Home</a></li>
          <li><a href="#">CSS</a></li>
          <li><a href="#">Components</a></li>
          <li><span aria-current="page">Breadcrumb</span></li>
        </ol>
      </nav>
    </div>

    <p class="note">Use an ordered list with <code>aria-current="page"</code> on the last item for accessibility.</p>
  </div>
</body>
</html>
