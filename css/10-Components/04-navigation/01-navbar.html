<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Navbar | phpkingdom.com</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#555; --accent:#0f766e; --bg:#f7fafc; --card:#fff; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:820px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .35rem; }
    .meta { color:var(--muted); margin:0 0 1.25rem; }
    .demo { background:var(--card); border:1px solid var(--line); padding:1rem; margin:1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background:#111827; color:#e5e7eb; padding:.9rem 1rem; overflow:auto; }
    .note { border-left:3px solid var(--accent); background:#ecfdf5; padding:.75rem 1rem; }
    a { color: var(--accent); }

    .navbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; padding:.75rem 1rem; background:#fff; border:1px solid var(--line); border-radius:8px; }
    .navbar .brand { font-weight:700; color:var(--accent); text-decoration:none; font-size:1.1rem; }
    .navbar ul { display:flex; gap:.25rem; list-style:none; margin:0; padding:0; flex-wrap:wrap; }
    .navbar a { display:block; padding:.45rem .75rem; text-decoration:none; border-radius:6px; color:var(--ink); }
    .navbar a:hover, .navbar a:focus { background:#ecfdf5; color:var(--accent); outline:none; }
    .navbar a.active { background:var(--accent); color:#fff; }
    .navbar .cta { padding:.45rem .9rem; background:var(--accent); color:#fff; border-radius:6px; text-decoration:none; font-size:.95rem; }
    .navbar .cta:hover, .navbar .cta:focus { background:#0d635c; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Navbar</h1>
    <p class="meta">Horizontal navigation with brand, links, and CTA.</p>

    <div class="demo">
      <nav class="navbar" aria-label="Main">
        <a class="brand" href="#">phpkingdom</a>
        <ul>
          <li><a class="active" href="#">Home</a></li>
          <li><a href="#">Tutorials</a></li>
          <li><a href="#">Components</a></li>
          <li><a href="#">About</a></li>
        </ul>
        <a class="cta" href="#">Sign up</a>
      </nav>
    </div>

    <p class="note">Use <code>:hover</code> and <code>:focus</code> for link feedback. Mark the current page with an <code>.active</code> class.</p>
  </div>
</body>
</html>
