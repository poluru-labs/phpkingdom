<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Navbar | phpkingdom.com</title>
  <link rel="stylesheet" href="01-navbar.css">
</head>
<body>
  <div class="wrap">
    <h1>Navbar</h1>
    <p class="meta">Horizontal navigation with brand, links, and CTA.</p>

    <div class="demo">
      <nav class="navbar" aria-label="Main">
        <a class="brand" href="#">phpkingdom</a>
        <ul>
          <li><a class="active" href="#">Home</a></li>
          <li><a href="#">Tutorials</a></li>
          <li><a href="#">Components</a></li>
          <li><a href="#">About</a></li>
        </ul>
        <a class="cta" href="#">Sign up</a>
      </nav>
    </div>

    <p class="note">Use <code>:hover</code> and <code>:focus</code> for link feedback. Mark the current page with an <code>.active</code> class.</p>
  </div>
</body>
</html>
