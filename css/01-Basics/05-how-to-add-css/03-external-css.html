<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>External CSS | phpkingdom.com</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; color: #1a1a1a; background: #f7fafc; line-height: 1.55; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .35rem; }
    .meta { color: #555; margin: 0 0 1.25rem; }
    pre { font-family: ui-monospace, Menlo, monospace; background: #111827; color: #e5e7eb; padding: .9rem 1rem; overflow: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>External Stylesheet</h1>
    <p class="meta">Link a separate .css file.</p>
    <div class="external-box">This text is styled by styles.css in the same folder.</div>
    <pre>&lt;link rel="stylesheet" href="styles.css"&gt;</pre>
  </div>
</body>
</html>
