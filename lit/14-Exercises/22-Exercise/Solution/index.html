    <h1>Solution 22 — Keyboard Event</h1>
    <p class="meta">Handle Enter key on a custom button host.</p>
    <h3>Solution</h3>
    <pre><code>render() {
  return html`
    &lt;div
      role=&quot;button&quot;
      tabindex=&quot;0&quot;
      @keydown=${(e) =&gt; e.key === &#x27;Enter&#x27; &amp;&amp; this.#activate()}
    &gt;Action&lt;/div&gt;
  `;
}</code></pre>
