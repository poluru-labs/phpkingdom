    <h1>Solution 16 — repeat Directive</h1>
    <p class="meta">Use repeat with an id key for a list of users.</p>
    <h3>Solution</h3>
    <pre><code>render() {
  return html`
    ${repeat(this.users, (u) =&gt; u.id, (u) =&gt; html`&lt;li&gt;${u.name}&lt;/li&gt;`)}
  `;
}</code></pre>
