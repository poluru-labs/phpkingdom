    <h1>Solution 07 — Event Handler</h1>
    <p class="meta">Bind a click handler that increments count.</p>
    <h3>Solution</h3>
    <pre><code>render() {
  return html`&lt;button @click=${this.#inc}&gt;${this.count}&lt;/button&gt;`;
}

#inc() {
  this.count += 1;
}</code></pre>
