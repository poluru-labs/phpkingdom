    <p class="meta">Bind color via styleMap.</p>
    <h3>Solution</h3>
    <pre><code>render() {
  return html`
    &lt;p style=${styleMap({ color: this.color, fontWeight: &#x27;700&#x27; })}&gt;Text&lt;/p&gt;
  `;
}</code></pre>
