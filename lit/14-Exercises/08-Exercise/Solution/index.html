    <h1>Solution 08 — Custom Event</h1>
    <p class="meta">Dispatch a composed save event with detail.</p>
    <h3>Solution</h3>
    <pre><code>this.dispatchEvent(new CustomEvent(&#x27;save&#x27;, {
  detail: { id: this.id },
  bubbles: true,
  composed: true,
}));</code></pre>
