<body>
  <h1>Toast Status</h1>
  <p class="meta">role=status live region</p>
  <div class="note">role=status live region</div>
  <pre><code>&lt;button type=&quot;button&quot; id=&quot;notify&quot;&gt;Save&lt;/button&gt;
&lt;div role=&quot;status&quot; aria-live=&quot;polite&quot; id=&quot;status&quot;&gt;&lt;/div&gt;
&lt;script&gt;
notify.onclick = () =&gt; { status.textContent = &quot;Saved successfully&quot;; };
&lt;/script&gt;</code></pre>
