<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Verify reading order | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .note { background: #f0f7fb; padding: 0.75rem 1rem; border-left: 3px solid #2a6f97; margin: 1rem 0; }
    .bad { background: #fff5f5; border-left-color: #c53030; }
    .good { background: #f0fff4; border-left-color: #276749; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #eef4f8; }
    form { display: grid; gap: 0.75rem; max-width: 420px; }
    label { display: grid; gap: 0.25rem; }
    input, select, textarea, button { font: inherit; padding: 0.4rem 0.55rem; }
    a:focus, button:focus, input:focus, select:focus, textarea:focus { outline: 2px solid #2a6f97; outline-offset: 2px; }
    .skip { position: absolute; left: -9999px; }
    .skip:focus { left: 1rem; top: 1rem; background: #fff; padding: 0.5rem 1rem; z-index: 99; }

  </style>
</head>
<body>
  <h1>Verify reading order</h1>
  <p class="meta">Verify reading order</p>
<p class="note">DOM order should match visual order.</p>
</body>
</html>
