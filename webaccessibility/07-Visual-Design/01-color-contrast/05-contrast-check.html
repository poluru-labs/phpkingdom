<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Quick Contrast Check | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .note { background: #f0f7fb; padding: 0.75rem 1rem; border-left: 3px solid #2a6f97; margin: 1rem 0; }
    .bad { background: #fff5f5; border-left: 3px solid #c53030; padding: 0.75rem 1rem; margin: 1rem 0; }
    .good { background: #f0fff4; border-left: 3px solid #276749; padding: 0.75rem 1rem; margin: 1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background: #111827; color: #e5e7eb; padding: 0.85rem 1rem; overflow: auto; }
    a:focus, button:focus, input:focus, select:focus, textarea:focus { outline: 2px solid #2a6f97; outline-offset: 2px; }
    .demo { margin: 1rem 0; padding: 1rem; border: 1px dashed #94a3b8; }
    .skip { position: absolute; left: -9999px; }
    .skip:focus { left: 1rem; top: 1rem; background: #fff; padding: 0.5rem 1rem; z-index: 10; }
</style>
</head>
<body>
  <h1>Quick Contrast Check</h1>
  <p class="meta">Dark text on light background example.</p>
<p style="color:#1a1a1a;background:#fff;padding:.75rem">#1a1a1a on #ffffff — typically AA for body text</p><p style="color:#9ca3af;background:#fff;padding:.75rem" class="bad">#9ca3af on #ffffff — often fails for small text</p>
</body>
</html>
