<!DOCTYPE html>

<head>

  <title>27 — unhandledrejection Hook | phpkingdom.com</title>
</head>
<body>
  <h1>27 — unhandledrejection Hook</h1>
  <h2>Problem</h2>
  <p>Listen for unhandledrejection to avoid silent async failures (simulated once).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const out = document.getElementById("out");
const logs = [];
function onReject(ev) {
  logs.push(ev.reason.message);
  if (ev.preventDefault) ev.preventDefault();
}
window.addEventListener("unhandledrejection", onReject);
onReject({ reason: new Error("simulated unhandled"), preventDefault() {} });
window.removeEventListener("unhandledrejection", onReject);
out.textContent = "logged once: " + logs[0];
  </script>
</body>
</html>
