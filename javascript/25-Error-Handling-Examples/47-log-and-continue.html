<body>
  <h1>47 — Log and Continue</h1>
  <h2>Problem</h2>
  <p>Log errors for observability but keep processing.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const out = document.getElementById("out");
const log = [];
const jobs = [
  () => "A",
  () => { throw new Error("B broke"); },
  () => "C",
];
const done = [];
for (const job of jobs) {
  try {
    done.push(job());
  } catch (e) {
    log.push(e.message);
  }
}
out.textContent = "done: " + done.join(", ") + "\nlogged: " + log.join(", ");
  </script>
</body>
</html>
