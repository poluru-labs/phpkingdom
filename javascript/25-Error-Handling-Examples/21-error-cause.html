<body>
  <h1>21 — error.cause</h1>
  <h2>Problem</h2>
  <p>Chain errors with the cause option (ES2022).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const out = document.getElementById("out");
try {
  try {
    JSON.parse("{");
  } catch (inner) {
    throw new Error("Failed to load config", { cause: inner });
  }
} catch (e) {
  out.textContent = [
    e.message,
    "cause: " + e.cause.name + " — " + e.cause.message.slice(0, 40),
  ].join("\n");
}
  </script>
</body>
