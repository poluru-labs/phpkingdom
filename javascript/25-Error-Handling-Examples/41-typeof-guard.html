<body>
  <h1>41 — typeof Guard</h1>
  <h2>Problem</h2>
  <p>Use typeof before calling non-function values.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const out = document.getElementById("out");
function callFn(fn) {
  if (typeof fn !== "function") {
    throw new TypeError("fn must be a function");
  }
  return fn();
}
try {
  out.textContent = String(callFn(42));
} catch (e) {
  out.textContent = e.name + ": " + e.message;
}
  </script>
</body>
