<body>
  <h1>45 — Wrap Async Function Safely</h1>
  <h2>Problem</h2>
  <p>Async wrapper catches rejections and returns Result-like object.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const out = document.getElementById("out");
async function safeAsync(fn) {
  try {
    const value = await fn();
    return { ok: true, value };
  } catch (error) {
    return { ok: false, error };
  }
}
(async () => {
  const r = await safeAsync(async () => { throw new Error("async fail"); });
  out.textContent = r.ok ? r.value : "safe: " + r.error.message;
})();
  </script>
</body>
