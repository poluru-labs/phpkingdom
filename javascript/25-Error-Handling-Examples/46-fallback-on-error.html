<body>
  <h1>46 — Fallback on Error</h1>
  <h2>Problem</h2>
  <p>Return a default value when an operation fails.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const out = document.getElementById("out");
function parseConfig(json, fallback) {
  try {
    return JSON.parse(json);
  } catch {
    return fallback;
  }
}
const cfg = parseConfig("{", { theme: "light" });
out.textContent = "theme: " + cfg.theme;
  </script>
</body>
