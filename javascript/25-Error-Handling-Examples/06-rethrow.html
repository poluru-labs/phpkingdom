  <h1>06 — Rethrow</h1>
  <h2>Problem</h2>
  <p>Log locally, then rethrow so a caller can handle it.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const out = document.getElementById("out");
function inner() {
  try {
    throw new Error("db timeout");
  } catch (e) {
    console.info("[demo] logged:", e.message);
    throw e;
  }
}
try {
  inner();
} catch (e) {
  out.textContent = "outer caught: " + e.message;
}
  </script>
</body>
