<body>
  <h1>27 — async/await Basics</h1>
  <h2>Problem</h2>
  <p>Await a promise inside an async function.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function getSite() {
  return Promise.resolve("phpkingdom.com");
}
async function main() {
  const site = await getSite();
  document.getElementById("out").textContent = "site=" + site;
}
main();
  </script>
</body>
