<body>
  <h1>26 — Promisify Rejection Path</h1>
  <h2>Problem</h2>
  <p>Reject when the callback receives an error.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function legacyFail(cb) {
  setTimeout(() => cb(new Error("disk full")), 100);
}
function readAsync() {
  return new Promise((resolve, reject) => {
    legacyFail((err, data) => err ? reject(err) : resolve(data));
  });
}
readAsync().catch((err) => {
  document.getElementById("out").textContent = err.message;
});
  </script>
</body>
</html>
