<body>
  <h1>29 — Await in a for Loop</h1>
  <h2>Problem</h2>
  <p>Sequential awaits inside a loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function tick(n) {
  return new Promise((resolve) => setTimeout(() => resolve(n), 80));
}
async function main() {
  const out = [];
  for (const n of [1, 2, 3]) {
    out.push(await tick(n));
  }
  document.getElementById("out").textContent = out.join(" then ");
}
main();
  </script>
</body>
