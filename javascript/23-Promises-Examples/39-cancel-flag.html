  <title>39 — Cancellation Flag Pattern | phpkingdom.com</title>
</head>
<body>
  <h1>39 — Cancellation Flag Pattern</h1>
  <h2>Problem</h2>
  <p>Ignore late promise results after cancel.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
let cancelled = false;
function load() {
  return new Promise((resolve) => setTimeout(() => resolve("data"), 300));
}
const p = load().then((data) => {
  if (cancelled) return;
  document.getElementById("out").textContent = data;
});
cancelled = true;
document.getElementById("out").textContent = "cancelled before resolve";
// keep reference so linters/engines don't drop it
void p;
  </script>
</body>
</html>
