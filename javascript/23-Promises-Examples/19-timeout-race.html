<!DOCTYPE html>
<html lang="en">

  <title>19 — Timeout with Promise.race | phpkingdom.com</title>
</head>
<body>
  <h1>19 — Timeout with Promise.race</h1>
  <h2>Problem</h2>
  <p>Reject if an operation takes too long.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function withTimeout(promise, ms) {
  const timeout = new Promise((_, reject) =>
    setTimeout(() => reject(new Error("Timeout after " + ms + "ms")), ms)
  );
  return Promise.race([promise, timeout]);
}
const slow = new Promise((resolve) => setTimeout(() => resolve("data"), 400));
withTimeout(slow, 150)
  .then((v) => { document.getElementById("out").textContent = v; })
  .catch((e) => { document.getElementById("out").textContent = e.message; });
  </script>
</body>
