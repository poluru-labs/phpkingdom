<body>
  <h1>35 — catch vs then(null, onRejected)</h1>
  <h2>Problem</h2>
  <p>catch(fn) is sugar for then(undefined, fn).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
Promise.reject(new Error("x"))
  .then(null, (err) => "recovered:" + err.message)
  .then((v) => {
    document.getElementById("out").textContent = v;
  });
  </script>
</body>
