<body>
  <h1>46 — Deferred Pattern</h1>
  <h2>Problem</h2>
  <p>Expose resolve/reject outside the executor (use sparingly).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function deferred() {
  let resolve, reject;
  const promise = new Promise((res, rej) => {
    resolve = res;
    reject = rej;
  });
  return { promise, resolve, reject };
}
const d = deferred();
d.promise.then((v) => {
  document.getElementById("out").textContent = "deferred got " + v;
});
setTimeout(() => d.resolve("later"), 150);
  </script>
</body>
