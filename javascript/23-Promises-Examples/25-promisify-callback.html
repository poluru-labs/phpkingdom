<body>
  <h1>25 — Promisify a Callback API</h1>
  <h2>Problem</h2>
  <p>Wrap an error-first callback function in a Promise.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function legacyLoad(cb) {
  setTimeout(() => cb(null, "legacy-data"), 150);
}
function loadAsync() {
  return new Promise((resolve, reject) => {
    legacyLoad((err, data) => {
      if (err) reject(err);
      else resolve(data);
    });
  });
}
loadAsync().then((data) => {
  document.getElementById("out").textContent = data;
});
  </script>
</body>
