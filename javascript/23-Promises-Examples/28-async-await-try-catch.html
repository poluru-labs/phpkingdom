  <h1>28 — async/await Error Handling</h1>
  <h2>Problem</h2>
  <p>Use try/catch around await.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
async function main() {
  try {
    await Promise.reject(new Error("await failed"));
  } catch (err) {
    document.getElementById("out").textContent = err.message;
  }
}
main();
  </script>
</body>
