<body>
  <h1>05 — then Chaining</h1>
  <h2>Problem</h2>
  <p>Return values to pass data to the next then.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
Promise.resolve(2)
  .then((n) => n * 3)
  .then((n) => n + 4)
  .then((n) => {
    document.getElementById("out").textContent = "result=" + n;
  });
  </script>
</body>
