<body>
  <h1>45 — Simple Promise Queue</h1>
  <h2>Problem</h2>
  <p>Ensure tasks run one after another via a queue chain.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function createQueue() {
  let chain = Promise.resolve();
  return function enqueue(task) {
    const run = chain.then(task);
    chain = run.catch(() => {});
    return run;
  };
}
const enqueue = createQueue();
const logs = [];
enqueue(async () => { logs.push("1"); });
enqueue(async () => { await new Promise((r) => setTimeout(r, 50)); logs.push("2"); });
enqueue(async () => { logs.push("3"); document.getElementById("out").textContent = logs.join(" -> "); });
  </script>
</body>
