  <title>10 — Throw Inside then | phpkingdom.com</title>

<body>
  <h1>10 — Throw Inside then</h1>
  <h2>Problem</h2>
  <p>Throwing in then rejects the returned promise.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
Promise.resolve(1)
  .then(() => {
    throw new Error("boom");
  })
  .catch((err) => {
    document.getElementById("out").textContent = "caught: " + err.message;
  });
  </script>
</body>
