  <title>17 — Promise.any AggregateError | phpkingdom.com</title>

<body>
  <h1>17 — Promise.any AggregateError</h1>
  <h2>Problem</h2>
  <p>If all reject, any rejects with AggregateError.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
Promise.any([
  Promise.reject(new Error("A")),
  Promise.reject(new Error("B"))
]).then((v) => {
  document.getElementById("out").textContent = v;
}).catch((err) => {
  const messages = err.errors ? err.errors.map((e) => e.message).join(", ") : err.message;
  document.getElementById("out").textContent = err.name + " => " + messages;
});
  </script>
</body>
</html>
