<body>
  <h1>37 — finally Cannot Replace Fulfillment Value</h1>
  <h2>Problem</h2>
  <p>Returning a value from finally is ignored for fulfillment.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
Promise.resolve("original")
  .finally(() => "ignored-return")
  .then((v) => {
    document.getElementById("out").textContent = "value still=" + v;
  });
  </script>
</body>
