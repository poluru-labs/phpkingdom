<body>
  <h1>18 — delay(ms) Helper</h1>
  <h2>Problem</h2>
  <p>Build a reusable delay promise.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function delay(ms, value) {
  return new Promise((resolve) => setTimeout(() => resolve(value), ms));
}
delay(250, "done").then((v) => {
  document.getElementById("out").textContent = v;
});
  </script>
</body>
