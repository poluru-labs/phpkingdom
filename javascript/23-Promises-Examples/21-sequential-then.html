<body>
  <h1>21 — Run Promises Sequentially (then)</h1>
  <h2>Problem</h2>
  <p>Chain dependent async steps in order.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function step(name, ms) {
  return new Promise((resolve) => {
    setTimeout(() => resolve(name), ms);
  });
}
step("A", 100)
  .then((a) => step(a + "->B", 100))
  .then((ab) => step(ab + "->C", 100))
  .then((result) => {
    document.getElementById("out").textContent = result;
  });
  </script>
</body>
