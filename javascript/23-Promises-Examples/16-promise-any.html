<!DOCTYPE html>
<html lang="en">
<head>

  <title>16 — Promise.any | phpkingdom.com</title>
</head>
<body>
  <h1>16 — Promise.any</h1>
  <h2>Problem</h2>
  <p>Resolve with the first fulfilled value; ignore rejections unless all fail.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
Promise.any([
  Promise.reject(new Error("1")),
  new Promise((resolve) => setTimeout(() => resolve("first success"), 120)),
  Promise.reject(new Error("3"))
]).then((value) => {
  document.getElementById("out").textContent = value;
}).catch((err) => {
  document.getElementById("out").textContent = err.name + ": " + err.message;
});
  </script>
</body>
</html>
