  <h1>17 — Reverse String (Two Pointers)</h1>
  <h2>Problem</h2>
  <p>Reverse a string using two pointers on a character array.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function reverseString(s) {
  const chars = s.split("");
  let lo = 0, hi = chars.length - 1;
  while (lo < hi) {
    [chars[lo], chars[hi]] = [chars[hi], chars[lo]];
    lo++; hi--;
  }
  return chars.join("");
}
const input = "hello";
document.getElementById("out").textContent =
  "input:  " + input + "\noutput: " + reverseString(input);
  </script>
