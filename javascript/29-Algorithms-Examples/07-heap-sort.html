  <h1>07 — Heap Sort (Simplified)</h1>
  <h2>Problem</h2>
  <p>Build a max-heap, then repeatedly extract the maximum to sort descending then reverse.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function heapify(a, n, i) {
  let largest = i;
  const l = 2 * i + 1, r = 2 * i + 2;
  if (l < n && a[l] > a[largest]) largest = l;
  if (r < n && a[r] > a[largest]) largest = r;
  if (largest !== i) {
    [a[i], a[largest]] = [a[largest], a[i]];
    heapify(a, n, largest);
  }
}
function heapSort(arr) {
  const a = arr.slice();
  const n = a.length;
  for (let i = Math.floor(n / 2) - 1; i >= 0; i--) heapify(a, n, i);
  for (let end = n - 1; end > 0; end--) {
    [a[0], a[end]] = [a[end], a[0]];
    heapify(a, end, 0);
  }
  return a;
}
const input = [12, 11, 13, 5, 6, 7];
document.getElementById("out").textContent =
  "input:  " + JSON.stringify(input) + "\noutput: " + JSON.stringify(heapSort(input));
  </script>
</body>
