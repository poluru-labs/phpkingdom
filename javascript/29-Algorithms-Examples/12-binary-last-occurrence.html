  <h1>12 — Binary Search Last Occurrence</h1>
  <h2>Problem</h2>
  <p>In a sorted array with duplicates, find the last index of target.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function lastOccurrence(arr, target) {
  let lo = 0, hi = arr.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid] === target) { ans = mid; lo = mid + 1; }
    else if (arr[mid] < target) lo = mid + 1;
    else hi = mid - 1;
  }
  return ans;
}
const arr = [1, 2, 2, 2, 3, 4, 5];
const target = 2;
document.getElementById("out").textContent =
  "array:  " + JSON.stringify(arr) + "\n" +
  "target: " + target + "\n" +
  "last index: " + lastOccurrence(arr, target);
  </script>
</body>
