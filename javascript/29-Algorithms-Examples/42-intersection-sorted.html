<body>
  <h1>42 — Intersection of Sorted Arrays</h1>
  <h2>Problem</h2>
  <p>Two pointers to find common elements in sorted arrays.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function intersectSorted(a, b) {
  const out = [];
  let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { out.push(a[i]); i++; j++; }
    else if (a[i] < b[j]) i++;
    else j++;
  }
  return out;
}
const a = [1, 2, 2, 3, 4];
const b = [2, 2, 4, 6];
document.getElementById("out").textContent =
  "a: " + JSON.stringify(a) + "\nb: " + JSON.stringify(b) + "\n" +
  "intersection: " + JSON.stringify(intersectSorted(a, b));
  </script>
</body>
