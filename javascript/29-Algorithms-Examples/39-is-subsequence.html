  <h1>39 — Is Subsequence (Two Pointers)</h1>
  <h2>Problem</h2>
  <p>Check if s is a subsequence of t using two pointers.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function isSubsequence(s, t) {
  let i = 0;
  for (let j = 0; j < t.length && i < s.length; j++) {
    if (s[i] === t[j]) i++;
  }
  return i === s.length;
}
const pairs = [["abc", "ahbgdc"], ["axc", "ahbgdc"]];
document.getElementById("out").textContent = pairs.map(([s, t]) =>
  JSON.stringify(s) + " in " + JSON.stringify(t) + " => " + isSubsequence(s, t)
).join("\n");
  </script>
</body>
