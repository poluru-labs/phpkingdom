  <h1>30 — Valid Parentheses</h1>
  <h2>Problem</h2>
  <p>Use a stack to check if brackets are properly closed and nested.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function isValid(s) {
  const stack = [];
  const pairs = { ")": "(", "]": "[", "}": "{" };
  for (const ch of s) {
    if ("([{".includes(ch)) stack.push(ch);
    else if (stack.pop() !== pairs[ch]) return false;
  }
  return stack.length === 0;
}
const samples = ["()", "()[]{}", "(]", "{[]}"];
document.getElementById("out").textContent = samples.map(s =>
  JSON.stringify(s) + " => " + isValid(s)
).join("\n");
  </script>
</body>
