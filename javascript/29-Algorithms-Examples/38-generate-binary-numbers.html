<body>
  <h1>38 — Generate Binary Numbers 1..n</h1>
  <h2>Problem</h2>
  <p>Use a queue to generate binary representations from 1 to n.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function binaryNumbers(n) {
  const q = ["1"], out = [];
  while (out.length < n) {
    const cur = q.shift();
    out.push(cur);
    q.push(cur + "0");
    q.push(cur + "1");
  }
  return out;
}
const n = 8;
document.getElementById("out").textContent =
  "n: " + n + "\n" +
  "binary 1..n: " + JSON.stringify(binaryNumbers(n));
  </script>
</body>
