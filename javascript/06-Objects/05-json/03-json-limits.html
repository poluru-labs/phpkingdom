<body>
  <h1>JSON Limitations</h1>
  <p>Functions and undefined are not preserved.</p>
  <pre id="out"></pre>
  <script>
const obj = { a: 1, b: undefined, c: function () {} };
document.getElementById("out").textContent = JSON.stringify(obj);
  </script>
</body>
