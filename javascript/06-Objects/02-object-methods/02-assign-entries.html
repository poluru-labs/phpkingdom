<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>assign entries | phpkingdom.com</title>
</head>
<body>
  <h1>assign and entries</h1>
  <p>Copy and iterate pairs.</p>
  <pre id="out"></pre>
  <script>
const a = { x: 1 };
const b = Object.assign({}, a, { y: 2 });
document.getElementById("out").textContent =
  JSON.stringify(b) + " / " + Object.entries(b).join(";");
  </script>
</body>
</html>
