<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Spread Arrays | phpkingdom.com</title>

<body>
  <h1>Spread in Arrays</h1>
  <p>Copy/merge arrays.</p>
  <pre id="out"></pre>
  <script>
const a = [1, 2];
const b = [...a, 3, 4];
document.getElementById("out").textContent = b.join(", ");
  </script>
</body>
