<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Defaults Rename | phpkingdom.com</title>
</head>
<body>
  <h1>Defaults and Renaming</h1>
  <p>Rename and provide defaults.</p>
  <pre id="out"></pre>
  <script>
const settings = { theme: "dark" };
const { theme: mode, lang = "en" } = settings;
document.getElementById("out").textContent = mode + " / " + lang;
  </script>
</body>
</html>
