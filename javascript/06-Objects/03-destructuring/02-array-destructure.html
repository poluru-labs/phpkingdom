<body>
  <h1>Array Destructuring</h1>
  <p>Unpack items by position.</p>
  <pre id="out"></pre>
  <script>
const rgb = [12, 140, 110];
const [r, g, b] = rgb;
document.getElementById("out").textContent = r + "," + g + "," + b;
  </script>
</body>
