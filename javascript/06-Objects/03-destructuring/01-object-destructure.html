<!DOCTYPE html>

<body>
  <h1>Object Destructuring</h1>
  <p>Unpack properties into variables.</p>
  <pre id="out"></pre>
  <script>
const user = { name: "Ada", age: 36 };
const { name, age } = user;
document.getElementById("out").textContent = name + " / " + age;
  </script>
</body>
</html>
