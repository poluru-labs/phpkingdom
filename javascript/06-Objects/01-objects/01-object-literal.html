<!DOCTYPE html>
<html lang="en">
<head>

<body>
  <h1>Object Literals</h1>
  <p>Create objects with key/value pairs.</p>
  <pre id="out"></pre>
  <script>
const user = { name: "Ada", role: "admin" };
document.getElementById("out").textContent = user.name + " (" + user.role + ")";
  </script>
</body>
