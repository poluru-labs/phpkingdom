<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Object Method Property | phpkingdom.com</title>
</head>
<body>
  <h1>Methods on Objects</h1>
  <p>Functions stored as properties.</p>
  <pre id="out"></pre>
  <script>
const counter = {
  value: 0,
  inc() { this.value += 1; return this.value; }
};
document.getElementById("out").textContent = String(counter.inc());
  </script>
</body>
</html>
