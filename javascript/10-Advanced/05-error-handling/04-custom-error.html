<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Custom Error Class | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .note { background: #f0f7fb; padding: 0.75rem 1rem; border-left: 3px solid #0f766e; margin: 1rem 0; }
    .demo { margin: 1rem 0; padding: 1rem; border: 1px dashed #94a3b8; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background: #111827; color: #e5e7eb; padding: 0.85rem 1rem; overflow: auto; }
    button, input, select, textarea { font: inherit; padding: 0.4rem 0.55rem; }
    button { cursor: pointer; background: #0f766e; color: #fff; border: 0; padding: 0.55rem 1rem; }
    #out { white-space: pre-wrap; background: #f4f4f4; padding: 0.75rem; min-height: 2rem; }
    a { color: #0f766e; }
    footer { border-top: 1px solid #ccc; padding-top: 1rem; margin-top: 2rem; color: #555; font-size: 0.95rem; }
</style>
</head>
<body>
  <h1>Custom Error Class</h1>
  <p class="meta">Extend Error for domains.</p>
  <div class="note">Set name for clearer logs.</div>
  <pre id="out"></pre>

  <script>
class AppError extends Error {
  constructor(msg) { super(msg); this.name = "AppError"; }
}
try {
  throw new AppError("nope");
} catch (e) {
  document.getElementById("out").textContent = e.name + ": " + e.message;
}

  </script>
</body>
</html>
