<body>
  <h1>try / catch</h1>
  <p>Handle runtime errors.</p>
  <pre id="out"></pre>
  <script>
try {
  JSON.parse("{bad");
} catch (err) {
  document.getElementById("out").textContent = err.name;
}
  </script>
</body>
