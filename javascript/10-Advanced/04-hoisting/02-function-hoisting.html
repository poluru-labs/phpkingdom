<body>
  <h1>Function Declaration Hoisting</h1>
  <p>Function declarations can be called earlier.</p>
  <pre id="out"></pre>
  <script>
document.getElementById("out").textContent = greet();
function greet() { return "hoisted"; }
  </script>
</body>
