<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>let TDZ | phpkingdom.com</title>
</head>
<body>
  <h1>Temporal Dead Zone</h1>
  <p>let/const exist but cannot be accessed before init.</p>
  <pre id="out"></pre>
  <script>
try {
  // eslint-disable-next-line no-use-before-define
  console.log(value);
  let value = 1;
} catch (e) {
  document.getElementById("out").textContent = "TDZ: " + e.name;
}
  </script>
</body>
</html>
