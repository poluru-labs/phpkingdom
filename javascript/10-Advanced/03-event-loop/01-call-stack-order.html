<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Call Stack Order | phpkingdom.com</title>
</head>
<body>
  <h1>Call Stack Order</h1>
  <p>Sync code runs before macrotasks.</p>
  <pre id="out"></pre>
  <script>
let log = "";
log += "1 ";
setTimeout(function () { log += "3 "; document.getElementById("out").textContent = log; }, 0);
log += "2 ";
document.getElementById("out").textContent = log;
  </script>
</body>
</html>
