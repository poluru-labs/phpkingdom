<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body>
  <h1>this in Methods</h1>
  <p>this refers to the object owning the method.</p>
  <pre id="out"></pre>
  <script>
const user = {
  name: "Ada",
  hello() { return "Hi " + this.name; }
};
document.getElementById("out").textContent = user.hello();
  </script>
</body>
</html>
