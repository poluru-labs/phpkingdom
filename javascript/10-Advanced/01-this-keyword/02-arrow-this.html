<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Arrow this | phpkingdom.com</title>
</head>
<body>
  <h1>Arrow Functions and this</h1>
  <p>Arrows inherit lexical this.</p>
  <pre id="out"></pre>
  <script>
const obj = {
  name: "Team",
  regular: function () { return this.name; },
  arrow: () => "arrow has lexical this"
};
document.getElementById("out").textContent =
  obj.regular() + " / " + obj.arrow();
  </script>
</body>
</html>
