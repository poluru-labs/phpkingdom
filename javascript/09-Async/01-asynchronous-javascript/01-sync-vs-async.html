<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Sync vs Async | phpkingdom.com</title>
</head>
<body>
  <h1>Synchronous vs Asynchronous</h1>
  <p>Async code schedules work for later.</p>
  <pre id="out"></pre>
  <script>
let log = "start\n";
setTimeout(function () {
  log += "timeout\n";
  document.getElementById("out").textContent = log + "end already printed first";
}, 300);
log += "end\n";
document.getElementById("out").textContent = log;
  </script>
</body>
</html>
