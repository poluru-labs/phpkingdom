  <h1>Callback Nesting Problem</h1>
  <p>Deep nesting is hard to read — prefer promises/async.</p>
  <pre id="out"></pre>
  <script>
setTimeout(function () {
  setTimeout(function () {
    document.getElementById("out").textContent = "Nested timeouts finished";
  }, 200);
}, 200);
  </script>
