<body>
  <h1>async / await</h1>
  <p>Write async code that looks sync.</p>
  <pre id="out"></pre>
  <script>
function wait(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}
async function run() {
  await wait(250);
  document.getElementById("out").textContent = "await finished";
}
run();
  </script>
</body>
</html>
