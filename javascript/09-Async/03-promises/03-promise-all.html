<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Promise.all | phpkingdom.com</title>
</head>
<body>
  <h1>Promise.all</h1>
  <p>Wait for multiple promises.</p>
  <pre id="out"></pre>
  <script>
Promise.all([
  Promise.resolve(1),
  Promise.resolve(2),
  Promise.resolve(3)
]).then(function (values) {
  document.getElementById("out").textContent = values.join(", ");
});
  </script>
</body>
</html>
