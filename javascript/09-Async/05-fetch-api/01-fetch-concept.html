<body>
  <h1>Fetch API Concept</h1>
  <p>fetch returns a Promise for HTTP requests.</p>
  <pre>fetch('https://api.example.com/data')
  .then(r => r.json())
  .then(data => console.log(data))
  .catch(err => console.error(err));</pre>
  <p>Live network demos may fail offline; pattern above is the standard shape.</p>
</body>
