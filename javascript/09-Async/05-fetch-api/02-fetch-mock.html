<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Fetch-like Mock | phpkingdom.com</title>
</head>
<body>
  <h1>Mocking a Fetch Result</h1>
  <p>Simulate fetch with a Promise.</p>
  <pre id="out">Loading…</pre>
  <script>
function fakeFetch() {
  return Promise.resolve({ ok: true, json: () => Promise.resolve({ site: "phpkingdom.com" }) });
}
fakeFetch()
  .then((res) => res.json())
  .then((data) => {
    document.getElementById("out").textContent = JSON.stringify(data);
  });
  </script>
</body>
</html>
