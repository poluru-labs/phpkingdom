<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>01 — Click Event | phpkingdom.com</title>
</head>
<body>
  <h1>01 — Click Event</h1>
  <h2>Problem</h2>
  <p>Count button clicks with addEventListener('click').</p>
  <h2>Demo</h2>
  <button id="btn">Click me</button>
  <pre id="out">clicks: 0</pre>
  <script>
let n = 0;
document.getElementById("btn").addEventListener("click", () => {
  n += 1;
  document.getElementById("out").textContent = "clicks: " + n;
});
  </script>
</body>
</html>
