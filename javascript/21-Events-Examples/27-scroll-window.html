<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>27 — Window Scroll | phpkingdom.com</title>
</head>
<body>
  <h1>27 — Window Scroll</h1>
  <h2>Problem</h2>
  <p>Track page scroll position.</p>
  <h2>Demo</h2>
  <p>Scroll the page…</p>
  <div style="height:900px;background:linear-gradient(#fff,#ddd)"></div>
  <pre id="out" style="position:fixed;top:8px;right:8px;background:#fff;border:1px solid #333;padding:8px"></pre>
  <script>
window.addEventListener("scroll", () => {
  document.getElementById("out").textContent =
    "scrollY=" + Math.round(window.scrollY);
}, { passive: true });
  </script>
</body>
</html>
