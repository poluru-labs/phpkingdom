<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>10 — Enter with keydown | phpkingdom.com</title>
</head>
<body>
  <h1>10 — Enter with keydown</h1>
  <h2>Problem</h2>
  <p>Submit-like action when Enter is pressed (prefer keydown over deprecated keypress).</p>
  <h2>Demo</h2>
  <input id="field" placeholder="Type and press Enter">
  <pre id="out"></pre>
  <script>
document.getElementById("field").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    document.getElementById("out").textContent = "submitted: " + e.target.value;
  }
});
  </script>
</body>
</html>
