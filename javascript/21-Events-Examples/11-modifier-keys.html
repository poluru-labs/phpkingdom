<body>
  <h1>11 — Modifier Keys</h1>
  <h2>Problem</h2>
  <p>Detect Ctrl/Meta/Shift/Alt during a click or key event.</p>
  <h2>Demo</h2>
  <button id="btn">Click with modifiers</button>
  <pre id="out"></pre>
  <script>
document.getElementById("btn").addEventListener("click", (e) => {
  document.getElementById("out").textContent =
    "ctrl=" + e.ctrlKey + " meta=" + e.metaKey +
    " shift=" + e.shiftKey + " alt=" + e.altKey;
});
  </script>
</body>
</html>
