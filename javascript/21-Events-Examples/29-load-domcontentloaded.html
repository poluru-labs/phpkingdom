<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>29 — DOMContentLoaded vs load | phpkingdom.com</title>
</head>
<body>
  <h1>29 — DOMContentLoaded vs load</h1>
  <h2>Problem</h2>
  <p>Log document readyState transitions related to parsing vs full load.</p>
  <h2>Demo</h2>
  <pre id="out"></pre>
  <script>
const lines = [];
lines.push("script readyState=" + document.readyState);
document.addEventListener("DOMContentLoaded", () => {
  lines.push("DOMContentLoaded readyState=" + document.readyState);
  document.getElementById("out").textContent = lines.join("\n");
});
window.addEventListener("load", () => {
  lines.push("load readyState=" + document.readyState);
  document.getElementById("out").textContent = lines.join("\n");
});
document.getElementById("out").textContent = lines.join("\n");
  </script>
</body>
</html>
