<!DOCTYPE html>

  <title>25 — removeEventListener | phpkingdom.com</title>
</head>
<body>
  <h1>25 — removeEventListener</h1>
  <h2>Problem</h2>
  <p>Detach a named handler so clicks stop counting.</p>
  <h2>Demo</h2>
  <button id="btn">Count</button>
  <button id="off">Remove listener</button>
  <pre id="out">0</pre>
  <script>
let n = 0;
function onClick() {
  n += 1;
  document.getElementById("out").textContent = String(n);
}
const btn = document.getElementById("btn");
btn.addEventListener("click", onClick);
document.getElementById("off").onclick = () => btn.removeEventListener("click", onClick);
  </script>
</body>
</html>
