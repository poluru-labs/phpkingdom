<body>
  <h1>39 — online / offline</h1>
  <h2>Problem</h2>
  <p>Detect browser network connectivity changes.</p>
  <h2>Demo</h2>
  <p>Toggle network in DevTools to simulate.</p>
  <pre id="out"></pre>
  <script>
function show() {
  document.getElementById("out").textContent =
    "navigator.onLine=" + navigator.onLine;
}
show();
window.addEventListener("online", show);
window.addEventListener("offline", show);
  </script>
</body>
</html>
