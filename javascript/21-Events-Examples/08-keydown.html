<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>08 — keydown | phpkingdom.com</title>
</head>
<body>
  <h1>08 — keydown</h1>
  <h2>Problem</h2>
  <p>Log the key and code on keydown.</p>
  <h2>Demo</h2>
  <input id="field" placeholder="Type here" autofocus>
  <pre id="out"></pre>
  <script>
document.getElementById("field").addEventListener("keydown", (e) => {
  document.getElementById("out").textContent =
    "key=" + e.key + " code=" + e.code + " repeat=" + e.repeat;
});
  </script>
</body>
</html>
