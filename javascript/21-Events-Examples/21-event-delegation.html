<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>21 — Event Delegation | phpkingdom.com</title>
</head>
<body>
  <h1>21 — Event Delegation</h1>
  <h2>Problem</h2>
  <p>One parent listener for many dynamic list items.</p>
  <h2>Demo</h2>
  <ul id="list"><li data-id="1">One</li><li data-id="2">Two</li></ul>
  <button id="add">Add</button>
  <pre id="out"></pre>
  <script>
const list = document.getElementById("list");
list.addEventListener("click", (e) => {
  const li = e.target.closest("li");
  if (!li || !list.contains(li)) return;
  document.getElementById("out").textContent = "id=" + li.dataset.id;
});
let n = 2;
document.getElementById("add").onclick = () => {
  n += 1;
  const li = document.createElement("li");
  li.dataset.id = String(n);
  li.textContent = "Item " + n;
  list.appendChild(li);
};
  </script>
</body>
</html>
