<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>45 — Throttle scroll Events | phpkingdom.com</title>
</head>
<body>
  <h1>45 — Throttle scroll Events</h1>
  <h2>Problem</h2>
  <p>Throttle expensive scroll handlers.</p>
  <h2>Demo</h2>
  <div id="scroller" style="height:140px;overflow:auto;border:1px solid #333">
    <div style="height:500px;padding:8px">Scroll…</div>
  </div>
  <pre id="out"></pre>
  <script>
function throttle(fn, ms) {
  let last = 0;
  return (...args) => {
    const now = Date.now();
    if (now - last >= ms) { last = now; fn(...args); }
  };
}
const box = document.getElementById("scroller");
const out = document.getElementById("out");
let raw = 0, throttled = 0;
box.addEventListener("scroll", () => { raw += 1; }, { passive: true });
box.addEventListener("scroll", throttle(() => {
  throttled += 1;
  out.textContent = "raw=" + raw + " throttled=" + throttled + " top=" + box.scrollTop;
}, 200), { passive: true });
  </script>
</body>
</html>
