<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>48 — Click Outside | phpkingdom.com</title>
</head>
<body>
  <h1>48 — Click Outside</h1>
  <h2>Problem</h2>
  <p>Close a menu when clicking outside of it.</p>
  <h2>Demo</h2>
  <button id="toggle">Toggle menu</button>
  <div id="menu" hidden style="margin-top:6px;padding:10px;border:1px solid #333;display:inline-block">Menu</div>
  <pre id="out"></pre>
  <script>
const menu = document.getElementById("menu");
const toggle = document.getElementById("toggle");
const out = document.getElementById("out");
toggle.onclick = (e) => {
  e.stopPropagation();
  menu.hidden = !menu.hidden;
  out.textContent = menu.hidden ? "closed" : "open";
};
document.addEventListener("click", (e) => {
  if (menu.hidden) return;
  if (!menu.contains(e.target) && e.target !== toggle) {
    menu.hidden = true;
    out.textContent = "closed (outside click)";
  }
});
  </script>
</body>
</html>
