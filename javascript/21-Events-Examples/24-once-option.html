<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>24 — Once Option | phpkingdom.com</title>
</head>
<body>
  <h1>24 — Once Option</h1>
  <h2>Problem</h2>
  <p>Register a listener that runs only one time.</p>
  <h2>Demo</h2>
  <button id="btn">Click me twice</button>
  <pre id="out"></pre>
  <script>
const out = document.getElementById("out");
document.getElementById("btn").addEventListener("click", () => {
  out.textContent += "fired ";
}, { once: true });
document.getElementById("btn").addEventListener("click", () => {
  out.textContent += "(regular) ";
});
  </script>
</body>
</html>
