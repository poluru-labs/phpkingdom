<!DOCTYPE html>

<body>
  <h1>40 — visibilitychange</h1>
  <h2>Problem</h2>
  <p>Know when the page is hidden or visible again.</p>
  <h2>Demo</h2>
  <p>Switch to another tab, then come back.</p>
  <pre id="out"></pre>
  <script>
function show() {
  document.getElementById("out").textContent =
    "visibilityState=" + document.visibilityState +
    " hidden=" + document.hidden;
}
show();
document.addEventListener("visibilitychange", show);
  </script>
</body>
</html>
