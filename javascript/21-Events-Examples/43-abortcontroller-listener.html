<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>43 — AbortController for Listeners | phpkingdom.com</title>
</head>
<body>
  <h1>43 — AbortController for Listeners</h1>
  <h2>Problem</h2>
  <p>Remove listeners by aborting a signal.</p>
  <h2>Demo</h2>
  <button id="btn">Click</button>
  <button id="stop">Abort listeners</button>
  <pre id="out"></pre>
  <script>
const out = document.getElementById("out");
const ac = new AbortController();
document.getElementById("btn").addEventListener("click", () => {
  out.textContent += "click ";
}, { signal: ac.signal });
document.getElementById("stop").onclick = () => {
  ac.abort();
  out.textContent += "[aborted] ";
};
  </script>
</body>
</html>
