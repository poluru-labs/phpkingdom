<body>
  <h1>02 — Double Click</h1>
  <h2>Problem</h2>
  <p>Detect a double-click on an element.</p>
  <h2>Demo</h2>
  <div id="box" style="padding:16px;border:1px solid #333;display:inline-block">Double-click me</div>
  <pre id="out"></pre>
  <script>
document.getElementById("box").addEventListener("dblclick", () => {
  document.getElementById("out").textContent = "double-clicked at " + new Date().toLocaleTimeString();
});
  </script>
</body>
</html>
