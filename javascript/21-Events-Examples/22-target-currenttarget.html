<body>
  <h1>22 — target vs currentTarget</h1>
  <h2>Problem</h2>
  <p>Compare the clicked element with the element that owns the listener.</p>
  <h2>Demo</h2>
  <div id="wrap" style="padding:16px;border:1px solid #333">
    wrap <button id="inner">inner</button>
  </div>
  <pre id="out"></pre>
  <script>
document.getElementById("wrap").addEventListener("click", (e) => {
  document.getElementById("out").textContent =
    "target=" + e.target.id + "\ncurrentTarget=" + e.currentTarget.id;
});
  </script>
</body>
</html>
