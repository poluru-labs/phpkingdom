<!DOCTYPE html>

<body>
  <h1>Primitive Types</h1>
  <p>string, number, boolean, null, undefined, bigint, symbol.</p>
  <pre id="out"></pre>
  <script>
const samples = [
  typeof "hi",
  typeof 42,
  typeof true,
  typeof undefined,
  typeof null, // historical quirk: "object"
  typeof 10n,
  typeof Symbol("id")
];
document.getElementById("out").textContent = samples.join("\n");
  </script>
</body>
</html>
