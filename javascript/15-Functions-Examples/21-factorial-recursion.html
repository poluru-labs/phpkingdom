<body>
  <h1>21 — Factorial Recursion</h1>
  <h2>Problem</h2>
  <p>Compute factorial n! using a recursive function.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function factorial(n) {
  if (n <= 1) return 1;
  return n * factorial(n - 1);
}
document.getElementById("out").textContent = "5! = " + factorial(5);
  </script>
</body>
