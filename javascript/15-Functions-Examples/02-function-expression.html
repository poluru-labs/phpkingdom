<body>
  <h1>02 — Function Expression</h1>
  <h2>Problem</h2>
  <p>Assign a function to a variable using a function expression.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const double = function (n) {
  return n * 2;
};
document.getElementById("out").textContent = "double(7) = " + double(7);
  </script>
</body>
