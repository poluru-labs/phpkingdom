<body>
  <h1>47 — Named Function Expression</h1>
  <h2>Problem</h2>
  <p>Use a named function expression for safer recursion inside.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const factorial = function fact(n) {
  return n <= 1 ? 1 : n * fact(n - 1);
};
document.getElementById("out").textContent = "4! = " + factorial(4);
  </script>
</body>
