<body>
  <h1>26 — Function.apply</h1>
  <h2>Problem</h2>
  <p>Pass arguments as an array using apply.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function maxOf(a, b, c) {
  return Math.max(a, b, c);
}
document.getElementById("out").textContent =
  "max = " + maxOf.apply(null, [4, 9, 2]);
  </script>
</body>
