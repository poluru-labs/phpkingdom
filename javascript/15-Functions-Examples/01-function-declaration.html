<body>
  <h1>01 — Function Declaration</h1>
  <h2>Problem</h2>
  <p>Define a function with a declaration and call it to greet a name.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function greet(name) {
  return "Hello, " + name + "!";
}
document.getElementById("out").textContent = greet("World");
  </script>
</body>
