<body>
  <h1>13 — Variadic Curry</h1>
  <h2>Problem</h2>
  <p>Curry a function that accepts any number of arguments.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function curry(fn) {
  return function curried(...args) {
    if (args.length >= fn.length) return fn(...args);
    return (...more) => curried(...args, ...more);
  };
}
const sum = curry((a, b, c) => a + b + c);
document.getElementById("out").textContent =
  "sum(1)(2)(3) = " + sum(1)(2)(3);
  </script>
</body>
