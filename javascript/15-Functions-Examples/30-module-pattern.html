<body>
  <h1>30 — Module Pattern</h1>
  <h2>Problem</h2>
  <p>Expose a public API while keeping internal state private.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const CounterModule = (function () {
  let value = 0;
  return {
    inc() { value += 1; return value; },
    get() { return value; },
  };
})();
CounterModule.inc();
CounterModule.inc();
document.getElementById("out").textContent = "count = " + CounterModule.get();
  </script>
</body>
