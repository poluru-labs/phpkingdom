<body>
  <h1>35 — Return Function</h1>
  <h2>Problem</h2>
  <p>Return a specialized function from another function.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function makeMultiplier(factor) {
  return (n) => n * factor;
}
const triple = makeMultiplier(3);
document.getElementById("out").textContent = "triple(7) = " + triple(7);
  </script>
</body>
