<body>
  <h1>27 — Function.bind</h1>
  <h2>Problem</h2>
  <p>Create a bound function with a fixed this and preset argument.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function multiply(a, b) {
  return a * b;
}
const double = multiply.bind(null, 2);
document.getElementById("out").textContent = "double(9) = " + double(9);
  </script>
</body>
