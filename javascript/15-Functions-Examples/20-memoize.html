<body>
  <h1>20 — Memoize</h1>
  <h2>Problem</h2>
  <p>Cache function results to avoid repeated expensive work.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function memoize(fn) {
  const cache = new Map();
  return function (key) {
    if (cache.has(key)) return cache.get(key);
    const value = fn(key);
    cache.set(key, value);
    return value;
  };
}
let calls = 0;
const slowSquare = memoize((n) => { calls += 1; return n * n; });
slowSquare(6); slowSquare(6); slowSquare(8);
document.getElementById("out").textContent =
  "results: " + slowSquare(6) + ", " + slowSquare(8) + "\ncalls = " + calls;
  </script>
</body>
