<body>
  <h1>16 — Pipe Functions</h1>
  <h2>Problem</h2>
  <p>Pipe functions left-to-right instead of compose right-to-left.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const pipe = (...fns) => (x) => fns.reduce((v, fn) => fn(v), x);
const inc = (x) => x + 1;
const double = (x) => x * 2;
document.getElementById("out").textContent =
  "pipe(inc, double)(5) = " + pipe(inc, double)(5);
  </script>
</body>
