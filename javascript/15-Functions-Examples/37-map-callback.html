<body>
  <h1>37 — Map Callback</h1>
  <h2>Problem</h2>
  <p>Transform array items with map and a callback function.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [1, 2, 3];
const squared = nums.map((n) => n * n);
document.getElementById("out").textContent = squared.join(", ");
  </script>
</body>
