<body>
  <h1>10 — Loop Closure Fix</h1>
  <h2>Problem</h2>
  <p>Fix the classic loop closure bug using let block scope.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const fns = [];
for (let i = 0; i < 3; i++) {
  fns.push(() => i);
}
document.getElementById("out").textContent =
  fns.map((fn) => fn()).join(", ");
  </script>
</body>
