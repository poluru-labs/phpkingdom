  <h1>22 — Fibonacci Recursion</h1>
  <h2>Problem</h2>
  <p>Compute Fibonacci numbers with a simple recursive definition.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function fib(n) {
  if (n <= 1) return n;
  return fib(n - 1) + fib(n - 2);
}
document.getElementById("out").textContent =
  [0, 1, 2, 3, 4, 5, 6].map(fib).join(", ");
  </script>
</body>
