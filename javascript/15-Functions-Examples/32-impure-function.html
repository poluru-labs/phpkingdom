<body>
  <h1>32 — Impure Function</h1>
  <h2>Problem</h2>
  <p>Show an impure function that mutates external state.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
let total = 0;
function impureAdd(n) {
  total += n;
  return total;
}
document.getElementById("out").textContent =
  impureAdd(5) + ", " + impureAdd(3) + " (total changed)";
  </script>
</body>
