<body>
  <h1>05 — Rest Parameters</h1>
  <h2>Problem</h2>
  <p>Collect remaining arguments into an array with rest syntax.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function sumAll(first, ...rest) {
  return first + rest.reduce((a, b) => a + b, 0);
}
document.getElementById("out").textContent = "sumAll(1,2,3,4) = " + sumAll(1, 2, 3, 4);
  </script>
</body>
