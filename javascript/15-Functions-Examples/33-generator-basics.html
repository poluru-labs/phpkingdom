  <h1>33 — Generator Basics</h1>
  <h2>Problem</h2>
  <p>Use a generator function to yield values one at a time.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function* range(start, end) {
  for (let i = start; i <= end; i++) yield i;
}
const values = [...range(1, 5)];
document.getElementById("out").textContent = values.join(", ");
  </script>
</body>
