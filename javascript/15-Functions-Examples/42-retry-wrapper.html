<body>
  <h1>42 — Retry Wrapper</h1>
  <h2>Problem</h2>
  <p>Retry a flaky function until it succeeds or attempts run out.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function retry(fn, attempts) {
  return function (...args) {
    let lastError;
    for (let i = 0; i < attempts; i++) {
      try { return fn(...args); }
      catch (e) { lastError = e; }
    }
    throw lastError;
  };
}
let tries = 0;
const flaky = retry(() => {
  tries += 1;
  if (tries < 3) throw new Error("fail");
  return "ok on try " + tries;
}, 5);
document.getElementById("out").textContent = flaky();
  </script>
</body>
