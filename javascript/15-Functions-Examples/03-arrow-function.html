<body>
  <h1>03 — Arrow Function</h1>
  <h2>Problem</h2>
  <p>Use an arrow function to square a number.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const square = (n) => n * n;
document.getElementById("out").textContent = "square(5) = " + square(5);
  </script>
</body>
