  <h1>14 — Compose Two Functions</h1>
  <h2>Problem</h2>
  <p>Compose two functions so the output of one feeds the next.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const compose2 = (f, g) => (x) => f(g(x));
const add1 = (x) => x + 1;
const double = (x) => x * 2;
const add1ThenDouble = compose2(double, add1);
document.getElementById("out").textContent = "add1ThenDouble(5) = " + add1ThenDouble(5);
  </script>
</body>
