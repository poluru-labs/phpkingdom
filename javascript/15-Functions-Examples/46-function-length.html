  <title>46 — Function.length | phpkingdom.com</title>
</head>
<body>
  <h1>46 — Function.length</h1>
  <h2>Problem</h2>
  <p>Read how many formal parameters a function declares.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function add(a, b) { return a + b; }
const variadic = (...args) => args.length;
document.getElementById("out").textContent =
  "add.length = " + add.length + "\nvariadic.length = " + variadic.length;
  </script>
</body>
</html>
