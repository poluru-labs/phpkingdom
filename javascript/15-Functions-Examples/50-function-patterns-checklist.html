<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>50 — Function Patterns Checklist | phpkingdom.com</title>

<body>
  <h1>50 — Function Patterns Checklist</h1>
  <h2>Problem</h2>
  <p>Review key JavaScript function patterns covered in this section.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const patterns = [
  "declaration & expression",
  "arrow, defaults, rest",
  "HOF, callbacks, closure",
  "partial, curry, compose, pipe",
  "debounce, throttle, once, memoize",
  "recursion, this, call/apply/bind",
  "factory, IIFE, module pattern",
  "pure vs impure, generators",
];
document.getElementById("out").textContent =
  "50 Function Patterns Checklist:\n" +
  patterns.map((p, i) => (i + 1) + ". " + p).join("\n");
  </script>
</body>
</html>
