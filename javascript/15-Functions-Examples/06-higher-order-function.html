<body>
  <h1>06 — Higher-Order Function</h1>
  <h2>Problem</h2>
  <p>Write a function that accepts another function and applies it twice.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function applyTwice(fn, value) {
  return fn(fn(value));
}
const inc = (x) => x + 1;
document.getElementById("out").textContent = "applyTwice(inc, 3) = " + applyTwice(inc, 3);
  </script>
</body>
