<body>
  <h1>24 — Arrow this Lexical</h1>
  <h2>Problem</h2>
  <p>Compare method this with arrow function lexical this.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const obj = {
  label: "outer",
  regular() {
    const inner = () => "arrow this.label = " + this.label;
    return inner();
  },
};
document.getElementById("out").textContent = obj.regular();
  </script>
</body>
