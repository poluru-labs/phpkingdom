<body>
  <h1>38 — Filter Callback</h1>
  <h2>Problem</h2>
  <p>Filter array elements with a predicate callback.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [1, 2, 3, 4, 5, 6];
const evens = nums.filter((n) => n % 2 === 0);
document.getElementById("out").textContent = evens.join(", ");
  </script>
</body>
