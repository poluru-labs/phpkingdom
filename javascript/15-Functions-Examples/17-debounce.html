<body>
  <h1>17 — Debounce</h1>
  <h2>Problem</h2>
  <p>Debounce a function so rapid calls execute only after a delay.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function debounce(fn, wait) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), wait);
  };
}
let count = 0;
const bump = debounce(() => { count += 1; }, 50);
bump(); bump(); bump();
setTimeout(() => {
  document.getElementById("out").textContent = "debounced calls = " + count;
}, 120);
  </script>
</body>
