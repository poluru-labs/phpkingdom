<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>JSON Storage | phpkingdom.com</title>
</head>
<body>
  <h1>Store Objects as JSON</h1>
  <p>Serialize before saving.</p>
  <pre id="out"></pre>
  <script>
const user = { name: "Ada", role: "admin" };
localStorage.setItem("user", JSON.stringify(user));
const back = JSON.parse(localStorage.getItem("user"));
document.getElementById("out").textContent = back.name + " / " + back.role;
  </script>
</body>
</html>
