<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Tabs DOM | phpkingdom.com</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Tabs DOM</h1>
  <p class="meta">Simple tab switcher.</p>
  <div class="demo">
    <button data-tab="a">A</button>
    <button data-tab="b">B</button>
    <div id="tab-a">Alpha content</div>
    <div id="tab-b" hidden>Beta content</div>
  </div>
  <pre id="out">tab=a</pre>

  <script src="index.js"></script>
</body>
</html>
