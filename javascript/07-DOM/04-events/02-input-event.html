<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Input Event | phpkingdom.com</title>
</head>
<body>
  <h1>Input Event</h1>
  <p>React as the user types.</p>
  <input id="name" type="text" placeholder="Type here">
  <p id="out"></p>
  <script>
document.getElementById("name").addEventListener("input", function (e) {
  document.getElementById("out").textContent = "Hello, " + e.target.value;
});
  </script>
</body>
</html>
