<body>
  <h1>if / else</h1>
  <p>Choose between two paths.</p>
  <pre id="out"></pre>
  <script>
const n = 7;
const msg = (n % 2 === 0) ? "even" : "odd";
document.getElementById("out").textContent = msg;
  </script>
</body>
