<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>Switch Strict Equality | phpkingdom.com</title>
</head>
<body>
  <h1>switch Uses ===</h1>
  <p>No type coercion in case matching.</p>
  <pre id="out"></pre>
  <script>
const x = "1";
let msg = "no match";
switch (x) {
  case 1: msg = "number 1"; break;
  case "1": msg = "string 1"; break;
}
document.getElementById("out").textContent = msg;
  </script>
</body>
</html>
