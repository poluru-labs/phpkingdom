<!DOCTYPE html>
<html lang="en">

<body>
  <h1>42 — Custom Class Object</h1>
  <h2>Problem</h2>
  <p>Model a BankAccount class with deposit/withdraw.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
class BankAccount {
  constructor(owner, balance = 0) { this.owner = owner; this.balance = balance; }
  deposit(amount) { this.balance += amount; }
  withdraw(amount) {
    if (amount > this.balance) throw new Error("Insufficient funds");
    this.balance -= amount;
  }
}
const acc = new BankAccount("Ada", 100);
acc.deposit(40);
acc.withdraw(25);
document.getElementById("out").textContent = acc.owner + " balance=" + acc.balance;
  </script>
</body>
</html>
