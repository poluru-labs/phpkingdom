<body>
  <h1>27 — Flatten Nested Object</h1>
  <h2>Problem</h2>
  <p>Flatten nested keys into dotted paths.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function flattenObject(obj, prefix = "", out = {}) {
  for (const [k, v] of Object.entries(obj)) {
    const path = prefix ? prefix + "." + k : k;
    if (v && typeof v === "object" && !Array.isArray(v)) flattenObject(v, path, out);
    else out[path] = v;
  }
  return out;
}
document.getElementById("out").textContent = JSON.stringify(flattenObject({ a: 1, b: { c: 2, d: { e: 3 } } }));
  </script>
</body>
