<!DOCTYPE html>
<html lang="en">
<head>

  <title>14 — Object.freeze | phpkingdom.com</title>
</head>
<body>
  <h1>14 — Object.freeze</h1>
  <h2>Problem</h2>
  <p>Prevent adding/updating/deleting properties.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const config = Object.freeze({ mode: "prod" });
try { config.mode = "dev"; } catch (e) {}
document.getElementById("out").textContent = config.mode + " / frozen=" + Object.isFrozen(config);
  </script>
</body>
