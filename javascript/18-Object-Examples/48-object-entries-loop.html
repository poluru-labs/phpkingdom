<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>48 — Loop Object Entries | phpkingdom.com</title>
</head>
<body>
  <h1>48 — Loop Object Entries</h1>
  <h2>Problem</h2>
  <p>Iterate entries and build a formatted string.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const site = { name: "phpkingdom.com", author: "Subrahmanyam Poluru" };
const lines = [];
for (const [key, value] of Object.entries(site)) lines.push(key + ": " + value);
document.getElementById("out").textContent = lines.join("\n");
  </script>
</body>
</html>
