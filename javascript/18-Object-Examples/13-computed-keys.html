<body>
  <h1>13 — Computed Property Names</h1>
  <h2>Problem</h2>
  <p>Use expressions as object keys.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const key = "score";
const exam = { [key]: 95, ["level" + 1]: "A" };
document.getElementById("out").textContent = JSON.stringify(exam);
  </script>
</body>
