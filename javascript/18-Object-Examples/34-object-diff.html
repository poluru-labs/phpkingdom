<body>
  <h1>34 — Object Diff (Shallow)</h1>
  <h2>Problem</h2>
  <p>Find keys whose values differ between two objects.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function diff(a, b) {
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  const changed = {};
  for (const k of keys) {
    if (a[k] !== b[k]) changed[k] = { from: a[k], to: b[k] };
  }
  return changed;
}
document.getElementById("out").textContent = JSON.stringify(diff({ a: 1, b: 2 }, { a: 1, b: 9, c: 3 }), null, 2);
  </script>
</body>
