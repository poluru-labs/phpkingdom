<body>
  <h1>04 — Object with Methods</h1>
  <h2>Problem</h2>
  <p>Attach methods that use this.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const counter = {
  value: 0,
  inc() { this.value += 1; return this.value; }
};
counter.inc();
counter.inc();
document.getElementById("out").textContent = "value=" + counter.value;
  </script>
</body>
