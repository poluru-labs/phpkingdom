<body>
  <h1>30 — Deep Merge Objects</h1>
  <h2>Problem</h2>
  <p>Recursively merge plain objects.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function deepMerge(target, source) {
  const out = { ...target };
  for (const [k, v] of Object.entries(source)) {
    if (v && typeof v === "object" && !Array.isArray(v)) out[k] = deepMerge(out[k] || {}, v);
    else out[k] = v;
  }
  return out;
}
const a = { theme: { mode: "light", font: 16 }, ok: true };
const b = { theme: { mode: "dark" }, lang: "en" };
document.getElementById("out").textContent = JSON.stringify(deepMerge(a, b), null, 2);
  </script>
</body>
