<body>
  <h1>41 — Constructor Function</h1>
  <h2>Problem</h2>
  <p>Create objects with a constructor and prototype method.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function Person(name) { this.name = name; }
Person.prototype.hello = function () { return "Hi, I am " + this.name; };
document.getElementById("out").textContent = new Person("Ada").hello();
  </script>
</body>
