<body>
  <h1>31 — Parse Query String to Object</h1>
  <h2>Problem</h2>
  <p>Convert URL query params into an object.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function parseQuery(qs) {
  const clean = qs.replace(/^\?/, "");
  if (!clean) return {};
  return Object.fromEntries(
    clean.split("&").map((pair) => {
      const [k, v = ""] = pair.split("=");
      return [decodeURIComponent(k), decodeURIComponent(v)];
    })
  );
}
document.getElementById("out").textContent = JSON.stringify(parseQuery("?site=phpkingdom.com&lang=js"));
  </script>
</body>
</html>
