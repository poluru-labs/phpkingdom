<body>
  <h1>23 — Group Array of Objects</h1>
  <h2>Problem</h2>
  <p>Group objects by a property value.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function groupBy(arr, key) {
  return arr.reduce((acc, item) => {
    const k = item[key];
    (acc[k] ||= []).push(item);
    return acc;
  }, {});
}
const people = [
  { name: "Ada", role: "dev" },
  { name: "Lin", role: "design" },
  { name: "Sam", role: "dev" }
];
document.getElementById("out").textContent = JSON.stringify(groupBy(people, "role"), null, 2);
  </script>
</body>
</html>
