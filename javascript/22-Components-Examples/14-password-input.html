<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>14 — Password Input | phpkingdom.com</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    .c-password { position: relative; max-width: 360px; }
    .c-password .c-input { padding-right: 2.75rem; }
    .c-password__toggle {
      position: absolute;
      right: 0.35rem;
      bottom: 0.35rem;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .c-password__toggle:hover { color: var(--accent-ink); background: var(--accent-soft); }
    .c-password__toggle:focus-visible { outline: none; box-shadow: var(--focus); }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← Components</a>
    <h1>14 — Password Input</h1>
    <p class="lead">Password field with show/hide toggle and strength hint.</p>
    <section class="panel">
      <h2>Demo</h2>
      <div id="mount"></div>
    </section>
    <section class="panel">
      <h2>Events / State</h2>
      <pre class="log" id="log">Ready.</pre>
    </section>
  </main>
  <script>
    const logEl = document.getElementById("log");
    function log(msg) { logEl.textContent = msg; }

    function createPasswordInput({ label = "Password", placeholder = "Enter password" } = {}) {
      let visible = false;

      const wrap = document.createElement("label");
      wrap.className = "c-password field-label";
      wrap.textContent = label;

      const inner = document.createElement("div");
      inner.style.position = "relative";

      const input = document.createElement("input");
      input.type = "password";
      input.className = "c-input";
      input.placeholder = placeholder;

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "c-password__toggle";
      toggle.textContent = "Show";
      toggle.setAttribute("aria-label", "Show password");

      const hint = document.createElement("span");
      hint.className = "c-hint";
      hint.textContent = "At least 8 characters recommended.";

      toggle.addEventListener("click", () => {
        visible = !visible;
        input.type = visible ? "text" : "password";
        toggle.textContent = visible ? "Hide" : "Show";
        toggle.setAttribute("aria-label", visible ? "Hide password" : "Show password");
        log("toggle: " + (visible ? "visible" : "hidden"));
      });

      input.addEventListener("input", () => {
        log("input: length=" + input.value.length);
      });

      inner.append(input, toggle);
      wrap.append(inner, hint);

      return {
        el: wrap,
        get value() { return input.value; },
        show() { visible = true; input.type = "text"; toggle.textContent = "Hide"; },
        hide() { visible = false; input.type = "password"; toggle.textContent = "Show"; }
      };
    }

    document.getElementById("mount").appendChild(createPasswordInput({}).el);
  </script>
</body>
</html>
