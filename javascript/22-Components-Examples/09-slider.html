<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>09 — Slider | phpkingdom.com</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    .c-slider { max-width: 360px; display: grid; gap: 0.5rem; }
    .c-slider__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-weight: 500;
    }
    .c-slider__value {
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--accent-ink);
      background: var(--accent-soft);
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
    }
    .c-slider__input {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .c-slider__ticks {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← Components</a>
    <h1>09 — Slider</h1>
    <p class="lead">Range slider with live value display and min/max labels.</p>
    <section class="panel">
      <h2>Demo</h2>
      <div id="mount"></div>
    </section>
    <section class="panel">
      <h2>Events / State</h2>
      <pre class="log" id="log">Ready.</pre>
    </section>
  </main>
  <script>
    const logEl = document.getElementById("log");
    function log(msg) { logEl.textContent = msg; }

    function createSlider({ label = "Volume", min = 0, max = 100, value = 50, step = 1 } = {}) {
      const wrap = document.createElement("div");
      wrap.className = "c-slider";

      const header = document.createElement("div");
      header.className = "c-slider__header";
      const lbl = document.createElement("span");
      lbl.textContent = label;
      const valDisplay = document.createElement("span");
      valDisplay.className = "c-slider__value";
      valDisplay.textContent = value;
      header.append(lbl, valDisplay);

      const input = document.createElement("input");
      input.type = "range";
      input.className = "c-slider__input";
      input.min = min;
      input.max = max;
      input.step = step;
      input.value = value;

      const ticks = document.createElement("div");
      ticks.className = "c-slider__ticks";
      ticks.innerHTML = "<span>" + min + "</span><span>" + max + "</span>";

      input.addEventListener("input", () => {
        valDisplay.textContent = input.value;
        log("input: " + input.value);
      });
      input.addEventListener("change", () => log("change: " + input.value));

      wrap.append(header, input, ticks);

      return {
        el: wrap,
        get value() { return Number(input.value); },
        set value(v) { input.value = v; valDisplay.textContent = v; }
      };
    }

    document.getElementById("mount").appendChild(createSlider({ label: "Volume", value: 65 }).el);
  </script>
</body>
</html>
