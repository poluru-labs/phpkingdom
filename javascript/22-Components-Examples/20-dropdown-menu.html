<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>20 — Dropdown Menu | phpkingdom.com</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    .c-dropdown { position: relative; display: inline-block; }
    .c-dropdown__menu {
      position: absolute;
      z-index: 40;
      top: calc(100% + 6px);
      left: 0;
      min-width: 180px;
      margin: 0;
      padding: 0.35rem;
      list-style: none;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
    }
    .c-dropdown__menu[hidden] { display: none; }
    .c-dropdown__item {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    .c-dropdown__item:hover { background: var(--accent-soft); }
    .c-dropdown__item.is-danger { color: var(--danger); }
    .c-dropdown__sep {
      height: 1px;
      background: var(--line);
      margin: 0.35rem 0;
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← Components</a>
    <h1>20 — Dropdown Menu</h1>
    <p class="lead">Action menu triggered by a button with keyboard-friendly items.</p>
    <section class="panel">
      <h2>Demo</h2>
      <div id="mount"></div>
    </section>
    <section class="panel">
      <h2>Events / State</h2>
      <pre class="log" id="log">Ready.</pre>
    </section>
  </main>
  <script>
    const logEl = document.getElementById("log");
    function log(msg) { logEl.textContent = msg; }

    function createDropdownMenu({ label = "Actions", items = [] } = {}) {
      let open = false;

      const wrap = document.createElement("div");
      wrap.className = "c-dropdown";

      const trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "c-btn c-btn--secondary";
      trigger.textContent = label + " ▾";
      trigger.setAttribute("aria-haspopup", "menu");
      trigger.setAttribute("aria-expanded", "false");

      const menu = document.createElement("ul");
      menu.className = "c-dropdown__menu";
      menu.setAttribute("role", "menu");
      menu.hidden = true;

      function setOpen(v) {
        open = v;
        menu.hidden = !open;
        trigger.setAttribute("aria-expanded", String(open));
        if (open) log("open");
      }

      items.forEach((item) => {
        if (item === "---") {
          const sep = document.createElement("li");
          sep.className = "c-dropdown__sep";
          sep.setAttribute("role", "separator");
          menu.appendChild(sep);
          return;
        }
        const li = document.createElement("li");
        li.setAttribute("role", "none");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "c-dropdown__item" + (item.danger ? " is-danger" : "");
        btn.setAttribute("role", "menuitem");
        btn.textContent = item.label;
        btn.addEventListener("click", () => {
          setOpen(false);
          log("select: " + item.label);
          if (item.onSelect) item.onSelect();
        });
        li.appendChild(btn);
        menu.appendChild(li);
      });

      trigger.addEventListener("click", (e) => {
        e.stopPropagation();
        setOpen(!open);
      });

      document.addEventListener("click", () => { if (open) setOpen(false); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && open) setOpen(false); });

      wrap.append(trigger, menu);

      return { el: wrap, close: () => setOpen(false) };
    }

    document.getElementById("mount").appendChild(createDropdownMenu({
      label: "File",
      items: [
        { label: "New" },
        { label: "Open" },
        { label: "Save" },
        "---",
        { label: "Delete", danger: true }
      ]
    }).el);
  </script>
</body>
</html>
