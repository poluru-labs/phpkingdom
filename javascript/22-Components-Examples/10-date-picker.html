<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>10 — Date Picker | phpkingdom.com</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    .c-datepicker { position: relative; max-width: 280px; }
    .c-datepicker__trigger {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font: inherit;
      cursor: pointer;
      text-align: left;
    }
    .c-datepicker__trigger:focus-visible { outline: none; box-shadow: var(--focus); border-color: var(--accent); }
    .c-datepicker__popup {
      position: absolute;
      z-index: 30;
      top: calc(100% + 6px);
      left: 0;
      width: min(100%, 280px);
      padding: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
    }
    .c-datepicker__popup[hidden] { display: none; }
    .c-datepicker__nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.65rem;
      font-weight: 600;
    }
    .c-datepicker__nav button {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 6px;
      padding: 0.25rem 0.55rem;
      cursor: pointer;
      font: inherit;
    }
    .c-datepicker__nav button:hover { border-color: var(--accent); background: var(--accent-soft); }
    .c-datepicker__grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
      font-size: 0.85rem;
    }
    .c-datepicker__dow { color: var(--muted); font-weight: 600; padding: 0.25rem 0; font-size: 0.75rem; }
    .c-datepicker__day {
      border: none;
      background: transparent;
      border-radius: 6px;
      padding: 0.4rem 0;
      cursor: pointer;
      font: inherit;
    }
    .c-datepicker__day:hover:not(:disabled) { background: var(--accent-soft); }
    .c-datepicker__day.is-selected { background: var(--accent); color: #fff; font-weight: 600; }
    .c-datepicker__day.is-today { outline: 1px solid var(--accent); }
    .c-datepicker__day:disabled { visibility: hidden; }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← Components</a>
    <h1>10 — Date Picker</h1>
    <p class="lead">Month calendar popup with previous/next navigation and day selection.</p>
    <section class="panel">
      <h2>Demo</h2>
      <div id="mount"></div>
    </section>
    <section class="panel">
      <h2>Events / State</h2>
      <pre class="log" id="log">Ready.</pre>
    </section>
  </main>
  <script>
    const logEl = document.getElementById("log");
    function log(msg) { logEl.textContent = msg; }

    function createDatePicker({ label = "Date", value = null } = {}) {
      let selected = value ? new Date(value) : null;
      let view = selected ? new Date(selected) : new Date();
      view.setDate(1);
      let open = false;

      const wrap = document.createElement("div");
      wrap.className = "c-datepicker";

      const lbl = document.createElement("label");
      lbl.className = "field-label";
      lbl.textContent = label;

      const trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "c-datepicker__trigger";

      const popup = document.createElement("div");
      popup.className = "c-datepicker__popup";
      popup.hidden = true;

      const nav = document.createElement("div");
      nav.className = "c-datepicker__nav";
      const prevBtn = document.createElement("button");
      prevBtn.type = "button";
      prevBtn.textContent = "‹";
      prevBtn.setAttribute("aria-label", "Previous month");
      const monthLabel = document.createElement("span");
      const nextBtn = document.createElement("button");
      nextBtn.type = "button";
      nextBtn.textContent = "›";
      nextBtn.setAttribute("aria-label", "Next month");
      nav.append(prevBtn, monthLabel, nextBtn);

      const grid = document.createElement("div");
      grid.className = "c-datepicker__grid";

      function fmt(d) {
        return d.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
      }

      function fmtISO(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + day;
      }

      function renderTrigger() {
        trigger.textContent = selected ? fmt(selected) : "Pick a date";
      }

      function renderCalendar() {
        monthLabel.textContent = view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
        grid.innerHTML = "";
        ["Su","Mo","Tu","We","Th","Fr","Sa"].forEach((d) => {
          const dow = document.createElement("div");
          dow.className = "c-datepicker__dow";
          dow.textContent = d;
          grid.appendChild(dow);
        });

        const firstDay = new Date(view.getFullYear(), view.getMonth(), 1).getDay();
        const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
        const today = new Date();
        today.setHours(0,0,0,0);

        for (let i = 0; i < firstDay; i++) {
          const pad = document.createElement("button");
          pad.className = "c-datepicker__day";
          pad.disabled = true;
          grid.appendChild(pad);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "c-datepicker__day";
          btn.textContent = d;
          const cellDate = new Date(view.getFullYear(), view.getMonth(), d);
          if (selected && cellDate.toDateString() === selected.toDateString()) btn.classList.add("is-selected");
          if (cellDate.toDateString() === today.toDateString()) btn.classList.add("is-today");
          btn.addEventListener("click", () => {
            selected = cellDate;
            renderTrigger();
            renderCalendar();
            setOpen(false);
            log("select: " + fmtISO(selected));
          });
          grid.appendChild(btn);
        }
      }

      function setOpen(v) {
        open = v;
        popup.hidden = !open;
        if (open) renderCalendar();
      }

      prevBtn.addEventListener("click", () => { view.setMonth(view.getMonth() - 1); renderCalendar(); log("nav: prev month"); });
      nextBtn.addEventListener("click", () => { view.setMonth(view.getMonth() + 1); renderCalendar(); log("nav: next month"); });
      trigger.addEventListener("click", () => setOpen(!open));
      document.addEventListener("click", (e) => { if (!wrap.contains(e.target)) setOpen(false); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });

      popup.append(nav, grid);
      lbl.append(trigger, popup);
      wrap.appendChild(lbl);
      renderTrigger();

      return { el: wrap, get value() { return selected ? fmtISO(selected) : null; } };
    }

    document.getElementById("mount").appendChild(createDatePicker({}).el);
  </script>
</body>
</html>
