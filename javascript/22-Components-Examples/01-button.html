<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>01 — Button | phpkingdom.com</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    .c-btn.is-loading {
      position: relative;
      color: transparent;
      pointer-events: none;
    }
    .c-btn.is-loading::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: 1rem;
      height: 1rem;
      margin: -0.5rem 0 0 -0.5rem;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    .c-btn--secondary.is-loading::after {
      border-color: rgba(20, 33, 43, 0.2);
      border-top-color: var(--accent);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← Components</a>
    <h1>01 — Button</h1>
    <p class="lead">Factory-built buttons with variant, loading, and disabled states.</p>
    <section class="panel">
      <h2>Demo</h2>
      <div class="demo-row" id="mount"></div>
    </section>
    <section class="panel">
      <h2>Events / State</h2>
      <pre class="log" id="log">Ready.</pre>
    </section>
  </main>
  <script>
    const logEl = document.getElementById("log");
    function log(msg) { logEl.textContent = msg; }

    function createButton({ label = "Button", variant = "primary", loading = false, disabled = false, onClick } = {}) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "c-btn c-btn--" + variant;
      el.textContent = label;
      el.disabled = disabled || loading;
      if (loading) el.classList.add("is-loading");

      el.addEventListener("click", () => {
        if (onClick) onClick();
        log("click: " + label + " (" + variant + ")");
      });

      return {
        el,
        setLoading(v) {
          loading = v;
          el.disabled = disabled || loading;
          el.classList.toggle("is-loading", loading);
        },
        setDisabled(v) {
          disabled = v;
          el.disabled = disabled || loading;
        },
        get label() { return label; }
      };
    }

    const mount = document.getElementById("mount");
    [
      createButton({ label: "Primary", variant: "primary" }),
      createButton({ label: "Secondary", variant: "secondary" }),
      createButton({ label: "Ghost", variant: "ghost" }),
      createButton({ label: "Danger", variant: "danger" }),
      createButton({ label: "Loading", variant: "primary", loading: true }),
      createButton({ label: "Disabled", variant: "primary", disabled: true })
    ].forEach((btn) => mount.appendChild(btn.el));
  </script>
</body>
</html>
