<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>24 — Breadcrumb | phpkingdom.com</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    .c-breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 0.92rem;
    }
    .c-breadcrumb__item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .c-breadcrumb__item:not(:last-child)::after {
      content: "/";
      color: var(--muted);
    }
    .c-breadcrumb__link {
      color: var(--accent-ink);
      text-decoration: none;
      font-weight: 500;
      border: none;
      background: none;
      font: inherit;
      cursor: pointer;
      padding: 0;
    }
    .c-breadcrumb__link:hover { text-decoration: underline; }
    .c-breadcrumb__current {
      color: var(--muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← Components</a>
    <h1>24 — Breadcrumb</h1>
    <p class="lead">Navigation trail showing hierarchy; click segments to navigate.</p>
    <section class="panel">
      <h2>Demo</h2>
      <div id="mount"></div>
    </section>
    <section class="panel">
      <h2>Events / State</h2>
      <pre class="log" id="log">Ready.</pre>
    </section>
  </main>
  <script>
    const logEl = document.getElementById("log");
    function log(msg) { logEl.textContent = msg; }

    function createBreadcrumb({ items = [] } = {}) {
      const nav = document.createElement("nav");
      nav.setAttribute("aria-label", "Breadcrumb");

      const list = document.createElement("ol");
      list.className = "c-breadcrumb";

      function render() {
        list.innerHTML = "";
        items.forEach((item, i) => {
          const li = document.createElement("li");
          li.className = "c-breadcrumb__item";

          if (i < items.length - 1) {
            const link = document.createElement("button");
            link.type = "button";
            link.className = "c-breadcrumb__link";
            link.textContent = item.label;
            link.addEventListener("click", () => {
              log("navigate: " + item.label + (item.href ? " → " + item.href : ""));
            });
            li.appendChild(link);
          } else {
            const current = document.createElement("span");
            current.className = "c-breadcrumb__current";
            current.setAttribute("aria-current", "page");
            current.textContent = item.label;
            li.appendChild(current);
          }
          list.appendChild(li);
        });
      }

      render();
      nav.appendChild(list);

      return {
        el: nav,
        setItems(newItems) { items = newItems; render(); }
      };
    }

    document.getElementById("mount").appendChild(createBreadcrumb({
      items: [
        { label: "Home", href: "/" },
        { label: "Projects", href: "/projects" },
        { label: "Components", href: "/projects/components" },
        { label: "Button" }
      ]
    }).el);
  </script>
</body>
</html>
