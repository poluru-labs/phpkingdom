<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>46 — Drag and Drop | phpkingdom.com</title>
</head>
<body>
  <h1>46 — Drag and Drop</h1>
  <h2>Problem</h2>
  <p>Drag an item into a drop zone with HTML5 DnD events.</p>
  <h2>Demo</h2>
  <div id="item" draggable="true" style="display:inline-block;padding:8px;border:1px solid #333;cursor:grab">Drag me</div>
  <div id="zone" style="margin-top:12px;padding:24px;border:2px dashed #666">Drop here</div>
  <pre id="out"></pre>
  <script>
const item = document.getElementById("item");
const zone = document.getElementById("zone");
const out = document.getElementById("out");
item.addEventListener("dragstart", (e) => {
  e.dataTransfer.setData("text/plain", "drag-item");
});
zone.addEventListener("dragover", (e) => e.preventDefault());
zone.addEventListener("drop", (e) => {
  e.preventDefault();
  zone.appendChild(item);
  out.textContent = "dropped";
});
  </script>
</body>
</html>
