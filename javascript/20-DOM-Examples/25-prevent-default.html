<!DOCTYPE html>
<html lang="en">
<head>

  <title>25 — preventDefault | phpkingdom.com</title>
</head>
<body>
  <h1>25 — preventDefault</h1>
  <h2>Problem</h2>
  <p>Stop a link from navigating with preventDefault.</p>
  <h2>Demo</h2>
  <a id="link" href="https://example.com">Would navigate</a>
  <pre id="out"></pre>
  <script>
document.getElementById("link").addEventListener("click", (e) => {
  e.preventDefault();
  document.getElementById("out").textContent = "navigation blocked";
});
  </script>
</body>
</html>
