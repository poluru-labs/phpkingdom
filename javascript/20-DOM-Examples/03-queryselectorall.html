<body>
  <h1>03 — querySelectorAll</h1>
  <h2>Problem</h2>
  <p>Select all matching elements and collect their text.</p>
  <h2>Demo</h2>
  <p class="note">A</p><p class="note">B</p><p class="note">C</p>
  <pre id="out"></pre>
  <script>
const notes = document.querySelectorAll(".note");
const texts = [...notes].map((n) => n.textContent);
document.getElementById("out").textContent = "count=" + notes.length + " → " + texts.join(", ");
  </script>
</body>
</html>
