<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>48 — DOMContentLoaded | phpkingdom.com</title>
</head>
<body>
  <h1>48 — DOMContentLoaded</h1>
  <h2>Problem</h2>
  <p>Run code when the HTML is parsed (DOM ready).</p>
  <h2>Demo</h2>
  <p id="status">waiting…</p>
  <pre id="out"></pre>
  <script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("status").textContent = "DOM is ready";
  document.getElementById("out").textContent =
    "readyState=" + document.readyState;
});
// If this script is at end of body, readyState may already be interactive/complete.
if (document.readyState !== "loading") {
  document.getElementById("status").textContent = "already ready (" + document.readyState + ")";
}
  </script>
</body>
</html>
