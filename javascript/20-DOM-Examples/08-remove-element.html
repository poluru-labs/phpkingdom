<body>
  <h1>08 — remove / removeChild</h1>
  <h2>Problem</h2>
  <p>Remove a node from the DOM.</p>
  <h2>Demo</h2>
  <ul id="list"><li>Keep</li><li id="gone">Remove me</li><li>Keep</li></ul>
  <button id="btn">Remove</button>
  <script>
document.getElementById("btn").onclick = () => {
  const el = document.getElementById("gone");
  if (el) el.remove();
};
  </script>
</body>
