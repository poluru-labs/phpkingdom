<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>29 — Keyboard Events | phpkingdom.com</title>
</head>
<body>
  <h1>29 — Keyboard Events</h1>
  <h2>Problem</h2>
  <p>Detect Enter and Escape on a text field.</p>
  <h2>Demo</h2>
  <input id="field" placeholder="Press Enter or Escape">
  <pre id="out"></pre>
  <script>
document.getElementById("field").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    document.getElementById("out").textContent = "Enter: " + e.target.value;
  } else if (e.key === "Escape") {
    e.target.value = "";
    document.getElementById("out").textContent = "cleared";
  }
});
  </script>
</body>
</html>
