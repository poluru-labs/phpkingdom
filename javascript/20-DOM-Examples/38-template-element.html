<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>38 — HTML template Element | phpkingdom.com</title>
</head>
<body>
  <h1>38 — HTML template Element</h1>
  <h2>Problem</h2>
  <p>Clone content from a &lt;template&gt; into the page.</p>
  <h2>Demo</h2>
  <template id="tpl">
    <li class="row"><strong class="name"></strong> — <span class="role"></span></li>
  </template>
  <ul id="list"></ul>
  <button id="btn">Add from template</button>
  <script>
const people = [
  { name: "Ada", role: "Eng" },
  { name: "Lin", role: "Design" },
];
let i = 0;
document.getElementById("btn").onclick = () => {
  const person = people[i % people.length];
  i += 1;
  const node = document.getElementById("tpl").content.cloneNode(true);
  node.querySelector(".name").textContent = person.name;
  node.querySelector(".role").textContent = person.role;
  document.getElementById("list").appendChild(node);
};
  </script>
</body>
</html>
