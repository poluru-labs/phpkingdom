<body>
  <h1>26 — stopPropagation</h1>
  <h2>Problem</h2>
  <p>Stop an event from bubbling to parent listeners.</p>
  <h2>Demo</h2>
  <div id="outer" style="padding:20px;border:1px solid #333">
    Outer
    <button id="inner">Inner (stop)</button>
  </div>
  <pre id="out"></pre>
  <script>
const out = document.getElementById("out");
document.getElementById("outer").addEventListener("click", () => {
  out.textContent += "outer ";
});
document.getElementById("inner").addEventListener("click", (e) => {
  e.stopPropagation();
  out.textContent += "inner ";
});
  </script>
</body>
</html>
