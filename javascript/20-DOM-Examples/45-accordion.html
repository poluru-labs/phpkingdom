<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body>
  <h1>45 — Accordion</h1>
  <h2>Problem</h2>
  <p>Expand/collapse sections one at a time.</p>
  <h2>Demo</h2>
  <div class="acc">
    <button data-panel="1">Section 1</button>
    <div id="p1" hidden>Content one</div>
    <button data-panel="2">Section 2</button>
    <div id="p2" hidden>Content two</div>
    <button data-panel="3">Section 3</button>
    <div id="p3" hidden>Content three</div>
  </div>
  <script src="45-accordion.js"></script>
</body>
</html>
