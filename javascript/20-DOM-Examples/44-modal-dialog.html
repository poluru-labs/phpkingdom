<body>
  <h1>44 — Modal Dialog</h1>
  <h2>Problem</h2>
  <p>Open and close a modal overlay.</p>
  <h2>Demo</h2>
  <button id="open">Open modal</button>
  <div id="modal" hidden class="pk-s-position-fixed-inset-0-background-rgba-0-0-0-4-d">
    <div class="pk-s-background-fff-padding-16px-min-width-220px">
      <p>Modal content</p>
      <button id="close">Close</button>
    </div>
  </div>
  <script src="44-modal-dialog.js"></script>
</body>
