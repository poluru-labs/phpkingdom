<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>44 — Modal Dialog | phpkingdom.com</title>
</head>
<body>
  <h1>44 — Modal Dialog</h1>
  <h2>Problem</h2>
  <p>Open and close a modal overlay.</p>
  <h2>Demo</h2>
  <button id="open">Open modal</button>
  <div id="modal" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center">
    <div style="background:#fff;padding:16px;min-width:220px">
      <p>Modal content</p>
      <button id="close">Close</button>
    </div>
  </div>
  <script>
const modal = document.getElementById("modal");
document.getElementById("open").onclick = () => { modal.hidden = false; };
document.getElementById("close").onclick = () => { modal.hidden = true; };
modal.addEventListener("click", (e) => {
  if (e.target === modal) modal.hidden = true;
});
  </script>
</body>
</html>
