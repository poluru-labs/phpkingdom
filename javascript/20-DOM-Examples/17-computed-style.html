<body>
  <h1>17 — getComputedStyle</h1>
  <h2>Problem</h2>
  <p>Read the final computed CSS value for an element.</p>
  <h2>Demo</h2>
  <style>#box { color: rgb(200, 0, 0); font-size: 20px; }</style>
  <p id="box">Styled text</p>
  <pre id="out"></pre>
  <script>
const cs = getComputedStyle(document.getElementById("box"));
document.getElementById("out").textContent =
  "color=" + cs.color + "\nfont-size=" + cs.fontSize;
  </script>
</body>
