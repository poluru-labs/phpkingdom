<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>40 — Select Options | phpkingdom.com</title>
</head>
<body>
  <h1>40 — Select Options</h1>
  <h2>Problem</h2>
  <p>Read and change a &lt;select&gt; value.</p>
  <h2>Demo</h2>
  <select id="lang">
    <option value="js">JavaScript</option>
    <option value="html">HTML</option>
    <option value="css">CSS</option>
  </select>
  <button id="set">Set to CSS</button>
  <pre id="out"></pre>
  <script>
const sel = document.getElementById("lang");
function show() {
  document.getElementById("out").textContent =
    "value=" + sel.value + " text=" + sel.selectedOptions[0].textContent;
}
sel.addEventListener("change", show);
document.getElementById("set").onclick = () => {
  sel.value = "css";
  show();
};
show();
  </script>
</body>
</html>
