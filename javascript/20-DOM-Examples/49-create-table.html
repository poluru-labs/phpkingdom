<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>49 — Build a Table Dynamically | phpkingdom.com</title>
</head>
<body>
  <h1>49 — Build a Table Dynamically</h1>
  <h2>Problem</h2>
  <p>Generate table rows from an array of objects.</p>
  <h2>Demo</h2>
  <table border="1" id="tbl">
    <thead><tr><th>Name</th><th>Score</th></tr></thead>
    <tbody></tbody>
  </table>
  <button id="btn">Fill table</button>
  <script>
const rows = [
  { name: "Ada", score: 98 },
  { name: "Grace", score: 95 },
  { name: "Alan", score: 91 },
];
document.getElementById("btn").onclick = () => {
  const tbody = document.querySelector("#tbl tbody");
  tbody.replaceChildren(
    ...rows.map((r) => {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td");
      const td2 = document.createElement("td");
      td1.textContent = r.name;
      td2.textContent = String(r.score);
      tr.append(td1, td2);
      return tr;
    })
  );
};
  </script>
</body>
</html>
