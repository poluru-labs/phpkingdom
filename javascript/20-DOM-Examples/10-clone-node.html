<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>10 — cloneNode | phpkingdom.com</title>
</head>
<body>
  <h1>10 — cloneNode</h1>
  <h2>Problem</h2>
  <p>Deep-clone an element and append the copy.</p>
  <h2>Demo</h2>
  <div id="card" style="border:1px solid #333;padding:8px;display:inline-block">
    <strong>Card</strong><p>Details</p>
  </div>
  <div id="copies"></div>
  <button id="btn">Clone</button>
  <script>
document.getElementById("btn").onclick = () => {
  const copy = document.getElementById("card").cloneNode(true);
  document.getElementById("copies").appendChild(copy);
};
  </script>
</body>
</html>
