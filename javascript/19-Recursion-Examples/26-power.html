<body>
  <h1>26 — Power x^n</h1>
  <h2>Problem</h2>
  <p>Compute x raised to n recursively.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function power(x, n) {
  if (n === 0) return 1;
  return x * power(x, n - 1);
}
document.getElementById("out").textContent = "2^10 = " + power(2, 10);
  </script>
</body>
