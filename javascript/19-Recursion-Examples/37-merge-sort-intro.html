  <h1>37 — Merge Sort Intro</h1>
  <h2>Problem</h2>
  <p>Sort an array with recursive merge sort (divide and conquer).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function mergeSort(arr) {
  if (arr.length <= 1) return arr;
  const mid = Math.floor(arr.length / 2);
  const left = mergeSort(arr.slice(0, mid));
  const right = mergeSort(arr.slice(mid));
  const out = [];
  let i = 0, j = 0;
  while (i < left.length && j < right.length) {
    out.push(left[i] <= right[j] ? left[i++] : right[j++]);
  }
  return out.concat(left.slice(i)).concat(right.slice(j));
}
document.getElementById("out").textContent = mergeSort([38, 27, 43, 3, 9]).join(", ");
  </script>
