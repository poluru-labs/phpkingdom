<body>
  <h1>04 — Sum Array</h1>
  <h2>Problem</h2>
  <p>Sum all numbers in an array recursively.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function sumArray(arr, i = 0) {
  if (i >= arr.length) return 0;
  return arr[i] + sumArray(arr, i + 1);
}
const nums = [2, 4, 6, 8];
document.getElementById("out").textContent = "sum([2,4,6,8]) = " + sumArray(nums);
  </script>
</body>
