<body>
  <h1>27 — GCD (Euclid)</h1>
  <h2>Problem</h2>
  <p>Greatest common divisor using recursive Euclidean algorithm.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function gcd(a, b) {
  if (b === 0) return a;
  return gcd(b, a % b);
}
document.getElementById("out").textContent = "gcd(48, 18) = " + gcd(48, 18);
  </script>
</body>
