  <h1>29 — Count Digits</h1>
  <h2>Problem</h2>
  <p>Count how many digits a positive integer has using recursion.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function countDigits(n) {
  if (n < 10) return 1;
  return 1 + countDigits(Math.floor(n / 10));
}
document.getElementById("out").textContent = "countDigits(987654) = " + countDigits(987654);
  </script>
</body>
