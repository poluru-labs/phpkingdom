<body>
  <h1>01 — Countdown</h1>
  <h2>Problem</h2>
  <p>Print numbers from n down to 1 using recursion.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function countdown(n) {
  if (n <= 0) return [];
  return [n, ...countdown(n - 1)];
}
const result = countdown(5);
document.getElementById("out").textContent = result.join(" ");
  </script>
</body>
