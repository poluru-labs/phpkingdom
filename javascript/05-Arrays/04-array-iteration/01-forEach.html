<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>forEach | phpkingdom.com</title>
</head>
<body>
  <h1>forEach</h1>
  <p>Run a function for each item.</p>
  <pre id="out"></pre>
  <script>
const parts = [];
["a", "b", "c"].forEach((v, i) => parts.push(i + ":" + v));
document.getElementById("out").textContent = parts.join(" ");
  </script>
</body>
</html>
