<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>some every | phpkingdom.com</title>
</head>
<body>
  <h1>some and every</h1>
  <p>Boolean tests over arrays.</p>
  <pre id="out"></pre>
  <script>
const nums = [2, 4, 6];
document.getElementById("out").textContent =
  nums.every((n) => n % 2 === 0) + " / " + nums.some((n) => n > 5);
  </script>
</body>
</html>
