<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>slice splice | phpkingdom.com</title>
</head>
<body>
  <h1>slice vs splice</h1>
  <p>Copy vs mutate.</p>
  <pre id="out"></pre>
  <script>
const a = [1,2,3,4];
const copy = a.slice(1, 3);
const b = [1,2,3,4];
b.splice(1, 2, 9);
document.getElementById("out").textContent = copy + " / " + b;
  </script>
</body>
</html>
