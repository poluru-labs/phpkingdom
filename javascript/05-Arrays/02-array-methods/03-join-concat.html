<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>join concat | phpkingdom.com</title>
</head>
<body>
  <h1>join and concat</h1>
  <p>Combine values and arrays.</p>
  <pre id="out"></pre>
  <script>
const a = [1, 2];
const b = a.concat([3, 4]);
document.getElementById("out").textContent = b.join("-");
  </script>
</body>
</html>
