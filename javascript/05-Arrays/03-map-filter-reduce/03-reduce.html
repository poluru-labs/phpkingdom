<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body>
  <h1>Array reduce</h1>
  <p>Accumulate to a single value.</p>
  <pre id="out"></pre>
  <script>
const nums = [1, 2, 3, 4];
const sum = nums.reduce((acc, n) => acc + n, 0);
document.getElementById("out").textContent = String(sum);
  </script>
</body>
</html>
