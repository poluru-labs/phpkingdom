<body>
  <h1>Solution 019 — Count Vowels (19)</h1>
  <pre id="out"></pre>
  <p><a href="../Problem/index.html">Back to Problem</a></p>
  <script>
const s = "promise";
const vowels = new Set("aeiou");
let c = 0;
for (const ch of s) if (vowels.has(ch)) c++;
document.getElementById("out").textContent = String(c);
  </script>
