<body>
  <h1>17 — Digits Only Check</h1>
  <h2>Problem</h2>
  <p>Return true if string contains only digits.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function isDigitsOnly(s) {
  return /^\d+$/.test(s);
}
document.getElementById("out").textContent =
  isDigitsOnly("12345") + " / " + isDigitsOnly("12a45");
  </script>
</body>
