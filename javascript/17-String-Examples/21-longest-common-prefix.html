<body>
  <h1>21 — Longest Common Prefix</h1>
  <h2>Problem</h2>
  <p>Find the longest shared prefix among strings.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function longestCommonPrefix(strs) {
  if (!strs.length) return "";
  let prefix = strs[0];
  for (let i = 1; i < strs.length; i++) {
    while (!strs[i].startsWith(prefix)) {
      prefix = prefix.slice(0, -1);
      if (!prefix) return "";
    }
  }
  return prefix;
}
document.getElementById("out").textContent = longestCommonPrefix(["flower","flow","flight"]);
  </script>
</body>
