<body>
  <h1>32 — String to Integer (atoi lite)</h1>
  <h2>Problem</h2>
  <p>Parse an integer from a string with optional sign.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function myAtoi(s) {
  const m = s.trim().match(/^[+-]?\d+/);
  if (!m) return 0;
  return Number(m[0]);
}
document.getElementById("out").textContent =
  myAtoi("   -42") + " / " + myAtoi("4193 with words");
  </script>
</body>
