<body>
  <h1>37 — Longest Palindromic Substring</h1>
  <h2>Problem</h2>
  <p>Find the longest palindromic substring (expand around centers).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function longestPalindrome(s) {
  let best = "";
  function expand(l, r) {
    while (l >= 0 && r < s.length && s[l] === s[r]) { l--; r++; }
    return s.slice(l + 1, r);
  }
  for (let i = 0; i < s.length; i++) {
    const odd = expand(i, i);
    const even = expand(i, i + 1);
    const cur = odd.length > even.length ? odd : even;
    if (cur.length > best.length) best = cur;
  }
  return best;
}
document.getElementById("out").textContent = longestPalindrome("babad");
  </script>
</body>
