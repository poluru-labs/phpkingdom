<body>
  <h1>13 — Reverse Words in a Sentence</h1>
  <h2>Problem</h2>
  <p>Reverse word order while keeping words intact.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function reverseWords(s) {
  return s.trim().split(/\s+/).reverse().join(" ");
}
document.getElementById("out").textContent = reverseWords("learn javascript every day");
  </script>
</body>
