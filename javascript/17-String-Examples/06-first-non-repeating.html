<body>
  <h1>06 — First Non-Repeating Character</h1>
  <h2>Problem</h2>
  <p>Find the first character that appears only once.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function firstUniqueChar(s) {
  const map = {};
  for (const ch of s) map[ch] = (map[ch] || 0) + 1;
  for (const ch of s) if (map[ch] === 1) return ch;
  return null;
}
document.getElementById("out").textContent = String(firstUniqueChar("swiss"));
  </script>
</body>
