<body>
  <h1>18 — Alphabetic Check</h1>
  <h2>Problem</h2>
  <p>Return true if string contains only letters.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function isAlpha(s) {
  return /^[A-Za-z]+$/.test(s);
}
document.getElementById("out").textContent =
  isAlpha("JavaScript") + " / " + isAlpha("JS123");
  </script>
</body>
