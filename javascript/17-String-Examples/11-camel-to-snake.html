<body>
  <h1>11 — CamelCase to snake_case</h1>
  <h2>Problem</h2>
  <p>Convert camelCase identifiers to snake_case.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function camelToSnake(s) {
  return s.replace(/[A-Z]/g, (m) => "_" + m.toLowerCase());
}
document.getElementById("out").textContent = camelToSnake("phpKingdomSite");
  </script>
</body>
