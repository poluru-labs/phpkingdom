<body>
  <h1>28 — Max Frequency Character</h1>
  <h2>Problem</h2>
  <p>Find the character that appears most often.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function maxFreqChar(s) {
  const map = {};
  let best = "", bestCount = 0;
  for (const ch of s.replace(/\s/g, "")) {
    map[ch] = (map[ch] || 0) + 1;
    if (map[ch] > bestCount) { bestCount = map[ch]; best = ch; }
  }
  return best + " (" + bestCount + ")";
}
document.getElementById("out").textContent = maxFreqChar("success");
  </script>
</body>
