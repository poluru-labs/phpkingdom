<body>
  <h1>41 — Remove Adjacent Duplicates</h1>
  <h2>Problem</h2>
  <p>Repeatedly remove adjacent duplicate letters.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function removeAdjacentDuplicates(s) {
  const stack = [];
  for (const ch of s) {
    if (stack.length && stack[stack.length - 1] === ch) stack.pop();
    else stack.push(ch);
  }
  return stack.join("");
}
document.getElementById("out").textContent = removeAdjacentDuplicates("abbaca");
  </script>
</body>
