<body>
  <h1>43 — All Permutations of a String</h1>
  <h2>Problem</h2>
  <p>Generate all unique permutations (small string).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function permutations(s) {
  const out = [];
  function dfs(path, rest) {
    if (!rest.length) { out.push(path); return; }
    for (let i = 0; i < rest.length; i++) {
      dfs(path + rest[i], rest.slice(0, i) + rest.slice(i + 1));
    }
  }
  dfs("", s);
  return [...new Set(out)];
}
document.getElementById("out").textContent = permutations("abc").join(", ");
  </script>
</body>
