<!DOCTYPE html>
<html lang="en">
<head>

  <title>44 — Simple Wildcard Match (* and ?) | phpkingdom.com</title>
</head>
<body>
  <h1>44 — Simple Wildcard Match (* and ?)</h1>
  <h2>Problem</h2>
  <p>Match pattern where ? = one char and * = any sequence (DP).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function isMatch(s, p) {
  const m = s.length, n = p.length;
  const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(false));
  dp[0][0] = true;
  for (let j = 1; j <= n; j++) if (p[j - 1] === "*") dp[0][j] = dp[0][j - 1];
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (p[j - 1] === "*") dp[i][j] = dp[i][j - 1] || dp[i - 1][j];
      else if (p[j - 1] === "?" || p[j - 1] === s[i - 1]) dp[i][j] = dp[i - 1][j - 1];
    }
  }
  return dp[m][n];
}
document.getElementById("out").textContent =
  isMatch("adceb", "*a*b") + " / " + isMatch("acdcb", "a*c?b");
  </script>
</body>
</html>
