<body>
  <h1>11 — toISOString</h1>
  <h2>Problem</h2>
  <p>Serialize a Date to an ISO 8601 UTC string.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>

const d = new Date(2024, 0, 15, 14, 30, 45);
document.getElementById("out").textContent = "toISOString(): " + d.toISOString();

  </script>
</body>
