<!DOCTYPE html>

  <title>09 — getTimezoneOffset | phpkingdom.com</title>
</head>
<body>
  <h1>09 — getTimezoneOffset</h1>
  <h2>Problem</h2>
  <p>getTimezoneOffset() returns minutes to add to local time to get UTC (sign is inverted from common notation).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>

const d = new Date(2024, 0, 15, 12, 0, 0);
const offsetMin = d.getTimezoneOffset();
document.getElementById("out").textContent =
  "getTimezoneOffset(): " + offsetMin + " minutes\n" +
  "Interpretation: local = UTC " + (offsetMin <= 0 ? "+" : "-") + Math.abs(offsetMin / 60) + "h (approx)";

  </script>
</body>
</html>
