<body>
  <h1>40 — toDateString and toTimeString</h1>
  <h2>Problem</h2>
  <p>Built-in string methods for human-readable date/time parts.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>

const d = new Date(2024, 0, 15, 14, 30, 45);
document.getElementById("out").textContent =
  "toDateString(): " + d.toDateString() + "\n" +
  "toTimeString(): " + d.toTimeString();

  </script>
</body>
