  <h1>17 — Difference in Days</h1>
  <h2>Problem</h2>
  <p>Compute whole-day difference between two dates (UTC midnight trick).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>

function diffDays(a, b) {
  const utcA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const utcB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((utcB - utcA) / (1000 * 60 * 60 * 24));
}
const a = new Date(2024, 0, 15);
const b = new Date(2024, 1, 5);
document.getElementById("out").textContent = "Days from Jan 15 to Feb 5, 2024: " + diffDays(a, b);

  </script>
</body>
