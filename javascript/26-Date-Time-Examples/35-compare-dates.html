<body>
  <h1>35 — Compare Dates</h1>
  <h2>Problem</h2>
  <p>Compare instants using getTime() or subtraction.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>

const a = new Date(2024, 0, 15);
const b = new Date(2024, 0, 20);
document.getElementById("out").textContent =
  "a < b: " + (a.getTime() < b.getTime()) + "\n" +
  "a > b: " + (a.getTime() > b.getTime()) + "\n" +
  "a === b (reference): " + (a === b);

  </script>
</body>
