<body>
  <h1>03 — Format with Locale</h1>
  <h2>Problem</h2>
  <p>Format a fixed date using toLocaleDateString and toLocaleTimeString.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>

const d = new Date(2024, 0, 15, 14, 30, 45);
document.getElementById("out").textContent =
  "en-US date: " + d.toLocaleDateString("en-US") + "\n" +
  "en-US time: " + d.toLocaleTimeString("en-US") + "\n" +
  "en-GB date: " + d.toLocaleDateString("en-GB");

  </script>
</body>
</html>
