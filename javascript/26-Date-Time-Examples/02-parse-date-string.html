  <h1>02 — Parse Date String</h1>
  <h2>Problem</h2>
  <p>Parse common date string formats into Date objects.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>

const samples = [
  "2024-01-15",
  "2024-01-15T14:30:45",
  "January 15, 2024",
  "01/15/2024"
];
const lines = samples.map(s => s + " => " + new Date(s).toString());
document.getElementById("out").textContent = lines.join("\n");

  </script>
</body>
