<!DOCTYPE html>

  <title>26 — Invalid Date Check | phpkingdom.com</title>
</head>
<body>
  <h1>26 — Invalid Date Check</h1>
  <h2>Problem</h2>
  <p>Detect invalid dates with isNaN(date.getTime()).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>

const good = new Date(2024, 0, 15);
const bad = new Date("not-a-date");
function isValidDate(d) { return d instanceof Date && !isNaN(d.getTime()); }
document.getElementById("out").textContent =
  "Valid: " + isValidDate(good) + " (" + good + ")\n" +
  "Invalid: " + isValidDate(bad) + " (" + bad + ")";

  </script>
</body>
</html>
