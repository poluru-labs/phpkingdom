<body>
  <h1>05 — getMonth and getDate</h1>
  <h2>Problem</h2>
  <p>getMonth() is 0-based; getDate() is the day of the month.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>

const d = new Date(2024, 0, 15);
document.getElementById("out").textContent =
  "getMonth(): " + d.getMonth() + " (0 = January)\n" +
  "getDate(): " + d.getDate();

  </script>
</body>
