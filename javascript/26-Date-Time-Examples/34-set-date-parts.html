<body>
  <h1>34 — Set Date Parts</h1>
  <h2>Problem</h2>
  <p>Use setFullYear, setMonth, setDate, setHours to mutate a Date.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>

const d = new Date(2024, 0, 15, 10, 0, 0);
d.setFullYear(2025);
d.setMonth(5); // June
d.setDate(1);
d.setHours(18, 30, 0, 0);
document.getElementById("out").textContent = "After setters: " + d.toString();

  </script>
</body>
