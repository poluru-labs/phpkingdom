<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>40 — Negative Lookbehind (?<!) | phpkingdom.com</title>
</head>
<body>
  <h1>40 — Negative Lookbehind (?<!)</h1>
  <h2>Problem</h2>
  <p>Match 'cat' not preceded by 'wild' using negative lookbehind.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const text = "wildcat cat catalog";
const re = /(?<!wild)cat/g;
const matches = text.match(re);
document.getElementById("out").textContent =
  "text: " + text + "\n" +
  "/(?<!wild)cat/g => " + JSON.stringify(matches);
  </script>
</body>
</html>
