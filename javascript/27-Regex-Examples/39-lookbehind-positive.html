<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>39 — Positive Lookbehind (?<=) | phpkingdom.com</title>
</head>
<body>
  <h1>39 — Positive Lookbehind (?<=)</h1>
  <h2>Problem</h2>
  <p>Match a price amount only when preceded by '$'.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const text = "cost $19.99 and 19.99 units";
const re = /(?<=\$)\d+(?:\.\d{2})?/g;
const matches = text.match(re);
document.getElementById("out").textContent =
  "text: " + text + "\n" +
  "/(?<=\\$)\\d+/g => " + JSON.stringify(matches);
  </script>
</body>
</html>
