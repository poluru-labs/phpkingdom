<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <title>47 — Remove HTML Tags | phpkingdom.com</title>
</head>
<body>
  <h1>47 — Remove HTML Tags</h1>
  <h2>Problem</h2>
  <p>Strip HTML tags from a string (basic demo, not for security sanitization).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const html = "<p>Hello <strong>world</strong>!</p>";
const plain = html.replace(/<[^>]+>/g, "");
document.getElementById("out").textContent =
  "html:  " + html + "\n" +
  "plain: " + plain;
  </script>
</body>
</html>
