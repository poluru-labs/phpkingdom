<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>14 — Character Classes \d \w \s | phpkingdom.com</title>
</head>
<body>
  <h1>14 — Character Classes \d \w \s</h1>
  <h2>Problem</h2>
  <p>Use shorthand character classes for digits, word chars, and whitespace.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const text = "Room 42: user_name logged in";
const digits = text.match(/\d+/g);
const words = text.match(/\w+/g);
const spaces = text.match(/\s/g);
document.getElementById("out").textContent =
  "\\d+: " + JSON.stringify(digits) + "\n" +
  "\\w+: " + JSON.stringify(words) + "\n" +
  "\\s count: " + (spaces && spaces.length);
  </script>
</body>
</html>
