  <title>13 — DotAll Flag (s) | phpkingdom.com</title>
</head>
<body>
  <h1>13 — DotAll Flag (s)</h1>
  <h2>Problem</h2>
  <p>Make . match newline characters using the s (dotAll) flag.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const text = "start\nend";
const noDotAll = /start.end/.test(text);
const dotAll = /start.end/s.test(text);
document.getElementById("out").textContent =
  "/start.end/  => " + noDotAll + "\n" +
  "/start.end/s => " + dotAll;
  </script>
</body>
</html>
