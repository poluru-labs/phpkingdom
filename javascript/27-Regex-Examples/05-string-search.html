  <h1>05 — String.search()</h1>
  <h2>Problem</h2>
  <p>Use String.search() to find the index of the first regex match.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const text = "price: $19.99 USD";
const idx = text.search(/\$\d+(\.\d{2})?/);
document.getElementById("out").textContent =
  "text: " + text + "\n" +
  "search(/\\$\\d+(\\.\\d{2})?/) => " + idx;
  </script>
</body>
