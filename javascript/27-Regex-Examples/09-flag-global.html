<!DOCTYPE html>
<html lang="en">
<head>

  <title>09 — Global Flag (g) | phpkingdom.com</title>
</head>
<body>
  <h1>09 — Global Flag (g)</h1>
  <h2>Problem</h2>
  <p>Compare exec() behavior with and without the global flag.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const text = "aa bb aa cc aa";
const g = /aa/g;
const ng = /aa/;
const gResults = [g.exec(text), g.exec(text), g.exec(text)];
const ngResults = [ng.exec(text), ng.exec(text)];
document.getElementById("out").textContent =
  "with g:  " + JSON.stringify(gResults.map(m => m && m[0])) + "\n" +
  "without: " + JSON.stringify(ngResults.map(m => m && m[0]));
  </script>
</body>
</html>
