<body>
  <h1>17 — Anchors ^ and $</h1>
  <h2>Problem</h2>
  <p>Match start/end of string with ^ and $ anchors.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const ok = "hello";
const bad = "say hello";
document.getElementById("out").textContent =
  "/^hello$/.test('hello')     => " + /^hello$/.test(ok) + "\n" +
  "/^hello$/.test('say hello') => " + /^hello$/.test(bad);
  </script>
</body>
