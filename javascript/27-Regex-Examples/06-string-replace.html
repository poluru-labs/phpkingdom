<body>
  <h1>06 — String.replace()</h1>
  <h2>Problem</h2>
  <p>Replace the first match and all matches using replace().</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const text = "foo bar foo baz foo";
const once = text.replace(/foo/, "qux");
const all = text.replace(/foo/g, "qux");
document.getElementById("out").textContent =
  "once:  " + once + "\n" +
  "all:   " + all;
  </script>
</body>
</html>
