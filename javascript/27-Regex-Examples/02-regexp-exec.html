  <h1>02 — RegExp.exec()</h1>
  <h2>Problem</h2>
  <p>Use RegExp.exec() to find the first match and capture groups.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const text = "Order #4821 shipped on 2026-07-19";
const re = /#(\d+)/;
const match = re.exec(text);
document.getElementById("out").textContent =
  "match[0]: " + match[0] + "\n" +
  "match[1]: " + match[1] + "\n" +
  "index: " + match.index;
  </script>
</body>
