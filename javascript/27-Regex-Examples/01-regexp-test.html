<body>
  <h1>01 — RegExp.test()</h1>
  <h2>Problem</h2>
  <p>Use RegExp.test() to check whether a pattern appears in a string.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const text = "Hello, JavaScript regex!";
const re = /script/i;
const found = re.test(text);
document.getElementById("out").textContent =
  "pattern: /script/i\n" +
  "text: " + text + "\n" +
  "test() => " + found;
  </script>
</body>
