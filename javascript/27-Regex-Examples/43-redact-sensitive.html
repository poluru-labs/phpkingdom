<body>
  <h1>43 — Redact Sensitive Data</h1>
  <h2>Problem</h2>
  <p>Redact credit-card-like numbers and email addresses in logs.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const log = "User pay@mail.com paid with 4111-2222-3333-4444";
let redacted = log.replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g, "[EMAIL]");
redacted = redacted.replace(/\b\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{4}\b/g, "[CARD]");
document.getElementById("out").textContent =
  "before: " + log + "\n" +
  "after:  " + redacted;
  </script>
</body>
</html>
