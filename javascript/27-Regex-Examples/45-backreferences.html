<body>
  <h1>45 — Backreferences</h1>
  <h2>Problem</h2>
  <p>Match repeated words using a backreference to group 1.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const text = "the the quick brown brown fox";
const dupes = text.match(/\b(\w+)\s+\1\b/g);
document.getElementById("out").textContent =
  "text: " + text + "\n" +
  "duplicates: " + JSON.stringify(dupes);
  </script>
</body>
