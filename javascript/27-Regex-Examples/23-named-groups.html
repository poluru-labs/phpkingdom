<body>
  <h1>23 — Named Capture Groups</h1>
  <h2>Problem</h2>
  <p>Use (?<name>...) named groups for readable extraction.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const text = "2026-07-19";
const re = /(?<year>\d{4})-(?<month>\d{2})-(?<day>\d{2})/;
const { groups } = re.exec(text);
document.getElementById("out").textContent =
  "year:  " + groups.year + "\n" +
  "month: " + groups.month + "\n" +
  "day:   " + groups.day;
  </script>
</body>
