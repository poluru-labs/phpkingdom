  <h1>08 — Priority Queue (Min-Heap)</h1>
  <h2>Problem</h2>
  <p>Binary min-heap with insert and extractMin.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
class MinHeap {
  constructor() { this.heap = []; }
  parent(i) { return Math.floor((i - 1) / 2); }
  swap(i, j) { [this.heap[i], this.heap[j]] = [this.heap[j], this.heap[i]]; }
  insert(x) {
    this.heap.push(x);
    let i = this.heap.length - 1;
    while (i > 0 && this.heap[i] < this.heap[this.parent(i)]) {
      this.swap(i, this.parent(i));
      i = this.parent(i);
    }
  }
  extractMin() {
    if (!this.heap.length) return undefined;
    const min = this.heap[0];
    const last = this.heap.pop();
    if (this.heap.length) {
      this.heap[0] = last;
      let i = 0;
      while (true) {
        let smallest = i;
        const l = 2 * i + 1, r = 2 * i + 2;
        if (l < this.heap.length && this.heap[l] < this.heap[smallest]) smallest = l;
        if (r < this.heap.length && this.heap[r] < this.heap[smallest]) smallest = r;
        if (smallest === i) break;
        this.swap(i, smallest);
        i = smallest;
      }
    }
    return min;
  }
}
const pq = new MinHeap();
[15, 10, 20, 8, 12].forEach(n => pq.insert(n));
document.getElementById("out").textContent =
  "extractMin order: " + [pq.extractMin(), pq.extractMin(), pq.extractMin(), pq.extractMin(), pq.extractMin()].join(", ");
  </script>
</body>
