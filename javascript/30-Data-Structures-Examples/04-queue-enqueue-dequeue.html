<body>
  <h1>04 — Queue — Enqueue & Dequeue</h1>
  <h2>Problem</h2>
  <p>Array-based queue using push (enqueue) and shift (dequeue).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
class Queue {
  constructor() { this.items = []; }
  enqueue(x) { this.items.push(x); }
  dequeue() { return this.items.shift(); }
  front() { return this.items[0]; }
  size() { return this.items.length; }
}
const q = new Queue();
["A", "B", "C"].forEach(x => q.enqueue(x));
const lines = ["enqueue A,B,C", "front = " + q.front(), "dequeue = " + q.dequeue()];
lines.push("dequeue = " + q.dequeue());
lines.push("front = " + q.front());
document.getElementById("out").textContent = lines.join("\n");
  </script>
</body>
