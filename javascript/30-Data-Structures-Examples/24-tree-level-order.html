  <h1>24 — Level-Order Traversal (BFS)</h1>
  <h2>Problem</h2>
  <p>Traverse a binary tree level by level using a queue.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
class TreeNode { constructor(val, l = null, r = null) { this.val = val; this.left = l; this.right = r; } }
function levelOrder(root) {
  if (!root) return [];
  const result = [], q = [root];
  while (q.length) {
    const level = [], size = q.length;
    for (let i = 0; i < size; i++) {
      const node = q.shift();
      level.push(node.val);
      if (node.left) q.push(node.left);
      if (node.right) q.push(node.right);
    }
    result.push(level);
  }
  return result;
}
const root = new TreeNode(3, new TreeNode(9), new TreeNode(20, new TreeNode(15), new TreeNode(7)));
document.getElementById("out").textContent = "levels: " + JSON.stringify(levelOrder(root));
  </script>
</body>
