<body>
  <h1>41 — Hash Map (Map)</h1>
  <h2>Problem</h2>
  <p>Use JavaScript Map as a hash map: set, get, has, delete.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const map = new Map();
map.set("alice", 90);
map.set("bob", 85);
map.set("carol", 92);
const lines = [
  "get alice => " + map.get("alice"),
  "has bob => " + map.has("bob"),
  "size => " + map.size
];
map.delete("bob");
lines.push("after delete bob, size => " + map.size);
lines.push("keys => " + [...map.keys()].join(", "));
document.getElementById("out").textContent = lines.join("\n");
  </script>
</body>
