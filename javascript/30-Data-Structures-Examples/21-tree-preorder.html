<!DOCTYPE html>
<html lang="en">
<head>

  <title>21 — Preorder Traversal | phpkingdom.com</title>
</head>
<body>
  <h1>21 — Preorder Traversal</h1>
  <h2>Problem</h2>
  <p>Visit root, then left subtree, then right subtree.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
class TreeNode { constructor(val, l = null, r = null) { this.val = val; this.left = l; this.right = r; } }
function preorder(root, out = []) {
  if (!root) return out;
  out.push(root.val);
  preorder(root.left, out);
  preorder(root.right, out);
  return out;
}
const root = new TreeNode(1, new TreeNode(2, new TreeNode(4)), new TreeNode(3, new TreeNode(5)));
document.getElementById("out").textContent = "preorder: " + preorder(root).join(" -> ");
  </script>
</body>
</html>
