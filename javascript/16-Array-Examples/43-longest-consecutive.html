<body>
  <h1>43 — Longest Consecutive Sequence</h1>
  <h2>Problem</h2>
  <p>Length of longest consecutive elements sequence.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function longestConsecutive(nums) {
  const set = new Set(nums);
  let best = 0;
  for (const n of set) {
    if (!set.has(n - 1)) {
      let cur = n, len = 1;
      while (set.has(cur + 1)) { cur++; len++; }
      best = Math.max(best, len);
    }
  }
  return best;
}
document.getElementById("out").textContent = String(longestConsecutive([100,4,200,1,3,2]));
  </script>
</body>
