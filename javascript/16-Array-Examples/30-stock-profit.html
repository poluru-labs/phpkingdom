<!DOCTYPE html>
<html lang="en">
<head>

  <title>30 — Best Time to Buy/Sell Stock | phpkingdom.com</title>
</head>
<body>
  <h1>30 — Best Time to Buy/Sell Stock</h1>
  <h2>Problem</h2>
  <p>Max profit from one buy and one sell.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function maxProfit(prices) {
  let minPrice = Infinity, best = 0;
  for (const p of prices) {
    minPrice = Math.min(minPrice, p);
    best = Math.max(best, p - minPrice);
  }
  return best;
}
document.getElementById("out").textContent = String(maxProfit([7,1,5,3,6,4]));
  </script>
</body>
