<body>
  <h1>29 — Leaders in Array</h1>
  <h2>Problem</h2>
  <p>An element is a leader if all on its right are smaller.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function leaders(arr) {
  const out = [];
  let maxRight = -Infinity;
  for (let i = arr.length - 1; i >= 0; i--) {
    if (arr[i] >= maxRight) {
      out.push(arr[i]);
      maxRight = arr[i];
    }
  }
  return out.reverse();
}
document.getElementById("out").textContent = leaders([16,17,4,3,5,2]).join(", ");
  </script>
</body>
