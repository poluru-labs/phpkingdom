<body>
  <h1>08 — Rotate Array Left by K</h1>
  <h2>Problem</h2>
  <p>Rotate array to the left by k steps.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function rotateLeft(arr, k) {
  const n = arr.length;
  k = k % n;
  return arr.slice(k).concat(arr.slice(0, k));
}
document.getElementById("out").textContent = rotateLeft([1,2,3,4,5], 2).join(", ");
  </script>
</body>
