<body>
  <h1>09 — Two Sum</h1>
  <h2>Problem</h2>
  <p>Find indexes of two numbers that add up to a target.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function twoSum(nums, target) {
  const map = new Map();
  for (let i = 0; i < nums.length; i++) {
    const need = target - nums[i];
    if (map.has(need)) return [map.get(need), i];
    map.set(nums[i], i);
  }
  return [];
}
document.getElementById("out").textContent = "[" + twoSum([2,7,11,15], 9) + "]";
  </script>
</body>
