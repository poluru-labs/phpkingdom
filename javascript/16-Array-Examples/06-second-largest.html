<body>
  <h1>06 — Second Largest</h1>
  <h2>Problem</h2>
  <p>Find the second largest distinct number.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [10, 5, 20, 20, 8];
const unique = [...new Set(nums)].sort((a, b) => b - a);
document.getElementById("out").textContent = "second largest = " + unique[1];
  </script>
</body>
