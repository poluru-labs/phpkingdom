<body>
  <h1>05 — Remove Duplicates</h1>
  <h2>Problem</h2>
  <p>Return unique values from an array.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [1, 2, 2, 3, 3, 3, 4];
const unique = [...new Set(nums)];
document.getElementById("out").textContent = unique.join(", ");
  </script>
</body>
