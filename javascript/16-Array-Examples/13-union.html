<body>
  <h1>13 — Array Union</h1>
  <h2>Problem</h2>
  <p>Combine two arrays into unique values.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function union(a, b) {
  return [...new Set([...a, ...b])];
}
document.getElementById("out").textContent = union([1,2,3], [3,4,5]).join(", ");
  </script>
</body>
