  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }

<body>
  <h1>makeCounter Closure</h1>
  <p class="meta">Private state via closure.</p>
  <div class="note">Returned function keeps the enclosed count.</div>
  <pre id="out"></pre>

  <script>
function makeCounter() {
  let n = 0;
  return () => ++n;
}
const c = makeCounter();
document.getElementById("out").textContent = [c(), c(), c()].join(",");

  </script>
</body>
