  <h1>Arrow Function Basics</h1>
  <p>Shorter function syntax.</p>
  <pre id="out"></pre>
  <script>
const double = (n) => n * 2;
const hello = () => "hi";
document.getElementById("out").textContent = double(4) + " / " + hello();
