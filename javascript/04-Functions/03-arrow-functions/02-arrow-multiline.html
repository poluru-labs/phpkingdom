<body>
  <h1>Multiline Arrow Bodies</h1>
  <p>Use braces and return.</p>
  <pre id="out"></pre>
  <script>
const sum = (a, b) => {
  const total = a + b;
  return total;
};
document.getElementById("out").textContent = String(sum(3, 4));
  </script>
