<body>
  <h1>Arrows with Array Methods</h1>
  <p>Common map/filter style.</p>
  <pre id="out"></pre>
  <script>
const nums = [1, 2, 3, 4];
const evens = nums.filter((n) => n % 2 === 0);
document.getElementById("out").textContent = evens.join(", ");
  </script>
</body>
