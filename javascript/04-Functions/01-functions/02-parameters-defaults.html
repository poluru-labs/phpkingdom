<body>
  <h1>Default Parameters</h1>
  <p>Provide fallback argument values.</p>
  <pre id="out"></pre>
  <script>
function welcome(user = "Guest") { return "Welcome " + user; }
document.getElementById("out").textContent = welcome() + " / " + welcome("Sam");
  </script>
