<body>
  <h1>44 — switch Uses Strict Equality</h1>
  <h2>Problem / Gotcha</h2>
  <p>No coercion between case labels and the discriminant.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const x = "1";
let msg = "none";
switch (x) {
  case 1: msg = "number"; break;
  case "1": msg = "string"; break;
}
document.getElementById("out").textContent = msg;
  </script>
</body>
</html>
