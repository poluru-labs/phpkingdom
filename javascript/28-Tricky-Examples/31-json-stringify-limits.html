  <h1>31 — JSON.stringify Drops Functions/Undefined</h1>
  <h2>Problem / Gotcha</h2>
  <p>Functions and undefined are omitted.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const obj = { a: 1, b: undefined, c: function () {}, d: NaN };
document.getElementById("out").textContent = JSON.stringify(obj);
  </script>
