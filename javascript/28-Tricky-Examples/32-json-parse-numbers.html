<body>
  <h1>32 — JSON has no undefined / bigint</h1>
  <h2>Problem / Gotcha</h2>
  <p>JSON cannot represent undefined or BigInt directly.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
try {
  JSON.stringify({ n: 10n });
} catch (e) {
  document.getElementById("out").textContent =
    "BigInt stringify: " + e.message + "\n" +
    "undefined value omitted: " + JSON.stringify({ a: undefined });
}
  </script>
</body>
</html>
