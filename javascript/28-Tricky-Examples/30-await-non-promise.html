<body>
  <h1>30 — await Wraps Non-Promises</h1>
  <h2>Problem / Gotcha</h2>
  <p>await on a non-promise still works.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
(async function () {
  const v = await 7;
  document.getElementById("out").textContent = "await 7 => " + v;
})();
  </script>
</body>
