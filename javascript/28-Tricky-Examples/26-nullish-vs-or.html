<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>26 — ?? vs || | phpkingdom.com</title>
</head>
<body>
  <h1>26 — ?? vs ||</h1>
  <h2>Problem / Gotcha</h2>
  <p>|| treats 0/'' as missing; ?? only null/undefined.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
document.getElementById("out").textContent =
  "0 || 10 => " + (0 || 10) + "\n" +
  "0 ?? 10 => " + (0 ?? 10) + "\n" +
  '"" || "x" => ' + ("" || "x") + "\n" +
  '"" ?? "x" => ' + ("" ?? "x");
  </script>
</body>
</html>
