<body>
  <h1>48 — then Callback Return Values</h1>
  <h2>Problem / Gotcha</h2>
  <p>Returning a value resolves the next then; throwing rejects.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
Promise.resolve(1)
  .then((n) => n + 1)
  .then((n) => { throw new Error("boom at " + n); })
  .then(() => "skipped")
  .catch((e) => {
    document.getElementById("out").textContent = "caught: " + e.message;
  });
  </script>
</body>
