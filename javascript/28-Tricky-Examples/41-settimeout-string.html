<body>
  <h1>41 — Avoid setTimeout String Code</h1>
  <h2>Problem / Gotcha</h2>
  <p>Passing a string is like eval.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
document.getElementById("out").textContent =
  "Prefer setTimeout(() => {...}, 0)\n" +
  "Avoid setTimeout(\"doThing()\", 0)  // implicit eval";
setTimeout(() => {
  document.getElementById("out").textContent += "\n(function form works)";
}, 50);
  </script>
</body>
</html>
