  <title>49 — Array-like vs Real Array | phpkingdom.com</title>
</head>
<body>
  <h1>49 — Array-like vs Real Array</h1>
  <h2>Problem / Gotcha</h2>
  <p>arguments/NodeList are array-like; convert with Array.from.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function demo() {
  const like = arguments;
  document.getElementById("out").textContent =
    "length=" + like.length + "\n" +
    "isArray=" + Array.isArray(like) + "\n" +
    "from=" + Array.from(like).join(",");
}
demo("a", "b", "c");
  </script>
</body>
</html>
