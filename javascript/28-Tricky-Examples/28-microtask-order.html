  <title>28 — Microtasks before Timers | phpkingdom.com</title>
</head>
<body>
  <h1>28 — Microtasks before Timers</h1>
  <h2>Problem / Gotcha</h2>
  <p>Promise callbacks run before setTimeout(0).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
let log = "";
setTimeout(() => {
  log += "timeout ";
  document.getElementById("out").textContent = log;
}, 0);
Promise.resolve().then(() => {
  log += "promise ";
  document.getElementById("out").textContent = log;
});
log += "sync ";
document.getElementById("out").textContent = log;
  </script>
</body>
</html>
