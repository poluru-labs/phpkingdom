  <h1>46 — void Operator</h1>
  <h2>Problem / Gotcha</h2>
  <p>void evaluates an expression and returns undefined.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
document.getElementById("out").textContent =
  "void 0 => " + String(void 0) + "\n" +
  "void (1 + 1) => " + String(void (1 + 1));
  </script>
