  <h1>06 — [] == ![] and friends</h1>
  <h2>Problem / Gotcha</h2>
  <p>Classic coercion puzzles with arrays and booleans.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
document.getElementById("out").textContent =
  "[] == false => " + ([] == false) + "\n" +
  "[] == ![] => " + ([] == ![]) + "\n" +
  "!![] => " + (!![]) + "\n" +
  "Boolean([]) => " + Boolean([]);
  </script>
