  <title>29 — async Always Returns a Promise | phpkingdom.com</title>
</head>
<body>
  <h1>29 — async Always Returns a Promise</h1>
  <h2>Problem / Gotcha</h2>
  <p>Even returning a value wraps it in a Promise.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
async function answer() { return 42; }
const p = answer();
document.getElementById("out").textContent =
  "isPromise=" + (p instanceof Promise) + "\n";
p.then((v) => {
  document.getElementById("out").textContent += "value=" + v;
});
  </script>
</body>
</html>
