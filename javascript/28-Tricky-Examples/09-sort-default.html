  <title>09 — Array sort is Lexicographic by Default | phpkingdom.com</title>
</head>
<body>
  <h1>09 — Array sort is Lexicographic by Default</h1>
  <h2>Problem / Gotcha</h2>
  <p>Default sort converts to strings.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [10, 2, 1, 20];
document.getElementById("out").textContent =
  "default: " + [...nums].sort().join(", ") + "\n" +
  "numeric: " + [...nums].sort((a, b) => a - b).join(", ");
  </script>
</body>
</html>
