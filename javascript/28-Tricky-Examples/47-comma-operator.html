<body>
  <h1>47 — Comma Operator</h1>
  <h2>Problem / Gotcha</h2>
  <p>Evaluates left-to-right, returns the last value.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
let x = (1, 2, 3);
let y = 0;
for (let i = 0, j = 10; i < 3; i++, j--) y = j;
document.getElementById("out").textContent =
  "x=" + x + "\nfinal j-like y after loop setup demo=" + y;
  </script>
</body>
