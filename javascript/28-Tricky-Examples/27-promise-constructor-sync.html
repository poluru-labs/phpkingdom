  <title>27 — Promise Executor Runs Sync | phpkingdom.com</title>
</head>
<body>
  <h1>27 — Promise Executor Runs Sync</h1>
  <h2>Problem / Gotcha</h2>
  <p>Executor function runs immediately.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
let log = "";
log += "1 ";
new Promise((resolve) => {
  log += "2 ";
  resolve();
  log += "3 ";
}).then(() => {
  log += "5";
  document.getElementById("out").textContent = log;
});
log += "4 ";
document.getElementById("out").textContent = log;
  </script>
</body>
</html>
