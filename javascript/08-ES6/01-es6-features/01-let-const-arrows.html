<!DOCTYPE html>

<body>
  <h1>ES6 Feature Snapshot</h1>
  <p>Common modern syntax together.</p>
  <pre id="out"></pre>
  <script>
const nums = [1, 2, 3];
const doubled = nums.map((n) => n * 2);
let total = 0;
for (const n of doubled) total += n;
document.getElementById("out").textContent = doubled + " sum=" + total;
  </script>
