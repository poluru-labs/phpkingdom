<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>47 — Tiny API Client Wrapper | phpkingdom.com</title>
</head>
<body>
  <h1>47 — Tiny API Client Wrapper</h1>
  <h2>Problem</h2>
  <p>Create a reusable client with baseURL and JSON helpers.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function createClient(baseURL) {
  return {
    async get(path) {
      // const res = await fetch(baseURL + path);
      return { url: baseURL + path, method: "GET", demo: true };
    },
    async post(path, body) {
      return { url: baseURL + path, method: "POST", body, demo: true };
    }
  };
}
const api = createClient("https://api.phpkingdom.com");
Promise.all([api.get("/users"), api.post("/users", { name: "Ada" })])
  .then((calls) => {
    document.getElementById("out").textContent = JSON.stringify(calls, null, 2);
  });
  </script>
</body>
</html>
