<body>
  <h1>22 — CRUD: Delete Resource</h1>
  <h2>Problem</h2>
  <p>DELETE endpoint pattern.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
async function deleteUser(id) {
  return { deleted: true, id, status: 204 };
}
deleteUser(42).then((res) => {
  document.getElementById("out").textContent = JSON.stringify(res);
});
  </script>
