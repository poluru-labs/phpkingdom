<body>
  <h1>07 — Path Parameters</h1>
  <h2>Problem</h2>
  <p>Build REST-style URLs with resource ids.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
function userUrl(id) {
  return `/api/users/${encodeURIComponent(id)}`;
}
document.getElementById("out").textContent =
  userUrl(42) + "\n" + userUrl("ada lovelace");
  </script>
</body>
