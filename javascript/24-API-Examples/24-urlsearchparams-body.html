  <h1>24 — application/x-www-form-urlencoded</h1>
  <h2>Problem</h2>
  <p>Send form-encoded body with URLSearchParams.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const body = new URLSearchParams({
  username: "ada",
  newsletter: "yes"
});
document.getElementById("out").textContent = body.toString();
