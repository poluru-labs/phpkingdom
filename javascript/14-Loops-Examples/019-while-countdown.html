<body>
  <h1>019 — while Countdown</h1>
  <h2>Problem</h2>
  <p>Count down from N to 1 with a while loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
let n = 5;
const steps = [];
while (n > 0) { steps.push(n); n--; }
document.getElementById("out").textContent = steps.join(" → ");
  </script>
</body>
