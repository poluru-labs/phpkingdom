<body>
  <h1>044 — Print a Matrix</h1>
  <h2>Problem</h2>
  <p>Print a 2D array row by row.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const m = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];
const lines = [];
for (let r = 0; r < m.length; r++) {
  let row = "";
  for (let c = 0; c < m[r].length; c++) row += m[r][c] + " ";
  lines.push(row.trim());
}
document.getElementById("out").textContent = lines.join("\n");
  </script>
</body>
