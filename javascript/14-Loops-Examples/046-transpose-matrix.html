<body>
  <h1>046 — Transpose a Matrix</h1>
  <h2>Problem</h2>
  <p>Swap rows and columns with nested loops.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const m = [[1, 2, 3], [4, 5, 6]];
const rows = m.length, cols = m[0].length;
const t = [];
for (let c = 0; c < cols; c++) {
  t[c] = [];
  for (let r = 0; r < rows; r++) t[c][r] = m[r][c];
}
document.getElementById("out").textContent = t.map((row) => row.join(" ")).join("\n");
  </script>
</body>
