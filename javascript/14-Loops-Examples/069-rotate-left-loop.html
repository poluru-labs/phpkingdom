<body>
  <h1>069 — Rotate Left by 1</h1>
  <h2>Problem</h2>
  <p>Rotate an array left by one position using a loop approach.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const arr = [1, 2, 3, 4, 5];
const first = arr[0];
for (let i = 0; i < arr.length - 1; i++) arr[i] = arr[i + 1];
arr[arr.length - 1] = first;
document.getElementById("out").textContent = arr.join(", ");
  </script>
</body>
