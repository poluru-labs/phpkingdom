<body>
  <h1>061 — Loop Until Sentinel</h1>
  <h2>Problem</h2>
  <p>Process values until a sentinel (0) appears.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const stream = [4, 7, 2, 0, 9];
let sum = 0, i = 0;
while (i < stream.length && stream[i] !== 0) {
  sum += stream[i];
  i++;
}
document.getElementById("out").textContent = "sum before 0 = " + sum;
  </script>
</body>
