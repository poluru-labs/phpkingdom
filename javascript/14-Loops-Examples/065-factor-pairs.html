<body>
  <h1>065 — Factor Pairs</h1>
  <h2>Problem</h2>
  <p>List factor pairs of N without duplicates.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const N = 36;
const pairs = [];
for (let i = 1; i * i <= N; i++) {
  if (N % i === 0) pairs.push("(" + i + ", " + (N / i) + ")");
}
document.getElementById("out").textContent = pairs.join(" ");
  </script>
</body>
