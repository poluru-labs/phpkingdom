<!DOCTYPE html>

<body>
  <h1>021 — for…of over Array</h1>
  <h2>Problem</h2>
  <p>Iterate array values with for…of.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const fruits = ["apple", "banana", "cherry"];
const lines = [];
for (const f of fruits) lines.push(f.toUpperCase());
document.getElementById("out").textContent = lines.join("\n");
  </script>
</body>
