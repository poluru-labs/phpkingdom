<body>
  <h1>070 — Prefix Sums</h1>
  <h2>Problem</h2>
  <p>Build a prefix-sum array with a loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [2, 4, 1, 3];
const pref = [];
let running = 0;
for (const x of nums) { running += x; pref.push(running); }
document.getElementById("out").textContent = pref.join(", ");
  </script>
</body>
