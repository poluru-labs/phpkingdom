  <h1>097 — while(true) + break</h1>
  <h2>Problem</h2>
  <p>Use an infinite loop pattern with an intentional break.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
let n = 1;
const seen = [];
while (true) {
  seen.push(n);
  if (n >= 16) break;
  n *= 2;
}
document.getElementById("out").textContent = seen.join(" → ");
  </script>
</body>
