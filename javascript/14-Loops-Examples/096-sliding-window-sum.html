<body>
  <h1>096 — Sliding Window Sum</h1>
  <h2>Problem</h2>
  <p>Compute every sum of window size K.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const arr = [1, 2, 3, 4, 5];
const K = 3;
const sums = [];
for (let i = 0; i <= arr.length - K; i++) {
  let s = 0;
  for (let j = i; j < i + K; j++) s += arr[j];
  sums.push(s);
}
document.getElementById("out").textContent = "window sums = " + sums.join(", ");
  </script>
</body>
