  <h1>023 — break Early Exit</h1>
  <h2>Problem</h2>
  <p>Stop a loop early when a condition is met.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [3, 8, 2, 9, 1];
let found = -1;
for (let i = 0; i < nums.length; i++) {
  if (nums[i] === 9) { found = i; break; }
}
document.getElementById("out").textContent = "index of 9 = " + found;
  </script>
</body>
