<body>
  <h1>026 — Right Triangle of Stars</h1>
  <h2>Problem</h2>
  <p>Print a right-angled triangle pattern of *.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const N = 5;
const lines = [];
for (let i = 1; i <= N; i++) lines.push("*".repeat(i));
document.getElementById("out").textContent = lines.join("\n");
  </script>
</body>
