<body>
  <h1>032 — Maximum with for</h1>
  <h2>Problem</h2>
  <p>Find the max value by scanning with a loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [4, 17, 2, 9, 11];
let max = nums[0];
for (let i = 1; i < nums.length; i++) if (nums[i] > max) max = nums[i];
document.getElementById("out").textContent = "max = " + max;
  </script>
</body>
