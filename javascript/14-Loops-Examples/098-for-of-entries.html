<body>
  <h1>098 — for…of with entries()</h1>
  <h2>Problem</h2>
  <p>Loop index and value together via entries().</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const arr = ["a", "b", "c"];
const lines = [];
for (const [i, v] of arr.entries()) lines.push(i + ": " + v);
document.getElementById("out").textContent = lines.join("\n");
  </script>
</body>
