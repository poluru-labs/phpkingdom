<body>
  <h1>038 — Character Frequency Map</h1>
  <h2>Problem</h2>
  <p>Build a frequency object with a for…of loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const s = "banana";
const freq = {};
for (const ch of s) freq[ch] = (freq[ch] || 0) + 1;
document.getElementById("out").textContent = JSON.stringify(freq, null, 2);
  </script>
</body>
