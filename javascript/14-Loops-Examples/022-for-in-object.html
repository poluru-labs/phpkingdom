  <title>022 — for…in over Object | phpkingdom.com</title>
</head>
<body>
  <h1>022 — for…in over Object</h1>
  <h2>Problem</h2>
  <p>Iterate object keys with for…in.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const user = { name: "Ada", role: "eng", city: "London" };
const lines = [];
for (const key in user) {
  if (Object.hasOwn(user, key)) lines.push(key + "=" + user[key]);
}
document.getElementById("out").textContent = lines.join("\n");
  </script>
</body>
</html>
