<body>
  <h1>037 — Count Vowels</h1>
  <h2>Problem</h2>
  <p>Count vowels in a string with a loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const s = "Education";
const vowels = "aeiouAEIOU";
let count = 0;
for (const ch of s) if (vowels.includes(ch)) count++;
document.getElementById("out").textContent = "vowels in \"" + s + "\" = " + count;
  </script>
</body>
