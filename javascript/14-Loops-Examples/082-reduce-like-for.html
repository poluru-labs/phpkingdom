<body>
  <h1>082 — Reduce-like with for</h1>
  <h2>Problem</h2>
  <p>Accumulate a sum (manual reduce).</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [5, 5, 5, 5];
let acc = 0;
for (const x of nums) acc = acc + x;
document.getElementById("out").textContent = "acc = " + acc;
  </script>
</body>
