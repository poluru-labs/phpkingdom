<body>
  <h1>015 — Sum of Digits</h1>
  <h2>Problem</h2>
  <p>Sum every digit of a number with a while loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
let n = 9876;
let sum = 0;
while (n > 0) {
  sum += n % 10;
  n = Math.floor(n / 10);
}
document.getElementById("out").textContent = "sum digits of 9876 = " + sum;
  </script>
</body>
