<body>
  <h1>001 — Print 1 to N</h1>
  <h2>Problem</h2>
  <p>Print numbers from 1 to N using a for loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const N = 10;
let line = [];
for (let i = 1; i <= N; i++) line.push(i);
document.getElementById("out").textContent = line.join(" ");
  </script>
</body>
