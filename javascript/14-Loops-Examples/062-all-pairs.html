<body>
  <h1>062 — All Pairs (Nested)</h1>
  <h2>Problem</h2>
  <p>List every unordered pair from an array.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const arr = ["A", "B", "C", "D"];
const pairs = [];
for (let i = 0; i < arr.length; i++)
  for (let j = i + 1; j < arr.length; j++)
    pairs.push(arr[i] + arr[j]);
document.getElementById("out").textContent = pairs.join(", ");
  </script>
</body>
