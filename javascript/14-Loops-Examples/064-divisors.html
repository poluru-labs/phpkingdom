<body>
  <h1>064 — List Divisors</h1>
  <h2>Problem</h2>
  <p>Print all positive divisors of N.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const N = 36;
const divs = [];
for (let i = 1; i <= N; i++) if (N % i === 0) divs.push(i);
document.getElementById("out").textContent = divs.join(", ");
  </script>
</body>
