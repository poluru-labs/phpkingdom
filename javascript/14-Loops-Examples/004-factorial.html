<body>
  <h1>004 — Factorial</h1>
  <h2>Problem</h2>
  <p>Compute N! using a for loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const N = 6;
let fact = 1;
for (let i = 2; i <= N; i++) fact *= i;
document.getElementById("out").textContent = N + "! = " + fact;
  </script>
</body>
