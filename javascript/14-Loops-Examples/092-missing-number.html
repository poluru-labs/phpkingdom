<body>
  <h1>092 — Missing Number 1..N</h1>
  <h2>Problem</h2>
  <p>Find the missing number in 1..N with a sum loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const arr = [1, 2, 4, 5]; // N=5 missing 3
const N = 5;
let sum = 0;
for (const x of arr) sum += x;
const expected = (N * (N + 1)) / 2;
document.getElementById("out").textContent = "missing = " + (expected - sum);
  </script>
</body>
