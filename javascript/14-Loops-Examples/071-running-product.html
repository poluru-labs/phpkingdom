<body>
  <h1>071 — Running Product</h1>
  <h2>Problem</h2>
  <p>Build a running product array.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [2, 3, 4];
const out = [];
let p = 1;
for (const x of nums) { p *= x; out.push(p); }
document.getElementById("out").textContent = out.join(", ");
  </script>
</body>
