<body>
  <h1>056 — Product of Array</h1>
  <h2>Problem</h2>
  <p>Multiply all elements together with a loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [2, 3, 4];
let prod = 1;
for (const x of nums) prod *= x;
document.getElementById("out").textContent = "product = " + prod;
  </script>
</body>
