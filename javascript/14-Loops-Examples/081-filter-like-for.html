<body>
  <h1>081 — Filter-like with for</h1>
  <h2>Problem</h2>
  <p>Keep only values ≥ 10 using a for loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [3, 12, 7, 20, 9];
const kept = [];
for (const x of nums) if (x >= 10) kept.push(x);
document.getElementById("out").textContent = kept.join(", ");
  </script>
</body>
