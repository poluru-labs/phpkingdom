<body>
  <h1>052 — Binary to Decimal</h1>
  <h2>Problem</h2>
  <p>Convert a binary string to decimal with a loop.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const bin = "1011";
let dec = 0;
for (const bit of bin) dec = dec * 2 + Number(bit);
document.getElementById("out").textContent = bin + "₂ = " + dec + "₁₀";
  </script>
</body>
