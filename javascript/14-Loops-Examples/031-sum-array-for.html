<body>
  <h1>031 — Sum Array with for</h1>
  <h2>Problem</h2>
  <p>Sum array elements without reduce.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [4, 7, 2, 9];
let sum = 0;
for (let i = 0; i < nums.length; i++) sum += nums[i];
document.getElementById("out").textContent = "sum = " + sum;
  </script>
</body>
