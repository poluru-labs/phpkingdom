<body>
  <h1>073 — Split Even / Odd</h1>
  <h2>Problem</h2>
  <p>Partition numbers into even and odd arrays.</p>
  <h2>Output</h2>
  <pre id="out"></pre>
  <script>
const nums = [1, 2, 3, 4, 5, 6];
const even = [], odd = [];
for (const x of nums) (x % 2 === 0 ? even : odd).push(x);
document.getElementById("out").textContent =
  "even: " + even.join(", ") + "\nodd: " + odd.join(", ");
  </script>
</body>
