<body>
  <h1>Case Sensitivity</h1>
  <p>JavaScript identifiers are case-sensitive.</p>
  <pre id="out"></pre>
  <script>
let name = "Ada";
let Name = "Grace";
document.getElementById("out").textContent = name + " / " + Name;
  </script>
</body>
