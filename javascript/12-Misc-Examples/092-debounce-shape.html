<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>092 — Debounce shape | phpkingdom.com</title>
</head>
<body>
  <h1>092 — Debounce shape</h1>
  <pre id="out"></pre>
  <script>
function debounce(fn,ms){let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);};} document.getElementById("out").textContent="debounce helper ready";
  </script>
</body>
</html>
