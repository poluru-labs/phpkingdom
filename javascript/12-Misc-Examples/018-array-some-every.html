<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>018 — some/every | phpkingdom.com</title>
</head>
<body>
  <h1>018 — some/every</h1>
  <pre id="out"></pre>
  <script>
const a=[2,4,6]; document.getElementById("out").textContent=a.some(n=>n>5)+"/"+a.every(n=>n%2===0);
  </script>
</body>
</html>
