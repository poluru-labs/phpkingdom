<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Attributes — Boolean Attributes | phpkingdom</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 720px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.5rem; }
    code, pre { font-family: ui-monospace, "Cascadia Code", monospace; background: #f4f4f4; }
    pre { padding: 0.85rem 1rem; overflow-x: auto; border-left: 3px solid #2a6f97; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #eef4f8; }
    form { display: grid; gap: 0.75rem; max-width: 420px; }
    label { display: grid; gap: 0.25rem; }
    input, select, textarea, button { font: inherit; padding: 0.4rem 0.55rem; }
    button { cursor: pointer; background: #2a6f97; color: #fff; border: 0; padding: 0.55rem 1rem; }
    .note { background: #f0f7fb; padding: 0.75rem 1rem; border-left: 3px solid #2a6f97; margin: 1rem 0; }
    img { max-width: 100%; height: auto; }
    nav a { margin-right: 0.75rem; }
  </style>
</head>
<body>
  <h1>Boolean Attributes</h1>
  <p class="meta">Boolean attributes are true when present.</p>

  <form>
    <label>
      Username
      <input type="text" name="user" required>
    </label>
    <label>
      Newsletter
      <input type="checkbox" name="news" checked>
    </label>
    <label>
      Country
      <select name="country">
        <option value="">Choose…</option>
        <option value="in" selected>India</option>
        <option value="us">USA</option>
      </select>
    </label>
    <button type="submit" disabled>Submit (disabled)</button>
  </form>
  <div class="note"><code>required</code>, <code>checked</code>, <code>selected</code>, and <code>disabled</code> are boolean attributes.</div>

</body>
</html>
