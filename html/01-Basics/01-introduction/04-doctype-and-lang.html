  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 720px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }

    code, pre { font-family: ui-monospace, "Cascadia Code", monospace; background: #f4f4f4; }

    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }

    label { display: grid; gap: 0.25rem; }

<body>
  <h1>DOCTYPE and lang</h1>
  <p class="meta">Every HTML5 page starts with a doctype and a language hint.</p>
<div class="note">The doctype puts the browser in standards mode. <code>lang</code> helps screen readers and translation tools.</div><pre>&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
  &lt;head&gt;…&lt;/head&gt;
  &lt;body&gt;…&lt;/body&gt;
&lt;/html&gt;</pre><p>This document’s root language is <strong>en</strong>.</p>
</body>
