<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML SEO — Image Alt Text | phpkingdom</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 720px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    h2 { font-size: 1.25rem; margin-top: 1.5rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.5rem; }
    code, pre { font-family: ui-monospace, "Cascadia Code", monospace; background: #f4f4f4; }
    pre { padding: 0.85rem 1rem; overflow-x: auto; border-left: 3px solid #2a6f97; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #eef4f8; }
    form { display: grid; gap: 0.75rem; max-width: 420px; }
    label { display: grid; gap: 0.25rem; }
    input, select, textarea, button { font: inherit; padding: 0.4rem 0.55rem; }
    button, input[type="submit"], input[type="reset"] { cursor: pointer; background: #2a6f97; color: #fff; border: 0; padding: 0.55rem 1rem; }
    .note { background: #f0f7fb; padding: 0.75rem 1rem; border-left: 3px solid #2a6f97; margin: 1rem 0; }
    .bad { color: #8b0000; }
    .good { color: #1b5e20; }
    img { max-width: 100%; height: auto; }
    nav a { margin-right: 0.75rem; }
    header, main, footer { margin: 1rem 0; }
    footer { border-top: 1px solid #ccc; padding-top: 1rem; font-size: 0.9rem; color: #555; }
    ul.checklist { list-style: none; padding-left: 0; }
    ul.checklist li::before { content: "[ ] "; font-family: monospace; }
  </style>

</head>
<body>
  <h1>HTML SEO — Image Alt Text</h1>
  <p class="meta">Alt text helps accessibility and gives search engines context.</p>

  <figure>
    <img src="https://placehold.co/200x120/2a6f97/fff?text=Chart" width="200" height="120" alt="Bar chart showing Q1 and Q2 sales growth">
    <figcaption>Sales chart with descriptive alt text.</figcaption>
  </figure>

  <p>Decorative spacer (empty alt):</p>
  <img src="https://placehold.co/1x1/ccc/ccc" alt="" width="1" height="1">

  <div class="note">Describe the image content or function. Do not stuff keywords. If the image is purely decorative, use <code>alt=""</code>.</div>

</body>
</html>
