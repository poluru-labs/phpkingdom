<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solution 13 — Checkboxes and Radios | phpkingdom</title>
</head>
<body>

  <form>
    <fieldset>
      <legend>Interests</legend>
      <label><input type="checkbox" name="interest" value="html"> HTML</label><br>
      <label><input type="checkbox" name="interest" value="css"> CSS</label><br>
      <label><input type="checkbox" name="interest" value="js"> JavaScript</label>
    </fieldset>
    <fieldset>
      <legend>Experience level</legend>
      <label><input type="radio" name="level" value="beginner" checked> Beginner</label><br>
      <label><input type="radio" name="level" value="intermediate"> Intermediate</label><br>
      <label><input type="radio" name="level" value="advanced"> Advanced</label>
    </fieldset>
  </form>
  <hr>
  <p><a href="../Problem/index.html">Back to Problem</a></p>

</body>
</html>
