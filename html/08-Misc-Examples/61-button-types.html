<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Types | phpkingdom</title>
</head>
<body>
  <h1>Button Types</h1>

  <form action="#">
    <p><button type="submit">Submit</button></p>
    <p><button type="reset">Reset</button></p>
    <p><button type="button" onclick="alert('Clicked!')">Button (no submit)</button></p>
  </form>

</body>
