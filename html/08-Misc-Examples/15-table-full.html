<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Table Structure | phpkingdom</title>
</head>
<body>
  <h1>Table with Caption, thead, tbody, tfoot</h1>

  <table border="1">
    <caption>Employee Directory</caption>
    <thead>
      <tr><th>ID</th><th>Name</th><th>Dept</th></tr>
    </thead>
    <tbody>
      <tr><td>1</td><td>Sam</td><td>Dev</td></tr>
      <tr><td>2</td><td>Riya</td><td>Design</td></tr>
    </tbody>
    <tfoot>
      <tr><td colspan="3">Total: 2 employees</td></tr>
    </tfoot>
  </table>

</body>
</html>
