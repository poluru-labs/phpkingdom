<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload | phpkingdom</title>
</head>
<body>
  <h1>File Upload Input</h1>

  <form>
    <p>
      <label for="avatar">Profile photo</label><br>
      <input id="avatar" type="file" name="avatar" accept="image/*">
    </p>
    <p>
      <label for="docs">Multiple documents</label><br>
      <input id="docs" type="file" name="docs" multiple>
    </p>
    <button type="submit">Upload</button>
  </form>

</body>
</html>
