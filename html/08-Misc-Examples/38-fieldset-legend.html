<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fieldset and Legend | phpkingdom</title>
</head>
<body>
  <h1>Fieldset and Legend</h1>

  <form>
    <fieldset>
      <legend>Shipping address</legend>
      <p><label>Street <input type="text" name="street"></label></p>
      <p><label>City <input type="text" name="city"></label></p>
    </fieldset>
    <p><button type="submit">Save</button></p>
  </form>

</body>
</html>
