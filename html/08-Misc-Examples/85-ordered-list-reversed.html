<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reversed Ordered List | phpkingdom</title>
</head>
<body>
  <h1>Reversed and Custom Start Lists</h1>

  <p>Countdown:</p>
  <ol reversed>
    <li>Three</li>
    <li>Two</li>
    <li>One</li>
  </ol>
  <p>Start at 10:</p>
  <ol start="10">
    <li>Item</li>
    <li>Item</li>
  </ol>

</body>
</html>
