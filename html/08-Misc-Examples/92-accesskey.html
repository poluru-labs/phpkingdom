<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesskey Attribute | phpkingdom</title>
</head>
<body>
  <h1>Accesskey Shortcut</h1>

  <p>Focus the search field with your browser's access key combo + S.</p>
  <label for="site-search">Search</label>
  <input id="site-search" type="search" name="q" accesskey="s">

</body>
</html>
