<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Scope Headers | phpkingdom</title>
</head>
<body>
  <h1>Table Header Scope</h1>

  <table border="1">
    <caption>Course schedule</caption>
    <thead>
      <tr>
        <th scope="col">Day</th>
        <th scope="col">Topic</th>
        <th scope="col">Duration</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Monday</th>
        <td>HTML Basics</td>
        <td>2h</td>
      </tr>
      <tr>
        <th scope="row">Tuesday</th>
        <td>Forms</td>
        <td>1.5h</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
