<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Mini Page | phpkingdom</title>
</head>
<body>
  <h1>Complete Mini Webpage</h1>

  <header>
    <h2>phpkingdom</h2>
    <nav>
      <a href="#">Home</a> |
      <a href="#about">About</a> |
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h3>About</h3>
      <p>Common HTML building blocks in one simple page — no CSS.</p>
      <ul>
        <li>Headings and paragraphs</li>
        <li>Lists and links</li>
        <li>Forms and tables</li>
      </ul>
    </section>

    <section id="contact">
      <h3>Contact</h3>
      <form action="#" method="post">
        <p>
          <label for="c-email">Email</label><br>
          <input id="c-email" type="email" name="email" required>
        </p>
        <p>
          <button type="submit">Subscribe</button>
        </p>
      </form>
      <address>
        <a href="mailto:mail.polurus@gmail.com">mail.polurus@gmail.com</a>
      </address>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 phpkingdom · Subrahmanyam Poluru</p>
  </footer>

</body>
</html>
