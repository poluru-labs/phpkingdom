<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockquote and Quote | phpkingdom</title>
</head>
<body>
  <h1>Blockquote and Inline Quote</h1>

  <blockquote cite="https://www.w3.org/html/">
    <p>HTML is the publishing language of the World Wide Web.</p>
  </blockquote>
  <p>Someone said, <q>Keep markup clean and meaningful.</q></p>
  <p><cite>— W3C / Common teaching phrase</cite></p>

</body>
</html>
