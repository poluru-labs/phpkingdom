<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skip Link | phpkingdom</title>
</head>
<body>
  <h1>Skip to Main Content</h1>

  <a href="#main">Skip to main content</a>
  <nav>
    <a href="#">Home</a> |
    <a href="#">Courses</a> |
    <a href="#">Blog</a>
  </nav>
  <main id="main">
    <h2>Main Content</h2>
    <p>Keyboard users can jump here using the skip link.</p>
  </main>

</body>
</html>
