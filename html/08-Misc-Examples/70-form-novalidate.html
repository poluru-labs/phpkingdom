<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Novalidate | phpkingdom</title>
</head>
<body>
  <h1>Disable Browser Validation</h1>

  <form novalidate>
    <p>
      <label for="email2">Email (required but form has novalidate)</label><br>
      <input id="email2" type="email" name="email" required>
    </p>
    <button type="submit">Submit without HTML5 validation</button>
  </form>

</body>
</html>
