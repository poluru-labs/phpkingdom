<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabindex | phpkingdom</title>
</head>
<body>
  <h1>Tabindex Examples</h1>

  <p>Custom tab order (use sparingly):</p>
  <p><a href="#" tabindex="1">First</a></p>
  <p><a href="#" tabindex="3">Third</a></p>
  <p><a href="#" tabindex="2">Second</a></p>
  <p tabindex="0">Focusable div via tabindex="0"</p>

</body>
</html>
