<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lang Attribute | phpkingdom</title>
</head>
<body>
  <h1>Language Attribute on html</h1>

  <p>This document uses <code>&lt;html lang="en"&gt;</code>.</p>
  <p lang="es">Este párrafo está en español.</p>
  <p lang="hi">यह अनुच्छेद हिंदी में है।</p>

</body>
</html>
