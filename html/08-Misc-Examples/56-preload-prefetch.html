<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preload and Prefetch | phpkingdom</title>
</head>
<body>
  <h1>Resource Hints</h1>

  <p>Common head resource hints:</p>
  <ul>
    <li><code>&lt;link rel="preload" href="font.woff2" as="font"&gt;</code></li>
    <li><code>&lt;link rel="prefetch" href="next-page.html"&gt;</code></li>
    <li><code>&lt;link rel="preconnect" href="https://fonts.googleapis.com"&gt;</code></li>
    <li><code>&lt;link rel="dns-prefetch" href="https://cdn.example.com"&gt;</code></li>
  </ul>

</body>
</html>
