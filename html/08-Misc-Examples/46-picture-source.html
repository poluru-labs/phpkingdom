<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picture Element | phpkingdom</title>
</head>
<body>
  <h1>Picture with Multiple Sources</h1>

  <picture>
    <source media="(min-width: 700px)" srcset="https://placehold.co/700x200/222/fff?text=Wide">
    <img src="https://placehold.co/320x200/444/fff?text=Narrow" alt="Responsive picture example">
  </picture>

</body>
</html>
