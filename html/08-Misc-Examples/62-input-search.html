<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Input | phpkingdom</title>
</head>
<body>
  <h1>Search Input Type</h1>

  <form action="#" method="get">
    <label for="q">Search</label>
    <input type="search" id="q" name="q" placeholder="Search tutorials…" results="5">
    <button type="submit">Go</button>
  </form>

</body>
</html>
