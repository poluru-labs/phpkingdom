<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Label For Attribute | phpkingdom</title>
</head>
<body>
  <h1>Explicit Label Association</h1>

  <form>
    <label for="fullname">Full name</label>
    <input id="fullname" type="text" name="fullname">
    <br><br>
    <label for="bio">Bio</label>
    <textarea id="bio" name="bio" rows="3" cols="40"></textarea>
  </form>

</body>
</html>
