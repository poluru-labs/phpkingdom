<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colspan and Rowspan | phpkingdom</title>
</head>
<body>
  <h1>Table Cell Spanning</h1>

  <table border="1">
    <tr>
      <th colspan="2">Schedule</th>
    </tr>
    <tr>
      <td rowspan="2">Monday</td>
      <td>HTML class</td>
    </tr>
    <tr>
      <td>Practice lab</td>
    </tr>
  </table>

</body>
</html>
