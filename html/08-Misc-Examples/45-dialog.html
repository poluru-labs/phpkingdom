<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dialog Element | phpkingdom</title>
</head>
<body>
  <h1>Native Dialog</h1>

  <button type="button" onclick="document.getElementById('info').showModal()">Open dialog</button>
  <dialog id="info">
    <p>This is a native HTML dialog.</p>
    <form method="dialog">
      <button>Close</button>
    </form>
  </dialog>

</body>
</html>
