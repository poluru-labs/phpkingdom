<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autocomplete Values | phpkingdom</title>
</head>
<body>
  <h1>Common Autocomplete Tokens</h1>

  <form autocomplete="on">
    <p><label>Name <input name="name" autocomplete="name"></label></p>
    <p><label>Email <input type="email" name="email" autocomplete="email"></label></p>
    <p><label>Tel <input type="tel" name="tel" autocomplete="tel"></label></p>
    <p><label>Street <input name="street" autocomplete="street-address"></label></p>
    <p><label>City <input name="city" autocomplete="address-level2"></label></p>
    <p><label>Country <input name="country" autocomplete="country-name"></label></p>
    <button type="submit">Save profile</button>
  </form>

</body>
</html>
