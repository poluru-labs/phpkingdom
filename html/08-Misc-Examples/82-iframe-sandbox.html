<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe Sandbox | phpkingdom</title>
</head>
<body>
  <h1>Iframe with Sandbox</h1>

  <iframe
    src="https://example.com"
    title="Sandboxed example.com"
    width="100%"
    height="220"
    sandbox="allow-scripts allow-same-origin"></iframe>

</body>
</html>
