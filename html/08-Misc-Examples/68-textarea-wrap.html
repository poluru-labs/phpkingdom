<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textarea Attributes | phpkingdom</title>
</head>
<body>
  <h1>Textarea Common Attributes</h1>

  <form>
    <label for="notes">Notes</label><br>
    <textarea id="notes" name="notes" rows="6" cols="50" maxlength="200" placeholder="Max 200 characters"></textarea>
    <p><button type="submit">Save notes</button></p>
  </form>

</body>
</html>
