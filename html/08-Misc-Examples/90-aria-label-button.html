<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARIA Label Button | phpkingdom</title>
</head>
<body>
  <h1>Icon Button with ARIA Label</h1>

  <p>
    <button type="button" aria-label="Close notification">X</button>
    <button type="button" aria-label="Add item">+</button>
  </p>
  <p>Visible text is unclear; <code>aria-label</code> explains the action to assistive tech.</p>

</body>
</html>
