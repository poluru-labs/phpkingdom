<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inline SVG | phpkingdom</title>
</head>
<body>
  <h1>Inline SVG Icon</h1>

  <p>Simple inline SVG circle:</p>
  <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blue circle">
    <circle cx="60" cy="60" r="50" fill="#2a6f97"></circle>
    <text x="60" y="66" text-anchor="middle" fill="#fff" font-size="14">OK</text>
  </svg>

</body>
</html>
