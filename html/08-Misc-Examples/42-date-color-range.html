<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Color Range Inputs | phpkingdom</title>
</head>
<body>
  <h1>Date, Color, and Range Inputs</h1>

  <form>
    <p><label>Date <input type="date" name="day"></label></p>
    <p><label>Time <input type="time" name="time"></label></p>
    <p><label>Color <input type="color" name="color" value="#336699"></label></p>
    <p><label>Volume <input type="range" name="vol" min="0" max="100" value="50"></label></p>
  </form>

</body>
</html>
