<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robots Meta | phpkingdom</title>
</head>
<body>
  <h1>Robots Meta Tag</h1>

  <p>Control crawlers:</p>
  <ul>
    <li><code>&lt;meta name="robots" content="index, follow"&gt;</code></li>
    <li><code>&lt;meta name="robots" content="noindex, nofollow"&gt;</code></li>
  </ul>

</body>
</html>
