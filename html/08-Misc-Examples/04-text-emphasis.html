<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Emphasis | phpkingdom</title>
</head>
<body>
  <h1>Common Text Emphasis</h1>

  <p><strong>Important text</strong> using strong.</p>
  <p><em>Emphasized text</em> using em.</p>
  <p><b>Bold</b>, <i>italic</i>, <u>underline</u>, <s>strikethrough</s>.</p>
  <p><small>Small print / fine print.</small></p>

</body>
</html>
