<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Readonly vs Disabled | phpkingdom</title>
</head>
<body>
  <h1>Readonly vs Disabled Inputs</h1>

  <form>
    <p>
      <label>Order ID (readonly)</label><br>
      <input type="text" name="order" value="ORD-7788" readonly>
    </p>
    <p>
      <label>Promo (disabled — not submitted)</label><br>
      <input type="text" name="promo" value="SAVE20" disabled>
    </p>
    <button type="submit">Continue</button>
  </form>

</body>
</html>
