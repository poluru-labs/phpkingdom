<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number with Step | phpkingdom</title>
</head>
<body>
  <h1>Number Input with Step</h1>

  <form>
    <label for="price">Price (step 0.25)</label>
    <input type="number" id="price" name="price" min="0" max="100" step="0.25" value="9.75">
    <button type="submit">Set</button>
  </form>

</body>
</html>
