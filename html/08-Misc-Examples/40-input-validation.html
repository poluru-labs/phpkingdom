<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Validation Attributes | phpkingdom</title>
</head>
<body>
  <h1>Common Validation Attributes</h1>

  <form>
    <p>
      <label for="uname">Username (letters, 3–12)</label><br>
      <input id="uname" name="username" required minlength="3" maxlength="12" pattern="[A-Za-z]+" title="Letters only">
    </p>
    <p>
      <label for="age">Age</label><br>
      <input id="age" type="number" name="age" min="1" max="120" required>
    </p>
    <button type="submit">Check</button>
  </form>

</body>
</html>
