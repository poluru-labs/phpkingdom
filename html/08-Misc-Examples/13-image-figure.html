<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figure with Caption | phpkingdom</title>
</head>
<body>
  <h1>Image with Figure and Caption</h1>

  <figure>
    <img
      src="https://placehold.co/360x200/555/fff?text=Sample"
      alt="Sample placeholder image"
      width="360"
      height="200">
    <figcaption>Figure: A sample caption under an image.</figcaption>
  </figure>

</body>
</html>
