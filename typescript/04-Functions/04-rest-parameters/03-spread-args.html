  <p class="meta">Match tuple types when spreading.</p>
<p>Tuples preserve arity for spreads.</p>
<pre><code class="ts">const args: [string, number] = [&quot;age&quot;, 30];
function label(k: string, v: number) {
  return k + &quot;=&quot; + v;
}
