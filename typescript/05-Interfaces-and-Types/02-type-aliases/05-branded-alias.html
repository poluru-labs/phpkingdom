  <h1>Branded Alias Peek</h1>
  <p class="meta">Nominal-ish typing with brands.</p>
<div class="note">Prevents mixing ids of different kinds.</div>
<pre><code class="ts">type UserId = string &amp; { readonly __brand: &quot;UserId&quot; };
function UserId(raw: string): UserId {
  return raw as UserId;
}</code></pre>
