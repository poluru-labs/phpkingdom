<body>
  <h1>Queue Example</h1>
  <p class="meta">Classic FIFO with preserved types.</p>
<pre><code class="ts">class Queue&lt;T&gt; {
  private data: T[] = [];
  push(item: T) { this.data.push(item); }
  pop(): T | undefined { return this.data.shift(); }
}</code></pre>
<pre id="out"></pre>
  <script>
document.getElementById('out').textContent='queue ready';
  </script>
