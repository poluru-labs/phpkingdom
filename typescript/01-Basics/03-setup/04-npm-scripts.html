<body>
  <h1>npm Scripts for tsc</h1>
  <p class="meta">Wire typecheck and build into package.json.</p>
<div class="note">Keep watch mode for local feedback loops.</div>
<pre><code class="ts">{
  &quot;scripts&quot;: {
    &quot;dev&quot;: &quot;tsc -w&quot;,
    &quot;typecheck&quot;: &quot;tsc --noEmit&quot;,
    &quot;build&quot;: &quot;tsc&quot;
  }
}</code></pre>
