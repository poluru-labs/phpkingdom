<body>
  <h1>075 — Remove readonly via mapping</h1>
  <p>Remove readonly via mapping</p>
  <pre><code class="ts">type Mutable&lt;T&gt;={ -readonly [K in keyof T]: T[K] };</code></pre>
<pre id="out"></pre>
  <script>
document.getElementById('out').textContent='Mutable';
  </script>
</body>
