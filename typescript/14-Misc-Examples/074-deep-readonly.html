<body>
  <h1>074 — Deep Readonly (custom)</h1>
  <p>Deep Readonly (custom)</p>
  <pre><code class="ts">type DR&lt;T&gt;={ readonly [K in keyof T]: DR&lt;T[K]&gt; };</code></pre>
<pre id="out"></pre>
  <script>
document.getElementById('out').textContent='DeepReadonly';
  </script>
