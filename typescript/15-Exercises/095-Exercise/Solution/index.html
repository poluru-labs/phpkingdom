  <h1>Exercise 095 — Pick keys fn — Solution</h1>
  <pre><code class="ts">function pick&lt;T, K extends keyof T&gt;(obj: T, keys: K[]): Pick&lt;T, K&gt; {
  const out = {} as Pick&lt;T, K&gt;;
  for (const k of keys) out[k] = obj[k];
  return out;
}</code></pre>
