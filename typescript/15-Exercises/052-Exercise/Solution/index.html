  <h1>Exercise 052 — fetch Todo — Solution</h1>
  <pre><code class="ts">type Todo = { id: number; title: string };
async function loadTodos(): Promise&lt;Todo[]&gt; {
  const res = await fetch(&#x27;/api/todos&#x27;);
  return (await res.json()) as Todo[];
}</code></pre>
