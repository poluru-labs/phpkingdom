  <h1>Exercise 059 — Box map — Solution</h1>
  <pre><code class="ts">class Box&lt;T&gt; {
  constructor(public value: T) {}
  map&lt;U&gt;(fn: (v: T) =&gt; U): Box&lt;U&gt; {
    return new Box(fn(this.value));
  }
}</code></pre>
