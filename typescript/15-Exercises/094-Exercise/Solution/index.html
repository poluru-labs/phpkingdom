  <h1>Exercise 094 — Switch exhaustive — Solution</h1>
  <pre><code class="ts">type Kind = &#x27;a&#x27; | &#x27;b&#x27;;
function f(k: Kind) {
  switch (k) {
    case &#x27;a&#x27;: return 1;
    case &#x27;b&#x27;: return 2;
    default: {
      const _: never = k;
      return _;
    }
  }
}</code></pre>
