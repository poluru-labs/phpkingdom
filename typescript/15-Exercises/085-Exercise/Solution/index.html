  <h1>Exercise 085 — exact Result unwrap — Solution</h1>
  <pre><code class="ts">type Result&lt;T&gt; = { ok: true; value: T } | { ok: false; error: string };
function unwrap&lt;T&gt;(r: Result&lt;T&gt;): T {
  if (r.ok) return r.value;
  throw new Error(r.error);
}</code></pre>
