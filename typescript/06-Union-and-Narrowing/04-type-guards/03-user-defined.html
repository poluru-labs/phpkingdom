  <h1>User-Defined Type Guards</h1>
  <p class="meta">Predicates with parameter is Type.</p>
<p>Centralize validation for unknown inputs.</p>
<pre><code class="ts">type User = { kind: &quot;user&quot;; name: string };
function isUser(v: unknown): v is User {
  return typeof v === &quot;object&quot; &amp;&amp; v !== null &amp;&amp; (v as User).kind === &quot;user&quot;;
}</code></pre>
