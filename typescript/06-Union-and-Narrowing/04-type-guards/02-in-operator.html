<body>
  <h1>in Operator</h1>
  <p class="meta">Check for a property before access.</p>
<p>Handy for duck-typed object unions.</p>
<pre><code class="ts">type Fish = { swim: () =&gt; void };
type Bird = { fly: () =&gt; void };
function move(a: Fish | Bird) {
  if (&quot;swim&quot; in a) a.swim();
  else a.fly();
}</code></pre>
