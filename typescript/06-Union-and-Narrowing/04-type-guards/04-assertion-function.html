  <h1>Assertion Functions</h1>
  <p class="meta">asserts keyword narrows after call.</p>
<div class="note">Throws on failure; narrows on success.</div>
<pre><code class="ts">function assertString(v: unknown): asserts v is string {
  if (typeof v !== &quot;string&quot;) throw new Error(&quot;string expected&quot;);
}
function demo(v: unknown) {
  assertString(v);
  return v.toUpperCase();
}</code></pre>
