  <h1>Union to Intersection Trick</h1>
  <p class="meta">Advanced helper pattern.</p>
<div class="note">Used in some library type utilities.</div>
<pre><code class="ts">type UnionToIntersection&lt;U&gt; = (
  U extends any ? (k: U) =&gt; void : never
) extends (k: infer I) =&gt; void
  ? I
  : never;
type T = UnionToIntersection&lt;{ a: 1 } | { b: 2 }&gt;; // {a:1} &amp; {b:2}</code></pre>
