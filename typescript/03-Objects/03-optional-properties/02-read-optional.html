<body>
  <h1>Reading Optional Props</h1>
  <p class="meta">Narrow or use defaults before use.</p>
<pre><code class="ts">type Opts = { timeout?: number };
function run(o: Opts) {
  const t = o.timeout ?? 1000;
  return t;
}</code></pre>
<pre id="out"></pre>
  <script>
document.getElementById('out').textContent=String((undefined ?? 1000));
  </script>
