  <h1>Prefer Map When Dynamic</h1>
  <p class="meta">Maps keep key/value types clearer.</p>
<div class="note">Avoid string-index bags for open-ended data.</div>
<pre><code class="ts">const scores = new Map&lt;string, number&gt;();
scores.set(&quot;ada&quot;, 98);
const n = scores.get(&quot;ada&quot;); // number | undefined</code></pre>
