  <h1>readonly vs const</h1>
  <p class="meta">const is binding; readonly is property.</p>
<div class="note">Both matter for immutability habits.</div>
<pre><code class="ts">const point = { x: 1, y: 2 };
point.x = 9; // ok — binding is const, object mutable
type P = { readonly x: number; readonly y: number };
const p: P = { x: 1, y: 2 };
// p.x = 9; // Error</code></pre>
