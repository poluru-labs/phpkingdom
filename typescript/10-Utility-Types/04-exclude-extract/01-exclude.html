<body>
  <h1>Exclude&lt;T, U&gt;</h1>
  <p class="meta">Remove union members assignable to U.</p>
<p>Works on any union, not only strings.</p>
<pre><code class="ts">type T = &quot;a&quot; | &quot;b&quot; | &quot;c&quot;;
type U = Exclude&lt;T, &quot;a&quot;&gt;; // &quot;b&quot; | &quot;c&quot;</code></pre>
