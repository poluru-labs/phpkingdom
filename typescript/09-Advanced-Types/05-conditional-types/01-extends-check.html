  <h1>T extends U ? X : Y</h1>
  <p class="meta">Branch on type relationships.</p>
<p>Distributes over naked type params.</p>
<pre><code class="ts">type IsString&lt;T&gt; = T extends string ? true : false;
type A = IsString&lt;&quot;hi&quot;&gt;; // true
type B = IsString&lt;number&gt;; // false</code></pre>
