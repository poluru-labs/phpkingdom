<body>
  <h1>Why import.meta</h1>
  <p class="meta">Module-local metadata without globals.</p>
<ul>
  <li>Resolve relative assets next to the module</li>
  <li>Pass env flags from bundlers</li>
  <li>Avoid polluting globalThis</li>
</ul>
