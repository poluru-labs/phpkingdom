<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Map set/get | phpkingdom.com</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }
    h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .note { background: #f5f3ff; padding: 0.75rem 1rem; border-left: 3px solid #6d28d9; margin: 1rem 0; }
    pre, code { font-family: ui-monospace, Menlo, monospace; }
    pre { background: #111827; color: #e5e7eb; padding: 0.85rem 1rem; overflow: auto; }
    #out { white-space: pre-wrap; background: #f4f4f4; padding: 0.75rem; min-height: 2rem; }

  </style>
</head>
<body>
  <h1>Map set/get</h1>
  <p class="meta">Any key type, including objects.</p>
<pre id="out"></pre>
  <script>
const m = new Map();
m.set("a", 1);
m.set(1, "one");
document.getElementById("out").textContent =
  m.get("a") + "," + m.get(1) + " size=" + m.size;
  </script>
</body>
