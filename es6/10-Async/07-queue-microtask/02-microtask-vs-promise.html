  <style>
    body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1a1a1a; }

</style>

<body>
  <h1>vs Promise.then</h1>
  <p class="meta">Same queue family as promise reactions.</p>
<pre id="out"></pre>
  <script>
const log = [];
queueMicrotask(() => log.push(1));
Promise.resolve().then(() => log.push(2));
queueMicrotask(() => {
  log.push(3);
  document.getElementById("out").textContent = log.join(",");
});
  </script>
</body>
