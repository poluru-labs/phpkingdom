<body>
  <div class="pk-wrap">

    <div class="pk-note">Native &lt;select&gt; inherits font; set text size and width explicitly.</div>    <div class="pk-demo">
<label class="block text-sm font-medium mb-1" for="plan">Plan</label><select id="plan" class="w-full max-w-sm border border-slate-300 rounded-md px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500"><option>Free</option><option selected>Pro</option><option>Team</option></select>
