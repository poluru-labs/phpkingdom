<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Peer-based switch UI.">
  <title>Toggle Look | phpkingdom.com</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  body{background:#f8fafc}
  .pk-wrap{max-width:920px;margin:0 auto;padding:1.25rem 1rem 2.5rem}
  .pk-brand{color:#0f766e;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;font-weight:700}
  .pk-meta{color:#64748b}
  .pk-note{border-left:3px solid #0f766e;background:#ecfdf5;padding:.75rem 1rem;margin:1rem 0}
  .pk-demo{background:#fff;border:1px solid #e2e8f0;border-radius:.5rem;padding:1rem;margin:1rem 0}
  pre.code{background:#0f172a;color:#e2e8f0;padding:.85rem 1rem;border-radius:.4rem;overflow:auto;font-size:.88rem}
</style>
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="text-sm mb-1"><a class="text-teal-700 underline" href="../../index.html">Tailwind CSS Tutorials</a></p>
    <h1 class="text-2xl font-bold mt-2 text-slate-900">Toggle Look</h1>
    <p class="pk-meta mb-4">Peer-based switch UI.</p>
    <div class="pk-demo">
<label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" class="sr-only peer" checked><div class="w-11 h-6 bg-slate-300 peer-checked:bg-teal-600 rounded-full transition after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div><span class="ml-3 text-sm font-medium">Enabled</span></label>
    </div>
  </div>
