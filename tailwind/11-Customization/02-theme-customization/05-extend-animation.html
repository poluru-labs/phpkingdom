<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Subrahmanyam Poluru">
  <meta name="description" content="Custom keyframes via theme.">
  <title>Extend Animation | phpkingdom.com</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  body{background:#f8fafc}
  .pk-wrap{max-width:920px;margin:0 auto;padding:1.25rem 1rem 2.5rem}
  .pk-brand{color:#0f766e;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;font-weight:700}
  .pk-meta{color:#64748b}
  .pk-note{border-left:3px solid #0f766e;background:#ecfdf5;padding:.75rem 1rem;margin:1rem 0}
  .pk-demo{background:#fff;border:1px solid #e2e8f0;border-radius:.5rem;padding:1rem;margin:1rem 0}
  pre.code{background:#0f172a;color:#e2e8f0;padding:.85rem 1rem;border-radius:.4rem;overflow:auto;font-size:.88rem}
</style>
</head>
<body>
  <div class="pk-wrap">
    <div class="pk-brand">phpkingdom.com</div>
    <p class="text-sm mb-1"><a class="text-teal-700 underline" href="../../index.html">Tailwind CSS Tutorials</a></p>
    <h1 class="text-2xl font-bold mt-2 text-slate-900">Extend Animation</h1>
    <p class="pk-meta mb-4">Custom keyframes via theme.</p>
    <pre class="code"><code>theme: {
  extend: {
    keyframes: { wiggle: { &#x27;0%,100%&#x27;: { transform: &#x27;rotate(-3deg)&#x27; }, &#x27;50%&#x27;: { transform: &#x27;rotate(3deg)&#x27; } } },
    animation: { wiggle: &#x27;wiggle 1s ease-in-out infinite&#x27; },
  },
}</code></pre>
  </div>
</body>
</html>
